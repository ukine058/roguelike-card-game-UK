<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灰燼の書庫 -Ashbound Codex-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #14110F;
    --bg-panel: #1D1812;
    --bg-panel-raised: #262019;
    --line: #3A3025;
    --parchment: #EDE3D0;
    --parchment-dim: #C9BC9F;
    --ink: #211C16;
    --ink-soft: #4a4030;
    --ember: #C1502E;
    --ember-dim: #7a3620;
    --steel: #4C7A8C;
    --steel-dim: #33525e;
    --violet: #7A5FA0;
    --violet-dim: #4f3d6a;
    --gold: #D4A73E;
    --hp-red: #A63A3A;
    --poison-green: #6C8A3E;
    --card-face: #EDE3D0; --card-face-hi: #f2e9d8;   /* カード・説明ポップアップの地の色 */
    --glow1: #2a2015; --glow2: #1a1410;               /* 背景の光 */
    --hp-red-dim: #7a2020;
    --primary: #c1502e; --primary-dim: #93381e; --primary-border: #7a3620;   /* 強調ボタン */
    --font-display: 'Shippori Mincho', serif;
    --font-en: 'Cormorant Garamond', serif;
    --font-ui: 'Zen Kaku Gothic New', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, var(--glow1) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, var(--glow2) 0%, transparent 55%),
      var(--bg-void);
    color:var(--parchment);
    font-family:var(--font-ui);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:16px;
  }
  #app{ width:100%; max-width:960px; }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0;}
  .eyebrow{ font-family:var(--font-en); letter-spacing:.04em; color:var(--parchment-dim); font-size:13px; margin:0 0 4px;}
  button{
    font-family:var(--font-ui);
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--bg-panel-raised);
    color:var(--parchment);
    border-radius:3px;
    padding:10px 18px;
    font-size:14px;
    transition:all .12s ease;
  }
  button:hover:not(:disabled){ border-color:var(--gold); color:var(--gold); }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  button.primary{ background:linear-gradient(180deg,var(--primary),var(--primary-dim)); border-color:var(--primary-border); color:#f5e9d8; font-weight:600;}
  button.primary:hover:not(:disabled){ color:#fff; border-color:var(--gold); }
  button.ghost{ background:transparent; }
  input[type=text],input[type=number],select,textarea{
    background:var(--bg-void); border:1px solid var(--line); color:var(--parchment);
    padding:8px 10px; border-radius:3px; font-family:var(--font-ui); font-size:14px; width:100%;
  }
  label{ font-size:12.5px; color:var(--parchment-dim); display:block; margin-bottom:4px;}
  .field{ margin-bottom:12px; }
  .row{ display:flex; gap:12px; }
  .row > .field{ flex:1; }
  .hidden{ display:none !important; }
  .screen{ animation:fadein .25s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---------- Home ---------- */
  .home-hero{ text-align:center; padding:60px 20px 40px; }
  .home-hero .eyebrow{ text-align:center; }
  .home-hero h1{ font-size:44px; color:var(--parchment); }
  .home-hero .sub{ font-family:var(--font-en); font-style:italic; color:var(--parchment-dim); font-size:18px; margin-top:6px;}
  .home-actions{ display:flex; flex-direction:column; gap:10px; max-width:280px; margin:36px auto 0; }
  .home-actions button{ padding:14px; font-size:15px; }
  .home-foot{ text-align:center; color:var(--ink-soft); font-size:12px; margin-top:30px;}

  /* ---------- Top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .topbar h2{ font-size:20px; }
  .topbar .eyebrow{ margin:0; }

  /* ---------- Card visual ---------- */
  .card{
    width:150px; min-width:150px; height:210px; border-radius:8px;
    background:linear-gradient(180deg,var(--card-face-hi),var(--card-face));
    color:var(--ink); position:relative; display:flex; flex-direction:column;
    border:2px solid #8a7752; box-shadow:0 4px 10px rgba(0,0,0,.4);
    overflow:hidden; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
    flex-shrink:0;
  }
  .card:hover{ transform:translateY(-10px); box-shadow:0 12px 20px rgba(0,0,0,.5); }
  .card.unplayable{ filter:grayscale(.6) brightness(.7); cursor:default; }
  .card.unplayable:hover{ transform:none; }
  .card .banner{ height:34px; display:flex; align-items:center; padding:0 10px; }
  .card.type-attack .banner{ background:linear-gradient(90deg,var(--ember),var(--ember-dim)); }
  .card.type-skill .banner{ background:linear-gradient(90deg,var(--steel),var(--steel-dim)); }
  .card.type-power .banner{ background:linear-gradient(90deg,var(--violet),var(--violet-dim)); }
  .card .cost{
    position:absolute; top:6px; left:6px; width:26px; height:26px; border-radius:50%;
    background:var(--ink); color:var(--gold); font-family:var(--font-en); font-weight:700;
    display:flex; align-items:center; justify-content:center; font-size:14px; border:2px solid var(--gold); z-index:2;
  }
  .card .name{ color:#fff; font-family:var(--font-display); font-size:12.5px; font-weight:700; padding-left:24px; line-height:1.2; }
  .card .art{ flex:1; background:repeating-linear-gradient(135deg,#dfd2b6,#dfd2b6 8px,#d4c5a4 8px,#d4c5a4 16px); position:relative;}
  .card.type-attack .art{ background:repeating-linear-gradient(135deg,#e7cdb8,#e7cdb8 8px,#dcb99a 8px,#dcb99a 16px);}
  .card.type-skill .art{ background:repeating-linear-gradient(135deg,#cfe0e3,#cfe0e3 8px,#c0d4d8 8px,#c0d4d8 16px);}
  .card.type-power .art{ background:repeating-linear-gradient(135deg,#ded3ea,#ded3ea 8px,#d0c0e0 8px,#d0c0e0 16px);}
  .card .desc{ font-size:11px; line-height:1.35; padding:7px 8px; background:var(--card-face); min-height:56px;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; overflow:hidden; }
  .card .desc .desc-prefix{ font-style:italic; color:var(--ink-soft); }
  /* ---------- サイドメニュー（ハンバーガー） ---------- */
  #nav-burger{ position:fixed; top:8px; left:8px; z-index:900; width:38px; height:38px; padding:0; display:none; align-items:center; justify-content:center;
    font-size:20px; line-height:1; border-radius:6px; background:var(--bg-void); color:var(--parchment); border:1px solid var(--line); cursor:pointer; }
  body.has-burger #nav-burger{ display:flex; }
  body.has-burger #app{ padding-top:46px; box-sizing:border-box; }
  body.modal-open #nav-burger{ display:none; }
  #nav-backdrop{ position:fixed; inset:0; z-index:950; background:rgba(0,0,0,.55); display:none; }
  #nav-drawer{ position:fixed; top:0; left:0; bottom:0; z-index:960; width:260px; max-width:82vw; background:var(--bg-void); border-right:1px solid var(--line);
    box-shadow:6px 0 24px rgba(0,0,0,.6); transform:translateX(-105%); transition:transform .18s ease; padding:14px 10px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
  body.nav-open #nav-drawer{ transform:none; }
  body.nav-open #nav-backdrop{ display:block; }
  #nav-drawer .nav-title{ font-size:12px; color:var(--parchment-dim); letter-spacing:.08em; margin:0 6px 8px; }
  #nav-drawer button.nav-item{ text-align:left; width:100%; padding:10px 12px; background:transparent; border:1px solid transparent; border-radius:6px; color:var(--parchment); font-size:14px; cursor:pointer; }
  #nav-drawer button.nav-item:hover{ background:rgba(255,255,255,.06); }
  #nav-drawer button.nav-item.current{ border-color:var(--blk); color:var(--blk); }
  #fx-layer{ position:fixed; inset:0; z-index:2400; pointer-events:none; overflow:hidden; }
  .fx-num{ position:fixed; font-weight:800; font-size:26px; line-height:1; color:var(--c,#fff); white-space:nowrap; opacity:0;
    text-shadow:0 0 3px #000, 0 2px 4px rgba(0,0,0,.85), 0 0 10px var(--c,#fff); animation:fxrise var(--d,1.1s) ease-out forwards; }
  .fx-num.lg{ font-size:34px; } .fx-num.sm{ font-size:19px; }
  @keyframes fxrise{
    0%{ opacity:0; transform:translate(calc(-50% + var(--dx,0px)),10px) scale(.55); }
    14%{ opacity:1; transform:translate(calc(-50% + var(--dx,0px)),-6px) scale(1.3); }
    30%{ transform:translate(calc(-50% + var(--dx,0px)),-14px) scale(1); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--dx,0px)),-62px) scale(1); } }
  .fx-burst{ position:fixed; border-radius:50%; display:flex; align-items:center; justify-content:center; opacity:0;
    background:radial-gradient(circle, var(--c) 0%, transparent 68%); animation:fxburst var(--d,.5s) ease-out forwards; }
  .fx-burst span{ font-size:30px; text-shadow:0 0 6px #000; }
  .fx-burst.ring{ background:none; border:3px solid var(--c); box-shadow:0 0 12px var(--c); }
  @keyframes fxburst{ 0%{ opacity:.95; transform:translate(-50%,-50%) scale(.3); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1.2); } }
  .fx-aura{ position:fixed; border-radius:50%; border:3px solid var(--c); box-shadow:0 0 14px var(--c), inset 0 0 14px var(--c); opacity:0; animation:fxaura var(--d,.8s) ease-out forwards; }
  @keyframes fxaura{ 0%{ opacity:.9; transform:translate(-50%,-50%) scale(.6); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1.5); } }
  .status-chip.el-weak{ border-color:#c0392b; } .status-chip.el-resist{ border-color:#5B9BD5; }
  .fx-num.simple{ animation-name:fxfade; }
  @keyframes fxfade{ 0%{ opacity:0; transform:translate(-50%,0); } 20%{ opacity:1; transform:translate(-50%,0); } 100%{ opacity:0; transform:translate(-50%,0); } }
  #dlg-layer{ position:fixed; inset:0; z-index:2500; cursor:pointer; opacity:0; transition:opacity .22s ease; -webkit-tap-highlight-color:transparent; }
  #dlg-layer.on{ opacity:1; }
  .dlg-bubble{ position:fixed; width:max-content; max-width:min(320px,88vw); box-sizing:border-box; padding:18px 16px; border-radius:10px; background:var(--bg-panel); color:var(--parchment);
    border:1px solid var(--gold); box-shadow:0 10px 26px rgba(0,0,0,.6); font-size:14px; line-height:1.55; text-align:right; transform:translateY(6px); transition:transform .22s ease; }
  #dlg-layer.on .dlg-bubble{ transform:translateY(0); }
  /* しっぽは敵の側（右）を向く */
  .dlg-bubble::after{ content:''; position:absolute; right:-9px; top:22px; border:8px solid transparent; border-right:0; border-left:9px solid var(--gold); }
  .lg-say{ color:var(--gold); font-style:italic; }
  #desc-pop, #tip-pop{ position:fixed; z-index:3000; max-width:260px; padding:8px 10px; border-radius:6px; background:var(--card-face); color:var(--ink);
    border:1px solid #8a7752; box-shadow:0 6px 18px rgba(0,0,0,.55); font-size:12px; line-height:1.45; pointer-events:none; display:none; }
  #desc-pop .desc-prefix{ font-style:italic; color:var(--ink-soft); }
  .st-ref{ border-bottom:1px dotted currentColor; }
  #desc-pop .pop-st{ margin-top:5px; font-size:12px; line-height:1.5; }
  #desc-pop .pop-st:first-child{ margin-top:0; }
  #desc-pop .pop-sep{ margin:6px 0 4px; border-top:1px solid var(--line, #8885); }
  #tip-pop{ max-width:280px; }
  #tip-pop .tip-title{ font-weight:700; font-size:13px; margin-bottom:3px; }
  #tip-pop .tip-line{ margin-top:3px; }
  #tip-pop .tip-dim{ color:var(--ink-soft); font-size:11px; }
  #tip-pop .tip-when{ font-weight:700; }
  .status-chip[data-tip]{ cursor:help; }
  /* 仕込み（構え）: キャラクターのアイコンの真上。上の余白を確保して、出入りで画面が動かないようにする */
  .combatant{ position:relative; }
  .trigger-row{ position:absolute; left:50%; bottom:calc(100% + 4px); transform:translateX(-50%); width:max-content; max-width:190px;
    display:flex; flex-wrap:wrap-reverse; justify-content:center; gap:4px; z-index:5; }
  .trigger-chip{ max-width:186px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-color:var(--gold); }
  .card .art{ display:flex; align-items:center; justify-content:center; }
  .card .card-icon{ font-size:44px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .card.mini .card-icon{ font-size:34px; }
  .card .rarity-dot{ position:absolute; bottom:5px; right:7px; font-size:9px; letter-spacing:.03em; color:var(--ink-soft); font-family:var(--font-en); }


  /* ===== デッキ・レリックの閲覧（探索中、いつでも） ===== */
  #run-viewer-btn{ position:fixed; top:8px; right:8px; z-index:40; display:none; gap:6px; }
  #run-viewer-btn.on{ display:flex; }
  #run-viewer-btn button{ padding:5px 10px; font-size:12px; background:var(--bg-panel); border:1px solid var(--line); color:var(--parchment); border-radius:14px; cursor:pointer; opacity:.88; }
  #run-viewer-btn button:hover{ opacity:1; border-color:var(--gold); }
  .rv-overlay{ position:fixed; inset:0; background:rgba(10,8,6,.78); z-index:70; display:flex; align-items:center; justify-content:center; padding:12px; }
  .rv-box{ background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; width:100%; max-width:860px; max-height:92vh; display:flex; flex-direction:column; }
  .rv-head{ display:flex; gap:6px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .rv-head .rv-title{ flex:1; font-size:15px; min-width:80px; }
  .rv-tabs button, .rv-filters button{ padding:4px 10px; font-size:12px; background:transparent; border:1px solid var(--line); color:var(--parchment-dim); border-radius:12px; cursor:pointer; }
  .rv-tabs button.sel, .rv-filters button.sel{ border-color:var(--gold); color:var(--gold); }
  .rv-filters{ display:flex; gap:6px; flex-wrap:wrap; padding:8px 12px 0; }
  .rv-body{ padding:12px; overflow-y:auto; overscroll-behavior:contain; }
  .rv-grid{ display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-start; }
  .rv-cell{ position:relative; }
  .rv-cell .rv-pile{ position:absolute; top:-6px; left:-4px; z-index:3; font-size:10px; background:var(--bg-void); border:1px solid var(--line); color:var(--parchment); border-radius:8px; padding:0 6px; }
  .rv-cell.rv-temp .card{ box-shadow:0 0 0 2px #4aa3ff, 0 0 14px 3px rgba(74,163,255,.75); }
  .rv-cell.rv-enemy .card{ box-shadow:0 0 0 2px #b46bff, 0 0 14px 3px rgba(180,107,255,.75); }
  .rv-cell .rv-stay{ position:absolute; bottom:-6px; left:-4px; z-index:3; font-size:10px; background:var(--bg-void); border:1px solid #b46bff; color:#d3a8ff; border-radius:8px; padding:0 6px; }
  .rv-legend{ font-size:11px; color:var(--parchment-dim); margin:6px 0 10px; }
  .rv-legend .b{ color:#6bb6ff; } .rv-legend .p{ color:#c79bff; }
  .rv-relic{ display:flex; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; }
  .rv-relic .rn{ font-size:14px; color:var(--gold); } .rv-relic .rd{ font-size:12px; color:var(--parchment-dim); margin-top:2px; line-height:1.6; }
  /* small card for editor list */
  .card.mini{ width:120px; height:168px; }
  .card.mini .name{ font-size:11px; }
  .card.mini .desc{ font-size:9.5px; min-height:44px; -webkit-line-clamp:4; }

  /* ---------- Battle screen ---------- */
  .battlefield{ display:flex; justify-content:space-between; align-items:flex-start; padding:10px 6px 20px; gap:10px;}
  .combatant{ text-align:center; width:150px; }
  .combatant .portrait{
    width:110px; height:110px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;
    font-size:44px; border:2px solid var(--line); background:radial-gradient(circle at 35% 30%, #362b1c, #14110f);
  }
  .combatant.enemy .portrait{ border-color:var(--ember-dim); }
  .combatant.player .portrait{ border-color:var(--steel-dim); }
  .combatant .cname{ font-family:var(--font-display); font-size:15px; margin-bottom:4px;}
  .hpbar-wrap{ background:#000; border:1px solid var(--line); border-radius:10px; height:20px; overflow:hidden; position:relative; }
  .hpbar-fill{ height:100%; background:linear-gradient(90deg,var(--hp-red-dim),var(--hp-red)); transition:width .3s ease; position:relative; }
  .hpbar-ghost{ position:absolute; left:0; top:0; height:100%; background:linear-gradient(90deg,#b8863a,#e9c46a); opacity:.9; transition:width .6s ease; }
  .hpbar-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-family:var(--font-en); font-weight:700; text-shadow:0 1px 2px #000;}
  .statuses{ display:flex; gap:5px; justify-content:center; margin-top:6px; flex-wrap:wrap;}
  .status-chip{ font-size:10.5px; background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:10px; padding:2px 7px;}
  .intent{ margin-top:8px; font-size:12px; color:var(--parchment-dim); background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:5px; padding:5px 8px; min-height:16px;}
  .intent.atk{ color:#e39a7f;}
  .intent.def{ color:#9fc3ce;}
  .intent.buf{ color:#c4a8de;}
  .intent .intent-sub{ margin-top:5px; padding-top:5px; border-top:1px dashed var(--line); line-height:1.5; color:var(--parchment);}
  .intent .intent-sub.dim{ margin-top:1px; padding-top:0; border-top:none; font-size:11px; color:var(--parchment-dim);}
  .intent.lethal{ border-color:#c0504a; box-shadow:0 0 0 1px #c0504a66 inset;}
  .intent .warn{ color:#ff8f86; font-weight:700;}

  :root{ --blk:#5CC8E8; --blk-rgb:92,200,232; --lg-sc:#E58FB5; --lg-fp:#F0675A; --lg-fm:#6FA8F0; --lg-n:#F4ECD8; }
  .lg-head{ color:var(--lg-n); font-weight:700; }
  .lg-line{ display:block; padding-left:1.2em; }
  .lg-line .lg-line{ padding-left:1em; }
  .lg-n{ color:var(--lg-n); } .lg-mul{ margin-left:.2em; }
  .lg-sc{ color:var(--lg-sc); } .lg-fp{ color:var(--lg-fp); } .lg-fm{ color:var(--lg-fm); }
  .lg-blk{ color:var(--blk); }
  .lg-fp,.lg-fm{ cursor:help; }
  .blk-auto{ opacity:.85; font-weight:600; }
  .log-btns{ display:flex; gap:6px; }
  #app:has(.log-right){ max-width:1360px; }
  .battle-screen.log-right{ display:flex; gap:16px; align-items:flex-start; }
  .battle-screen.log-right .battle-main{ flex:1; min-width:0; }
  .battle-log{ width:360px; flex-shrink:0; position:sticky; top:12px; }
  .battle-log .log-box{ max-height:calc(100vh - 90px); min-height:240px; resize:none; }
  @media (max-width: 960px){
    .battle-screen.log-right{ flex-direction:column; }
    .battle-log{ width:100%; position:static; }
    .battle-log .log-box{ max-height:240px; }
  }
  .blockline{ margin:0 auto; width:max-content; min-width:96px; font-size:12px; border:1px solid rgba(var(--blk-rgb),.25); color:rgba(var(--blk-rgb),.45); border-radius:10px; padding:2px 10px; }
  .blockline.on{ color:var(--blk); border-color:var(--blk); background:rgba(var(--blk-rgb),.12); font-weight:700; }
  /* ブロックをHPバー内に表示 */
  .hpbar-wrap.has-block{ border-color:var(--blk); box-shadow:0 0 6px rgba(var(--blk-rgb),.45); }
  .hpbar-text{ gap:5px; }
  #eo-list{ margin-bottom:12px; }
  .eo-item{ display:flex; align-items:center; gap:8px; padding:6px 8px; margin-bottom:4px; background:var(--bg-void); border:1px solid var(--line); border-radius:4px; font-size:13px; }
  .eo-item.dragging{ border-color:var(--blk); opacity:.8; }
  .eo-handle{ cursor:grab; touch-action:none; user-select:none; padding:2px 6px; color:var(--parchment-dim); }
  .eo-label{ flex:1; }
  .eo-btn{ padding:0 8px; min-width:0; height:26px; }
  .eo-sep{ border-style:dashed; color:var(--parchment-dim); }
  .fxc{ border:1px solid var(--line); border-radius:6px; padding:8px; margin-bottom:8px; background:var(--bg-void); }
  .fxc.dragging{ border-color:var(--blk); opacity:.8; }
  .fxc-sub{ border-left:2px solid var(--line); margin:4px 0 8px 6px; padding-left:8px; }
  .fxc-row{ display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; margin-bottom:6px; }
  .fxc-f{ display:flex; flex-direction:column; gap:2px; margin:0; }

// icon set on the card wins; otherwise a per-card default, then a per-type default
function cardIcon(c){
  if(c && c.icon) return c.icon;
  const baseId = String((c && (c.baseId || c.id)) || '').replace(/\+$/,'');
  if(DEFAULT_ICONS[baseId]) return DEFAULT_ICONS[baseId];
  if(baseId.indexOf('enemy_buf_')===0) return '📢';
  return (c && TYPE_DEFAULT_ICON[c.type]) || '❔';
}
// タグの空白（半角・全角・タブなど）はすべて取り除く。複数タグの区切りは , 、 ，
function cleanTag(v){ return typeof v==='string' ? v.replace(/[\s\u3000]+/g,'') : ''; }

// 編成: main（メイン）と subs[]（サブ＝メイン以外に開始時に解放するキャラクター）。どちらの各枠も、キャラクターのID、または '@random'（完全ランダム）／'@pick'（選択肢ランダム）。
// mainId／unlocked／mainMode／randomSlots は、main／subs から作る互換用の値（実行側がそのまま読める）。旧データ（mainId＋mainMode＋unlocked＋randomSlots）は、読み込み時に main／subs へ変換する。
function cleanFormation(o){
  o = (o && typeof o==='object') ? o : {};

    : [...cleanIdList(o.unlocked), ...(Array.isArray(o.randomSlots) ? o.randomSlots.filter(x=>x==='random' || x==='pick').map(x=>'@'+x) : [])];

  return {main, subs, skipMain: !!o.skipMain,

function cleanFormationData(o){

    return {id, name:((typeof p.name==='string' ? p.name.trim() : '').slice(0,30)) || '名無しの編成', ...cleanFormation(p)};

// 冒険で使う編成。ランダム方式を確定したあとは S.runFormation（確定済みの編成）、通常は S.formation。

// ---- ランダム編成
// 固定の部分だけを取り出した編成（ランダム方式は含めない）。設定でオフの方式の指定は使わない（保存された指定は消えない）。
function fixedFormationOf(f0){

}
function formationSpecialOn(x){ return x==='@random' ? !!S.settings.formationRandomFullEnabled : x==='@pick' ? !!S.settings.formationRandomPickEnabled : false; }
function formationHasRandom(f0){

}
// 抽選に必要な人数（設定でオンの方式のランダム枠の数）と、抽選できるキャラクターの人数（固定で使っているキャラクターを除いた残り）
function formationShortage(f0){
  const f = cleanFormation(f0), need = [f.main, ...f.subs].filter(formationSpecialOn).length;
  const avail = (S.charTags||[]).filter(t=>!f.unlocked.includes(t.id) && t.id!==f.mainId).length;
  return {need, avail, excess: Math.max(0, need-avail)};
}
// 足りない分のランダム枠を削除した編成を返す（固定のキャラクターは残す。あとの枠から削除し、それでも足りなければメインのランダム枠を外す）
function trimFormationToPool(f0){
  const f = cleanFormation(f0); let ex = formationShortage(f).excess;
  const subs = f.subs.slice();
  for(let i=subs.length-1; i>=0 && ex>0; i--){ if(formationSpecialOn(subs[i])){ subs.splice(i,1); ex--; } }
  let main = f.main;
  if(ex>0 && formationSpecialOn(main)){ main = ''; ex--; }

}
function formationPickN(){ return Math.max(1, Math.min(10, (S.settings.formationPickChoices|0) || 3)); }

// ランダム方式の抽選。候補は、まだ使われていないキャラクター（メイン・他の枠・固定で解放済みと重複させない）。
// 完全ランダム: そのまま確定。選択肢ランダム: 設定の人数（足りなければ、いる人数）を提示。候補が1人なら、そのまま確定。候補がいなければ fail。
// 選択肢ランダムの枠が複数あるとき: 設定が「一つずつ」なら、枠ごとに提示。「一度に」なら、完全ランダムの枠を先に決めたうえで、枠ごとに別の候補を一画面に提示する。
function resolveRandomFormation(f0, done, fail){
  const f = cleanFormation(f0), out = fixedFormationOf(f);
  const taken = new Set([...out.unlocked, ...(out.mainId ? [out.mainId] : [])]);
  const steps = [];
  if(formationSpecialOn(f.main)) steps.push({kind:'main', mode:f.main==='@pick' ? 'pick' : 'random'});
  f.subs.forEach((x,i)=>{ if(formationSpecialOn(x)) steps.push({kind:'slot', mode:x==='@pick' ? 'pick' : 'random', n:i+1}); });
  const N = formationPickN();
  const assign = (st,id)=>{ taken.add(id); if(st.kind==='main') out.mainId = out.main = id; else { out.unlocked.push(id); out.subs.push(id); } };
  const poolLeft = ()=> (S.charTags||[]).map(t=>t.id).filter(id=>!taken.has(id));
  const pickSteps = steps.filter(s=>s.mode==='pick');
  if(S.settings.formationPickMode==='batch' && pickSteps.length>=2){
    // 一度に: 完全ランダムの枠を先に決め、残りから、共通の候補を提示する。必要な人数（選択肢ランダムの枠の数）を、その中から選ぶ。
    // 選んだ順に、メイン・サブの枠へ割り当てる。候補の数は、設定の人数（必要な人数より少なければ、必要な人数）。
    for(const st of steps.filter(s=>s.mode==='random')){ const c = poolLeft(); if(!c.length){ fail(st); return; } assign(st, c[Math.floor(Math.random()*c.length)]); }
    const M = pickSteps.length, rest = shuffle(poolLeft());
    if(rest.length<M){ fail(pickSteps[rest.length]); return; }
    const cands = rest.slice(0, Math.min(rest.length, Math.max(N, M)));
    if(cands.length===M){ cands.forEach((id,i)=>assign(pickSteps[i], id)); done(out); return; }   // 選ぶ余地がないときは、そのまま決める
    renderFormationPickBatch(pickSteps, cands, ids=>{ ids.forEach((id,i)=>assign(pickSteps[i], id)); done(out); });
    return;
  }
  let i = 0;
  const next = ()=>{
    if(i>=steps.length){ done(out); return; }
    const st = steps[i++], cands = poolLeft();
    if(!cands.length){ fail(st); return; }
    const take = id=>{ assign(st, id); next(); };
    if(st.mode==='random' || cands.length===1){ take(cands[Math.floor(Math.random()*cands.length)]); return; }
    renderFormationPick(st, shuffle(cands).slice(0,N), take);
  };
  next();
}

// 選択肢ランダムの枠が複数あるとき（設定が「一度に」）: 共通の候補を並べ、必要な人数を選んで、まとめて決定する。選んだ順に、枠へ割り当てる。
function renderFormationPickBatch(steps, ids, done){

      <div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:18px;" id="fpb-row">${ids.map(id=>charTagById(id)).filter(Boolean).map(t=>{
        const k = chosen.indexOf(t.id);
        return `<div style="position:relative;">${k>=0 ? `<div class="fpb-badge" style="position:absolute; top:-8px; left:-8px; z-index:1; background:var(--gold); color:#14110F; border-radius:12px; padding:2px 10px; font-size:12px; font-weight:bold;">${k+1}人目：${escapeHtml(formationStepLabel(steps[k]))}</div>` : ''}${fpickTileHTML(t, {kind:'slot'}, k>=0)}</div>`;
      }).join('')}</div>
      <div style="margin-top:18px; display:flex; gap:10px; justify-content:center;"><button class="ghost" id="fpb-clear" ${chosen.length?'':'disabled'}>選び直す</button><button class="primary" id="fpb-ok" ${ready?'':'disabled'}>この編成で始める</button></div>
    </div>`;

function showFormationShortage(st){

/* ブロックの呼び名: 画面に出る「ブロック」の文字を、世界観の設定の呼び名に置き換える。

const BLOCK_WORD = 'ブロック';
const BLK_ATTRS = ['title','data-tip','placeholder','aria-label'];
let __blkRepl = BLOCK_WORD, __blkObs = null;

// 組み込みの状態の名前の置き換え。探索中の画面だけで行う（編集画面では、タグなどの文字まで変わって紛らわしいため）。
// 「自動ブロック」は、「自動」の部分を変えたときは、編集画面でも置き換える。
const BS_NO_REPL_SCREENS = ['home','assets','audio','charTags','formation','editor','relicEditor','enemies','events','elements','statuses','settings','world','data'];
let __bsCache = {sig:null, re:null, map:null};
function bsReplState(){
  const inRun = !!(S && S.run && !BS_NO_REPL_SCREENS.includes(S.screen));
  const pairs = [];
  BUILTIN_STATUS_DEFS.forEach(d=>{
    if(d.id==='metallicize'){
      const nn = (inRun && bsRenamed(d.id)) ? bsName(d.id) : (autoWord()!==AUTO_WORD ? autoWord()+BLOCK_WORD : null);
      if(nn!==null && nn!==d.name) pairs.push([d.name, nn]);
    } else if(inRun && bsRenamed(d.id)) pairs.push([d.name, bsName(d.id)]);
  });
  const sig = JSON.stringify(pairs);
  if(sig!==__bsCache.sig){
    const map = {}; pairs.forEach(([o,n])=>{ map[o] = n; });
    const esc = t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    // 「強化」は、カードの強化（アップグレード）と同じ文字なので、状態として出る形（強化+2、強化(永続)、強化2…）だけを置き換える
    const alt = pairs.map(p=>p[0]).sort((a,b)=>b.length-a.length).map(o=> esc(o) + (o==='強化' ? '(?=[+＋]|\\s?\\d|[(（]|減少)' : ''));

function blkSub(str){

  if(blockLabel()!==BLOCK_WORD) str = str.split(BLOCK_WORD).join(__blkRepl);

function textSubActive(){ return blockLabel()!==BLOCK_WORD || !!bsReplState().re || !!playerRenamePair(); }
function blkSkip(node){

function blkAttr(el, a){

function blkText(t){
  if(blkSkip(t)) return;
  let n = blkSub(t.data);
  const pn = playerRenamePair();   // 戦闘ログの「あなた」を、メインキャラクターの名前に置き換える
  if(pn && n.includes('あなた') && t.parentElement && t.parentElement.closest('.log-box,.run-log')) n = n.replace(/あなた(?!\u2060)/g, pn + '\u2060');

function blkWalk(root){
  if(!root) return;
  if(root.nodeType===3){ blkText(root); return; }
  if(root.nodeType!==1 || blkSkip(root)) return;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  let n; while((n = tw.nextNode())) list.push(n);

function applyBlockName(){
  const nm = blockLabel();

  if(!document.body) return;
  if(!__blkObs){
    __blkObs = new MutationObserver(muts=>{
      if(!textSubActive()) return;
      __blkObs.disconnect();
      try{

          if(m.type==='childList') m.addedNodes.forEach(blkWalk);
          else if(m.type==='characterData') blkWalk(m.target);

  }

// element: {id, name, props:{}}。props は将来の拡張用（吸血・貫通のような、ダメージに作用する特殊効果などをここに足す）。
const DEFAULT_ELEMENTS = [
  {id:'fire', name:'火', props:{}, color:'#E8743B', emoji:'🔥'},
  {id:'ice', name:'氷', props:{}, color:'#6EC6E8', emoji:'❄️'},
  {id:'thunder', name:'雷', props:{}, color:'#F2D14B', emoji:'⚡'},
];
/* ===== 属性ごとの特殊効果 =====
   属性の props に {キー: 値} で持つ。新しい特殊効果は、ここに1項目足せば、属性の編集画面に入力欄が出て、保存・読み込み・一覧表示・複製にそのまま乗る。
   共通の項目: key / label / hint（編集画面の説明）/ short(value)（一覧の短い表示）
     type 'number'（既定）: min / max。0は「持たない」。 type 'list': clean(list)＝正規化、has(list)、rowHTML(row,i)、newRow()（編集画面の行）
   効く場所は次のどれか（両方でもよい）:
     blockMod(value) … ブロックを引く計算の前に効く。{pierce:％（ブロックを無視する割合）, breakPct:％（ブロックを削る力の増加）} を返す。複数の属性の分は足し合わせる。
     apply(ctx)      … 攻撃のダメージが確定した直後に、その攻撃が持つ属性のうち、この効果を持つものについて、まとめて1回呼ばれる。
         ctx: {side:'toEnemy'|'toPlayer', hit, attacker, attackerName, defender, defenderName, entries:[{element, value}]}
         hit は被弾の記録（hpLoss＝実際に減ったHP、total＝ダメージの合計、blocked＝ブロックで防いだ分、pierceAmt など）。
         ログに残す文は {text, kind}（または、その配列）で返す（攻撃のログの後に出す）。 */
const ELEMENT_BUILTIN_STATUSES = [['strength','強化'],['dexterity','器用'],['weak','弱体'],['vulnerable','脆弱'],['poison','毒'],['regen','再生'],['stun','麻痺'],['metallicize','自動ブロック'],['thorns','棘']];
function hitStatusOptions(){
  return ELEMENT_BUILTIN_STATUSES.map(([k,n])=>({key:'b:'+k, label: k==='stun' ? n+'（敵に付与したときだけ有効）' : n}))
    .concat((S.customStatuses||[]).map(st=>({key:'cs:'+st.id, label:`${st.emoji||''}${st.name}`})));
}
function cleanHitStatus(list){
  return (Array.isArray(list) ? list : []).filter(x=>x && typeof x==='object').map(x=>{
    const st = typeof x.status==='string' ? x.status : '';
    const ok = (st.startsWith('b:') && ELEMENT_BUILTIN_STATUSES.some(([k])=>'b:'+k===st)) || (st.startsWith('cs:') && st.length>3);
    if(!ok) return null;
    return {status:st.slice(0,80), stacks:clampInt(x.stacks,1,99,1), chance:clampInt(x.chance,1,100,100), target: x.target==='self' ? 'self' : 'opponent', when: x.when==='hit' ? 'hit' : 'hp'};
  }).filter(Boolean).slice(0,6);
}
const ELEMENT_PROP_DEFS = [
  {key:'lifesteal', label:'吸血（％）', min:0, max:999,
   hint:'この属性を持つ攻撃が、相手のHPを実際に減らしたとき、減らした分のこの％（端数は切り捨て）を、攻撃した側が回復します。ブロックで防がれた分は含めません。攻撃が複数の属性を持つときは、各属性の％を足し合わせます。カードの「吸収」とは別に計算して、回復を足します。0なら効果なし。',
   short: v=>`吸血${v}％`,
   apply(ctx){
     const loss = ctx.hit.hpLoss || 0, a = ctx.attacker;
     if(!(loss>0) || !a || !(a.hp>0)) return null;
     const pct = ctx.entries.reduce((sum,x)=>sum+x.value, 0);
     const heal = Math.floor(loss*pct/100); if(!(heal>0)) return null;
     const b = a.hp; a.hp = Math.min(a.maxHp, a.hp + heal);
     const got = a.hp - b; if(!(got>0)) return null;
     fxHeal(a, got);
     const names = ctx.entries.map(x=>x.element.name).join('・');
     return {text:`${ctx.attackerName}は${names}の吸血で${got}回復（HP ${b}→${a.hp}）。`, kind: ctx.side==='toPlayer' ? 'deal' : undefined};
   }},
  {key:'pierce', label:'貫通（％）', min:0, max:100,
   hint:'この属性を持つ攻撃のダメージのうち、この％（端数は切り捨て）が、ブロックを無視してHPに入ります。残りは通常どおり、ブロックで防がれます。攻撃が複数の属性を持つときは、各属性の％を足し合わせます（最大100％）。カード自体が「貫通」のときは、全部がブロックを無視します。0なら効果なし。',
   short: v=>`貫通${v}％`,
   blockMod: v=>({pierce:v})},
  {key:'blockBreak', label:'ブロック破壊（％）', min:0, max:999,
   hint:'この属性を持つ攻撃は、ブロックを削る力がこの％だけ強くなります（ダメージ1につき、ブロックを「1＋この％」失います）。たとえば50％なら、ダメージ10でブロック15分を壊せます。ダメージ10・ブロック10なら、ブロックは0になり、3ダメージがHPに通ります。ブロックを持たない相手には効果がありません。攻撃が複数の属性を持つときは、各属性の％を足し合わせます。0なら効果なし。',
   short: v=>`ブロック破壊${v}％`,
   blockMod: v=>({breakPct:v})},
  {key:'guard', label:'ヒット時ブロック獲得（％）', min:0, max:999,
   hint:'この属性を持つ攻撃が当たったとき、与えたダメージの合計（ブロックで防がれた分も含む）のこの％（端数は切り捨て）を、攻撃した側がブロックとして得ます。攻撃が複数の属性を持つときは、各属性の％を足し合わせます。0なら効果なし。',
   short: v=>`ヒット時ブロック${v}％`,
   apply(ctx){
     const total = ctx.hit.total || 0, a = ctx.attacker;
     if(!(total>0) || !a || !(a.hp>0)) return null;
     const pct = ctx.entries.reduce((sum,x)=>sum+x.value, 0);
     const gain = Math.floor(total*pct/100); if(!(gain>0)) return null;
     const b = a.block||0; a.block = b + gain; fxBlock(a, gain);
     const names = ctx.entries.map(x=>x.element.name).join('・');
     return {text:`${ctx.attackerName}は${names}の守りで${gain}のブロックを得た（ブロック ${b}→${a.block}）。`, kind: ctx.side==='toPlayer' ? 'deal' : undefined};
   }},
  {key:'hitStatus', type:'list', label:'ヒット時の状態付与（確率）',
   hint:'この属性を持つ攻撃が当たったとき、確率で状態を付与します。付与先は「攻撃を受けた側（相手）」か「攻撃した側（自分）」を選べます。付与は通常の状態付与と同じ扱いで、排他の設定やエフェクトもそのまま働きます。条件は「相手のHPを実際に減らしたとき」か「攻撃が当たったとき（ブロックで全部防がれても）」。最大6件まで。',
   clean: cleanHitStatus,
   has: v=> Array.isArray(v) && v.length>0,
   short: v=>`状態付与${v.length}件`,
   newRow: ()=>({status:(hitStatusOptions()[2]||hitStatusOptions()[0]).key, stacks:1, chance:100, target:'opponent', when:'hp'}),
   rowHTML(row, i){
     const opt = (v,t,cur)=>`<option value="${v}" ${cur===v?'selected':''}>${t}</option>`;
     return `<div class="ev-eff" data-idx="${i}">
       <div class="ev-eff-head"><span>状態付与 ${i+1}</span><button type="button" class="ghost elm-row-del">削除</button></div>
       <div class="field"><label>付与する状態</label><select data-f="status">${hitStatusOptions().map(o=>opt(escapeHtml(o.key), escapeHtml(o.label), row.status)).join('')}</select></div>
       <div class="ev-eff-grid"><div><label>付与するスタック数</label><input type="number" data-f="stacks" value="${row.stacks}" min="1" max="99"></div>
         <div><label>確率（％）</label><input type="number" data-f="chance" value="${row.chance}" min="1" max="100"></div></div>
       <div class="field"><label>付与先</label><select data-f="target">${opt('opponent','攻撃を受けた側（相手）',row.target)}${opt('self','攻撃した側（自分）',row.target)}</select></div>
       <div class="field"><label>条件</label><select data-f="when">${opt('hp','相手のHPを実際に減らしたとき',row.when)}${opt('hit','攻撃が当たったとき（ブロックで全部防がれても）',row.when)}</select></div>
     </div>`;
   },
   apply(ctx){
     const notes = [];
     ctx.entries.forEach(en=>{
       (en.value||[]).forEach(row=>{
         const ok = row.when==='hit' ? (ctx.hit.total>0) : (ctx.hit.hpLoss>0);
         if(!ok || !rollChance(row.chance)) return;
         const toSelf = row.target==='self';
         const ent = toSelf ? ctx.attacker : ctx.defender, entName = toSelf ? ctx.attackerName : ctx.defenderName;
         if(!ent || !(ent.hp>0)) return;
         let label = '', got = 0;
         if(row.status.startsWith('b:')){
           const f = row.status.slice(2), fb = FX_BUILTIN[f], nm = (ELEMENT_BUILTIN_STATUSES.find(x=>x[0]===f)||[])[1] || f;
           got = grantBuiltin(ent, f, row.stacks); label = (fb ? fb[0] : '') + nm;
         } else {
           const id = row.status.slice(3), st = (S.customStatuses||[]).find(x=>x.id===id); if(!st) return;
           got = grantCustomStatus(ent, id, row.stacks); label = `${st.emoji||''}${st.name}`;
         }
         if(got>0) notes.push({text:`${en.element.name}の効果で${entName}に${label}+${row.stacks}${row.chance<100?`（${row.chance}％）`:''}。`, kind: ctx.side==='toPlayer' ? 'deal' : undefined});
       });
     });
     return notes;
   }},
];
function normalizeElement(x){
  x = (x && typeof x==='object') ? x : {};
  const hex = v=> typeof v==='string' && /^#[0-9a-fA-F]{6}$/.test(v);
  const d = DEFAULT_ELEMENTS.find(y=>y.id===x.id);   // 最初からある3属性は、色・絵文字が未設定のときだけ既定値を入れる
  const color = x.color===undefined && d ? d.color : (hex(x.color) ? x.color : '');
  const emoji = x.emoji===undefined && d ? d.emoji : (typeof x.emoji==='string' ? x.emoji.trim().slice(0,4) : '');
  const props = (x.props && typeof x.props==='object' && !Array.isArray(x.props)) ? {...x.props} : {};
  ELEMENT_PROP_DEFS.forEach(def=>{
    if(def.type==='list'){ const v = def.clean(props[def.key]); if(v.length) props[def.key] = v; else delete props[def.key]; return; }
    const v = Number(props[def.key]);
    if(Number.isFinite(v) && v>0) props[def.key] = Math.min(def.max, Math.max(def.min, Math.round(v))); else delete props[def.key];
  });
  const tags = (Array.isArray(x.tags)?x.tags:[]).map(cleanTag).filter((t,i,a)=>t && a.indexOf(t)===i);
  return {...x, id:String(x.id||''), name:String(x.name||'').trim(), props, color, emoji, tags};
}
function loadElements(){
  try{
    const value = localStorage.getItem('elements');
    if(value){ const list = JSON.parse(value); if(Array.isArray(list)) return list.map(normalizeElement).filter(x=>x.id && x.name); }
  }catch(e){ console.error(e); }
  return JSON.parse(JSON.stringify(DEFAULT_ELEMENTS)).map(normalizeElement);
}
function saveElements(list){
  try{ localStorage.setItem('elements', JSON.stringify(list)); }catch(e){ console.error(e); storageFailed(); }
}
function elementById(id){ return (S.elements||[]).find(x=>x.id===id) || null; }
// 属性の選択子: 'all'（全属性）／属性ID／'tag:<タグ>'（そのタグを持つ属性すべて）
function elementTagList(){ return [...new Set((S.elements||[]).flatMap(x=>x.tags||[]))]; }
function elementMatchesSelector(elemId, sel){
  if(!sel || sel==='all') return true;
  if(typeof sel==='string' && sel.startsWith('tag:')){ const el = elementById(elemId); return !!(el && (el.tags||[]).includes(sel.slice(4))); }
  return elemId===sel;
}
function elementSelectorOptionsHTML(cur, withAll, allLabel){
  return (withAll ? `<option value="all" ${(!cur||cur==='all')?'selected':''}>${allLabel}</option>` : '')
    + (S.elements||[]).map(x=>`<option value="${escapeHtml(x.id)}" ${cur===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')
    + elementTagList().map(t=>`<option value="tag:${escapeHtml(t)}" ${cur==='tag:'+t?'selected':''}>タグ「${escapeHtml(t)}」の属性すべて</option>`).join('');
}
function elementName(id){ const el = elementById(id); return el ? el.name : ''; }
// カードが持つ属性ID（削除された属性は除く）
function cardElementIds(c){
  return (c && Array.isArray(c.elements) ? c.elements : []).filter((id,i,a)=> elementById(id) && a.indexOf(id)===i);
}

/* ============================= APP STATE ============================= */

const S = {
  screen: 'loading',
  cards: [],
  relics: [],
  customStatuses: [],
  elements: [],
  enemies: [],
  events: [],
  charTags: [],
  assets: [],
  audio: {bgm:{}, se:{}, timing:{voiceToCard:200, cardToReaction:200, hurtVoiceDelay:150, enemyTurnWait:550, afterEnemyWait:0}},
  formation: {mainId:'', skipMain:false, unlocked:[]},
  formationPresets: [],
  settings: {...DEFAULT_SETTINGS},
  world: {...DEFAULT_WORLD},
  run: null, // battle/run state
  editingCard: null,
  editingIsNew: false,
};

// A pile entry is normally just a card id string (e.g. "strike" or "strike+" once
// upgraded). When a card grants an effect to another card (cardOp type "grantBuff"),
// that specific physical copy needs its own identity so the bonus doesn't leak onto
// every other copy of the same card. We do this by suffixing the raw id with
// "::<instanceId>" and storing the actual bonus numbers in S.run.instanceBuffs,
// keyed by that instance id. Every other part of the game keeps treating pile
// entries as opaque strings (splice/indexOf/etc. all still work unchanged) — only
// cardById() needs to know how to unpack the suffix.
function splitInstanceId(raw){
  if(typeof raw!=='string') return {cid:raw, iid:null};
  const idx = raw.lastIndexOf('::');
  if(idx===-1) return {cid:raw, iid:null};
  return {cid:raw.slice(0,idx), iid:raw.slice(idx+2)};
}
function withInstanceSuffix(cid, iid){ return iid ? (cid+'::'+iid) : cid; }
function upgradeRawId(raw){
  const {cid, iid} = splitInstanceId(raw);
  if(cid.endsWith('+')) return raw;
  return withInstanceSuffix(cid+'+', iid);
}

// Cards created by a "generate" card-operation only exist for the current combat.
// Their instance id is registered in r.temporaryCardIids; this strips any such card
// out of every pile (and drops its buff record) once the fight is over.
function purgeTemporaryCards(r){
  if(!r.temporaryCardIids) r.temporaryCardIids = {};
  if(!r.tempInstanceBuffs) r.tempInstanceBuffs = {};
  if(!r.tempUpgradeIids) r.tempUpgradeIids = {};
  const isTemp = (rawId)=>{
    const {iid} = splitInstanceId(rawId);
    return !!(iid && r.temporaryCardIids[iid]);
  };
  ['hand','draw','discard','exhausted'].forEach(pileName=>{
    if(!r[pileName]) return;
    r[pileName] = r[pileName].filter(rawId=>{
      if(isTemp(rawId)){
        const {iid} = splitInstanceId(rawId);
        if(r.instanceBuffs) delete r.instanceBuffs[iid];
        if(r.permExhaustIids) delete r.permExhaustIids[iid];
        return false;
      }
      return true;
    }).map(rawId=>{
      // Undo combat-only upgrades granted by a (non-permanent) card-operation.
      const {cid, iid} = splitInstanceId(rawId);
      if(iid && r.tempUpgradeIids[iid] && typeof cid==='string' && cid.endsWith('+')){
        return withInstanceSuffix(cid.slice(0,-1), iid);
      }
      return rawId;
    });
  });
  r.temporaryCardIids = {};
  r.tempInstanceBuffs = {};   // combat-only stat grants wear off
  r.tempUpgradeIids = {};
  r.lastPlayedId = '';   // 「最後に使ったカード」の記録は、戦闘ごとにリセット
}

function isUpgradedInstanceId(raw){
  const cid = splitInstanceId(raw).cid;
  return typeof cid==='string' && cid.endsWith('+');
}

function upgradedCardView(base){
  const up = {...base, id: base.id+'+', name: base.name+'+', baseId: base.id};
  const upg = base.upgrades || {};
  up.cost = isXCost(base) ? base.cost : Math.max(0, (base.cost||0) + (upg.costDelta||0));
  up.scales = {};
  CAPSULE_CHANNELS.forEach(ch=>{ up[ch.prop] = upgradeCapsuleList(base[ch.prop]); });   // 使用時・ドロー時・消滅時・所持効果のカプセルすべてに、強化時の変化を反映する
  allEffectFieldDefs().forEach(def=>{
    const baseVal = base[def.key]!==undefined ? base[def.key] : (def.default||0);
    const min = def.min!==undefined ? def.min : 0;
    up[def.key] = Math.max(min, baseVal + (upg[def.key]||0));
    if(base.scales && base.scales[def.key]){
      const s = base.scales[def.key];
      const ppDelta = (upg.scalePP && upg.scalePP[def.key]) || 0;
      up.scales[def.key] = {...s, perPoint: s.perPoint + ppDelta};
    }
    // 「両方に付与」の相手への量にも、強化時の変化を反映する
    if(def._statusId && base['csT_'+def._statusId]==='both'){
      const xk = 'csX_'+def._statusId;
      up[xk] = Math.max(-99, (base[xk]|0) + (upg[xk]||0));
    }
  });
  // トリガー側が別の効果なら、そちらにも強化時の変化を反映する
  if(base.triggerSeparate && base.trig){
    const tv = upgradedCardView({...base, ...base.trig, upgrades:{costDelta:0, ...(base.trig.upgrades||{})}, triggerSeparate:false, trig:null});
    up.trig = extractEffectSet(tv);
  }
  return up;
}

// ===== コスト =====
// costMode:'x' のカード（Xコスト）は、使用するとき所持エネルギーをすべて消費し、その値（X）を効果計算に渡す。エネルギー0では使えない。
function isXCost(c){ return !!c && c.costMode==='x'; }
// 画面に表示するコスト（Xカードは 'X'）。表示と支払いは別の関数にしてあり、一時的な増減で分けられる。
function getDisplayedCardCost(c){ return isXCost(c) ? 'X' : c.cost; }
// 実際に支払うコスト。Xカードは「いまの所持エネルギーすべて」。
function getCardPaymentCost(c, energy){ return isXCost(c) ? Math.max(0, energy|0) : c.cost; }
function canAffordCard(c, energy){ return isXCost(c) ? energy>0 : c.cost<=energy; }
// 効果解決中のX値（r.xValue）を一時的に設定して fn を呼ぶ。fn には完了コールバックを渡す。
function withXValue(r, x, fn, done){
  const prev = r.xValue; r.xValue = x||0;
  fn(()=>{ r.xValue = prev; done(); });
}
function cardById(id){
  const {cid, iid} = splitInstanceId(id);
  let card;
  if(isUpgradedInstanceId(cid)){
    const base = S.cards.find(c=>c.id===cid.slice(0,-1));
    card = base ? upgradedCardView(base) : null;
  } else {
    card = S.cards.find(c=>c.id===cid);
  }
  if(!card) return null;
  const permBuffs = iid && S.run && S.run.instanceBuffs && S.run.instanceBuffs[iid];
  const tempBuffs = iid && S.run && S.run.tempInstanceBuffs && S.run.tempInstanceBuffs[iid];
  if((permBuffs && Object.keys(permBuffs).length) || (tempBuffs && Object.keys(tempBuffs).length)){
    const merged = {...card};
    // 補正の記録: 数値は加算、文字列（付与先 csT_<状態ID>）は上書き、'='+欄名 は「その値に上書き（set）」、__el は属性の付与／除去の記録
    const elOps = [], tagOps = [];
    [permBuffs, tempBuffs].forEach(b=>{
      if(!b) return;
      Object.keys(b).forEach(k=>{
        if(k==='__el'){ (b[k]||[]).forEach(x=>elOps.push(x)); return; }
        if(k==='__tags'){ (b[k]||[]).forEach(x=>tagOps.push(x)); return; }
        if(k.charAt(0)==='=') return;
        if(typeof b[k]!=='string'){
          if(isCapsuleField(k)){ capsuleAddDelta(merged, k, b[k], 'self'===merged['csT_'+k.slice(3)] || 'opponent'===merged['csT_'+k.slice(3)] ? merged['csT_'+k.slice(3)] : ''); return; }
          const mx = /^csX_(.+)$/.exec(k); if(mx && merged.effects && merged.effects.some(e=>e.kind==='cs_'+mx[1])){ capsuleAddDelta(merged, 'cs_'+mx[1], b[k], 'opponent'); return; }
        }
        merged[k] = (typeof b[k]==='string') ? b[k] : ((merged[k]||0) + b[k]);
      });
      Object.keys(b).forEach(k=>{ if(k.charAt(0)==='='){ const f = k.slice(1); if(isCapsuleField(f)) capsuleSetTotal(merged, f, b[k], ''); else merged[f] = b[k]; } });
    });
    if(elOps.length){
      let els = Array.isArray(merged.elements) ? merged.elements.slice() : [];
      elOps.forEach(([kind,id])=>{
        if(kind==='+'){ if(id && elementById(id) && !els.includes(id)) els.push(id); }
        else if(id==='all' || !id) els = [];
        else els = els.filter(e=>!elementMatchesSelector(e, id));
      });
      merged.elements = els;
    }
    if(tagOps.length){
      const tg = Array.isArray(merged.tags) ? merged.tags.slice() : [];
      tagOps.forEach(t=>{ if(t && !tg.includes(t)) tg.push(t); });
      merged.tags = tg;
    }
    if(merged.triggerSeparate && merged.trig){
      // 付与された補正は、トリガー側の効果にも同じように働く
      const t = {...merged.trig};
      [permBuffs, tempBuffs].forEach(b=>{
        if(!b) return;
        Object.keys(b).forEach(k=>{
          if(k==='__el' || k==='__tags' || k.charAt(0)==='=') return;
          if(!isEffectSetKey(k) || k==='hits' || EFFECT_SET_SPECIAL.includes(k)) return;
          if(typeof b[k]!=='string' && isCapsuleField(k)){ capsuleAddDelta(t, k, b[k], ''); return; }
          t[k] = (typeof b[k]==='string') ? b[k] : ((t[k]||0) + b[k]);
        });
        Object.keys(b).forEach(k=>{ if(k.charAt(0)==='=' && isEffectSetKey(k.slice(1)) && k.slice(1)!=='hits' && !EFFECT_SET_SPECIAL.includes(k.slice(1))){ const f = k.slice(1); if(isCapsuleField(f)) capsuleSetTotal(t, f, b[k], ''); else t[f] = b[k]; } });
      });
      merged.trig = t;
    }
    if(merged.cost<0) merged.cost = 0;   // 「コストを増減する」で0未満にはならない
    return merged;
  }
  return card;
}

// カードが持つカード操作（有効なもの）の配列。新形式は cardOps、旧形式の単一 cardOp にも対応する。
function cardOpsOf(c){
  if(!c) return [];
  if(Array.isArray(c.cardOps)) return c.cardOps.filter(o=>o && o.enabled!==false);
  return (c.cardOp && c.cardOp.enabled) ? [c.cardOp] : [];
}

/* ============================= CARD TEXT ============================= */

// 効果付与の付与先の表記（カスタム状態の付与で、付与先を指定したときだけ）
function buffTargetText(op){
  if(!String(op.buffField||'').startsWith('cs_')) return '';

}
// 効果付与で、対象のカードに「保持」「消滅」を付ける／外す設定（retainGrant / exhaustGrant: ''=変えない／'add'=付ける／'remove'=外す）。
// 付けた・外した結果は、カード実体の補正（永続 instanceBuffs／この戦闘中のみ tempInstanceBuffs）に「=retain」「=exhaust」の上書きとして記録する（永続の設定は、他の効果付与と同じ）。
const GRANT_FLAG_DEFS = [

  {key:'valueNoDrop', prop:'valueNoDropGrant', label:'効果値が下がらない', hint:'弱体・状態などで、効果値が下がらない'},
];
// 効果値の補正（強化・器用・弱体・脆弱・属性の弱点／耐性・カスタム状態など）を、働かせるか。delta: 補正の向き（正＝増える、負＝減る）。
// 参照増減（カード自身の設定）と、ブロックで防ぐ処理は対象外。「効果値固定」のカードは増える補正を、「効果値が下がらない」カードは減る補正を、受けない。
function valueModOk(card, delta){
  if(!card || !delta) return true;
  if(delta>0 && card.valueFixed) return false;
  if(delta<0 && card.valueNoDrop) return false;
  return true;
}
function cleanGrantMode(v){ return (v==='add' || v==='remove') ? v : ''; }
function grantFlagParts(op){
  return GRANT_FLAG_DEFS.map(d=> op && op[d.prop]==='add' ? `${d.label}を付与` : (op && op[d.prop]==='remove' ? `${d.label}を解除` : '')).filter(Boolean);
}
function extraGrantParts(op){
  const w = tagListOf(op && op.addTags);
  return (w.length ? [`タグ[${w.join('・')}]を追加`] : []).concat(grantFlagParts(op));
}
function onlyAddTags(op){ return extraGrantParts(op).length>0 && !(op.buffField && (op.buffAmount||0)); }
function addTagsText(op){ const p = extraGrantParts(op); return p.length ? `（${p.join('・')}）` : ''; }
// 編集画面の選択欄。selAttr(prop) は select に付ける属性、labFn(text) はラベルのHTMLを返す。
function grantFlagsHTML(op, selAttr, labFn){
  return GRANT_FLAG_DEFS.map(d=>`<div style="margin-top:8px;">${labFn(`${d.label}（${d.hint}）`)}<select ${selAttr(d.prop)} style="width:100%;">
    <option value="" ${!op[d.prop]?'selected':''}>変えない</option>
    <option value="add" ${op[d.prop]==='add'?'selected':''}>${d.label}を付ける</option>
    <option value="remove" ${op[d.prop]==='remove'?'selected':''}>${d.label}を外す</option></select></div>`).join('')
    + `<p class="hint">特性（保持・消滅・効果値固定・効果値が下がらない）の付け外しは、「永続」の設定に従います（チェックなしはこの戦闘中のみ）。付与量が0でも、特性・タグだけ変えられます。</p>`;
}
// 続けの操作1つぶんの説明
function thenOpText(t){
  const sg = n=> n>=0 ? `+${n}` : `${n}`;
  const x = t.valueMode==='targetCount' ? '対象の枚数×' : '';
  const perm = CARDOP_REVERTIBLE_TYPES.includes(t.type) ? (t.permanent ? '（永続）' : '') : '';
  switch(t.type){
    case 'moveToHand': return '手札に移動';
    case 'moveToDiscard': return '捨て札に移動';
    case 'moveToDraw': return '山札に加える';
    case 'moveToDrawTop': return '山札の一番上に置く';
    case 'moveToExhausted': return t.exhaustMode==='stay' ? '消滅（永続・復活しない）' : t.exhaustMode==='destroy' ? '消滅（デッキから取り除く）' : '消滅';
    case 'elementAdd': return `属性「${elementName(t.elementId)||'?'}」を付与${perm}`;
    case 'elementRemove': return `属性${t.elementId==='all'?'すべて':'「'+tipElementName(t.elementId)+'」'}を取り除く${perm}`;
    case 'upgrade': return '強化'+perm;
    case 'duplicate': return '複製'+perm;
    case 'play': return 'コストなしで使用';
    case 'grantBuff': { if(t.buffSource==='captured') return `取得した効果を${t.buffMode==='set'?'上書き':'加算'}で付与${perm}`; const fd = allEffectFieldDefs().find(d=>d.key===t.buffField); return (t.buffField && (t.buffAmount||0) ? `「${fd ? fd.label : t.buffField}」${x}${sg(t.buffAmount||0)}を付与` : (extraGrantParts(t).length ? '' : `「${fd ? fd.label : t.buffField}」${x}${sg(t.buffAmount||0)}を付与`)) + addTagsText(t) + perm; }
    case 'costChange': return `コストを${x}${sg(t.costDelta|0)}${perm}`;
  }

}
function cardOpDescParts(op){
  const parts = cardOpDescPartsBase(op);
  { const pre = opCondPrefix(op); if(pre && parts.length) parts[0] = pre + parts[0]; }
  if(op.valueMode==='targetCount' && (op.type==='grantBuff' || op.type==='costChange')) parts.push('（付与量・増減量は、設定値×対象の枚数）');
  if(op.then && op.then.length) parts.push(`その同じカードに続けて: ${op.then.map(thenOpText).join('→')}`);

}
function cardOpDescPartsBase(op){
  const parts = [];
  const isGenerate = GENERATE_TYPES.includes(op.type);
  const isLast = !isGenerate && op.fromPile==='last';
  const isSelf = !isGenerate && (op.fromPile==='self' || isLast);
  const subj = isLast ? '最後に使ったカード' : 'このカード';
  let typeLabel = (CARDOP_TYPES.find(t=>t.key===op.type)||{}).label || op.type;
  const sg = n=> n>=0 ? `+${n}` : `${n}`;
  if(op.type==='captureEffect') typeLabel = `選び、効果を取得する（${(op.captureFields||[]).includes(CAPTURE_ALL) ? 'すべての効果' : (op.captureFields||[]).map(k=>{ const d = allEffectFieldDefs().find(x=>x.key===k); return d ? d.label : k; }).join('・')}）`;
  if(op.type==='elementAdd') typeLabel = `選び、攻撃の属性に「${elementName(op.elementId)||'?'}」を付与する`;
  if(op.type==='elementRemove') typeLabel = `選び、攻撃の属性から${op.elementId==='all' ? 'すべて' : '「'+tipElementName(op.elementId)+'」'}を取り除く`;
  if(op.type==='moveToDrawTop') typeLabel = '山札の一番上に置く';
  if(op.type==='moveToExhausted') typeLabel = op.exhaustMode==='stay' ? '消滅させる（永続：戦闘後も復活しない）' : op.exhaustMode==='destroy' ? '消滅させる（デッキから完全に取り除く）' : '消滅させる';
  if(op.type==='grantBuff' && op.buffSource==='captured') typeLabel = `選び、取得した効果を${op.buffMode==='set'?'上書き':'加算'}で付与する`;
  if(isSelf){
    if(op.type==='grantBuff' && op.buffSource!=='captured'){
      const fd = allEffectFieldDefs().find(d=>d.key===op.buffField);
      if(onlyAddTags(op)) parts.push(`${subj}に${extraGrantParts(op).join('し、')}する`); else parts.push(`${subj}の「${fd ? fd.label : op.buffField}」を${op.buffMode==='set' ? sg(op.buffAmount||0).replace('+','')+'に上書き' : sg(op.buffAmount||0)+'する'}${buffTargetText(op)}${addTagsText(op)}`);
    } else if(op.type==='costChange'){
      parts.push(`${subj}のコストを${sg(op.costDelta|0)}する`);
    } else parts.push(`${isLast ? subj : 'このカード自身'}を${typeLabel}`);
  } else {
    const rangeLabel = isGenerate
      ? genPoolLabel(op)
      : ((PILE_OPTIONS.find(p=>p.key===op.fromPile)||{}).label || op.fromPile);
    const seqText = (op.sequential && op.countMode!=='all') ? '（1枚ずつ選び直し）' : '';
    const xCount = (op.countSource==='xLast' || op.countSource==='xTotal') && (op.countMode==='fixed' || op.countMode==='choose')
      ? `X${op.xMult!==undefined && op.xMult!==1 ? '×'+op.xMult : ''}${op.countFixed ? sg(op.countFixed) : ''}枚（X＝${op.countSource==='xTotal' ? 'ここまでのカード操作の対象枚数の合計' : '直前のカード操作の対象枚数'}）` : '';
    const countText = (xCount ? ((op.countMode==='choose' && op.type!=='generateToEnemyDeck') ? '任意の'+xCount : xCount)
      : op.countMode==='all' ? '対象すべて'
      : (op.countMode==='choose' && op.type!=='generateToEnemyDeck') ? `任意の${op.countFixed}枚`
      : op.countMode==='choose' ? `${op.countFixed}枚`
      : op.countMode==='random' ? `${op.countMin}〜${op.countMax}枚`

    const tagText = tagCondText(op.filterTag, op.filterTagMode);
    if(op.type==='grantBuff' && op.buffSource!=='captured'){
      const fieldDef = allEffectFieldDefs().find(d=>d.key===op.buffField);
      const fieldLabel = fieldDef ? fieldDef.label : op.buffField;
      if(onlyAddTags(op)) parts.push(`${rangeLabel}の${tagText}カードを${countText}選び、${extraGrantParts(op).join('し、')}する`); else parts.push(`${rangeLabel}の${tagText}カードを${countText}選び、「${fieldLabel}」を${op.buffMode==='set' ? String(op.buffAmount||0)+'に上書き' : sg(op.buffAmount||0)+'する'}${buffTargetText(op)}${addTagsText(op)}`);
    } else if(op.type==='costChange'){
      parts.push(`${rangeLabel}の${tagText}カードを${countText}選び、コストを${sg(op.costDelta|0)}する`);
    } else if(isGenerate){
      parts.push(`${rangeLabel}${tagText?`（${tagText.slice(0,-1)}）`:''}から${countText}${typeLabel}${op.type==='generateToEnemyDeck' ? `（重み${Math.max(1,op.deckWeight||1)}）` : ''}`);
    } else {
      parts.push(`${rangeLabel}の${tagText}カードを${countText}${typeLabel}`);
    }
    { const pk = opPickText(op); if(pk && parts.length) parts[parts.length-1] += pk; }
  }
  if(CARDOP_REVERTIBLE_TYPES.includes(op.type) && op.type!=='moveToExhausted'){
    parts.push(op.permanent ? '（永続：戦闘後も残る）' : '（この戦闘中のみ）');

// 「さらに選ぶ」の説明（操作の説明の末尾に付ける）
function opPickText(op){
  if(!op || (op.pickMode!=='random' && op.pickMode!=='choose') || op.countMode==='choose' || op.sequential) return '';
  const k = Math.max(1, op.pickCount|0 || 1);
  return `（そのうち${k}枚を${op.pickMode==='choose' ? 'あなたが選ぶ' : 'ランダムに選ぶ'}。選ばれなかったカードには何も起きない${op.pickMode==='choose' && op.pickOptional ? '。選ばなくてもよい' : ''}）`;

function opScaleNote(op){
  if(!op || !op.scales) return '';

  Object.keys(OP_SCALE_LABELS).forEach(f=>{
    const x = op.scales[f];

    const src = allScaleSources().find(v=>v.key===x.source);
    out.push(`${OP_SCALE_LABELS[f]}: ${src ? src.label : x.source}${scaleSourceTagText(x.source, x.tag, x.tagMode)}×${x.perPoint}`);
  });
  return out.length ? `（${out.join('、')}）` : '';

/* ============================= カード説明文（発動順・新書式。Phase 13n） =============================
   方針:
   - 書く順番は「実際に発動する順番」（orderedPlayerSteps）。効果カプセル・カード操作・状態の操作を、その順番のまま1つの流れにする。
   - 同じ対象（相手に／自身に）の効果が続くときは、「, 」でつなぐ。対象が変わる・条件つき・参照増減つきの効果は、別の文にする。

   - 効果がないカードの説明は、空にする。 */
const DESC_BUILTIN_NAMES = {strength:'強化', dexterity:'器用', weak:'弱体', vulnerable:'脆弱', poison:'毒', regen:'再生', stun:'麻痺', metallicize:'自動ブロック', thorns:'棘'};
function dSt(id){ return `<span class="st-ref" data-st="b:${id}">${DESC_BUILTIN_NAMES[id]}</span>`; }
function dCs(st){ return `${st.emoji ? escapeHtml(st.emoji)+' ' : ''}<span class="st-ref" data-st="c:${escapeHtml(st.id)}">${escapeHtml(st.name)}</span>`; }
const descSg = n=> n>=0 ? `+${n}` : `${n}`;
const DESC_PILE = {hand:'手札', draw:'山札', discard:'捨て札', exhausted:'消滅済み', drawAndDiscard:'山札+捨て札'};

// 条件1つ（使用条件・効果の条件・カード操作の条件で共通）

const descConds = list=> (Array.isArray(list) ? list : []).map(descCondText).filter(Boolean).join('かつ');

// 参照増減の参照元（短い名前）
const DESC_SCALE_LABELS = {

  playerMissingHp:'自身のHP減少量', playerMissingHpPct:'自身のHP減少率（％）', enemyMissingHpPct:'相手のHP減少率（％）',

const descRef = (sc, abs)=> `${descRefLabel(sc)}×${fmtNum(abs ? Math.abs(sc.perPoint) : sc.perPoint)}`;

// 効果の種類ごとの書き方。v＝値の文字列、fx＝「(固定)」。grp＝同じ対象でまとめる区分（foe＝相手に／self＝自身に／misc＝主語なし／solo＝まとめない）
function descKind(kind, v, fx){

}
const descItemSentence = it=> it.solo ? it.text : (it.grp==='foe' ? '相手に' : it.grp==='self' ? '自身に' : '') + it.body;

// 効果カプセル1つ → 文の部品。prev＝直前の数値効果（同じ種類が続くときの「増加」表記の判定用）
function descCapItem(c, e, prev, useFixed){
  if(!e) return null;
  const kind = e.kind, amt = e.amount|0;
  const sc = (e.scale && e.scale.source && e.scale.source!=='none' && e.scale.perPoint) ? e.scale : null;
  const fx = (useFixed && (kind==='damage' || kind==='block') && (e.fixed || c.valueFixed)) ? '(固定)' : '';   // 効果値固定が働くのは、ダメージとブロック
  if(amt===0 && !sc) return null;   // 値が0の効果は説明に出さない（強化前の0など）
  const v = (sc && amt===0) ? descRef(sc) : (e._parts ? e._parts.join('+').replace(/\+-/g, '-') : String(amt));   // _parts＝続く同じ種類を合計する効果（例: 4+3）
  let it;
  if(isCustomCapsuleKind(kind)){
    const st = (S.customStatuses||[]).find(x=>'cs_'+x.id===kind); if(!st) return null;
    const tg = (e.target==='self' || e.target==='opponent') ? e.target : (st.target==='opponent' ? 'opponent' : 'self');
    it = (amt<0 && !(sc && amt===0))
      ? {grp:'solo', body:`${tg==='opponent' ? '相手' : '自身'}の${dCs(st)}${v}${fx}`}
      : {grp: tg==='opponent' ? 'foe' : 'self', body:`${dCs(st)}${v}${fx}`};
  } else {
    it = descKind(kind, v, fx);
  }
  if(!it) return null;
  it.kind = kind; it._cap = e;
  if(sc && amt===0 && kind==='damage' && v.startsWith('相手の')){ it.solo = true; it.text = it.body; }   // 「相手に相手の…」を避ける
  if(sc && amt!==0) it.after = `${descRef(sc, true)}ぶん${sc.perPoint>0 ? '増加' : '減少'}`;
  const cond = descConds(e.conditions);
  if(cond){
    it.solo = true;
    if(prev && prev.kind===kind && (kind==='damage' || kind==='block')){
      it.text = `${cond}の場合${kind==='damage' ? `${v}ダメージ${fx}増加` : `ブロック${v}${fx}増加`}`;   // 同じ種類が続くときは、合計して1回の処理になる（前の効果への上乗せ）
    } else {
      it.text = `${cond}の場合、${it.grp==='foe' ? '相手に' : it.grp==='self' ? '自身に' : ''}${it.body}`;
    }
    it.hasCond = true;
  } else if(it.grp==='solo'){ it.solo = true; it.text = it.body; }
  return it;
}

// 項目の並びを、文（「。」で区切る単位）の配列にする。同じ対象が続くものは「, 」でつなぐ
function descEmit(items){
  const out = []; let run = null;
  const flush = ()=>{ if(run){ out.push((run.grp==='foe' ? '相手に' : run.grp==='self' ? '自身に' : '') + run.bodies.join(', ')); run = null; } };
  items.forEach(it=>{
    if(it.sentence!==undefined){ flush(); out.push(it.sentence); return; }
    if(it.solo){ flush(); out.push(it.text); }
    else if(run && run.grp===it.grp) run.bodies.push(it.body);
    else { flush(); run = {grp:it.grp, bodies:[it.body]}; }
    if(it.after){ flush(); out.push(it.after); }
  });
  flush();
  return out;
}

function descStatusOp(op){
  if(!op || !op.enabled || !op.tag) return '';
  const who = op.side==='opponent' ? '相手' : (op.side==='both' ? '自分と相手' : '自分');
  const tg = scaleTagText(op.tag, op.tagMode);
  return op.mode==='increase' ? `${who}の${tg}を${op.amount}増やす` : op.mode==='reduce' ? `${who}の${tg}を${op.amount}減らす` : `${who}の${tg}をすべて取り除く`;
}

// 効果付与（grantBuff）の中身。例: 「ダメージを+3」「ブロックを10に上書き」「タグ[炎]を追加」「保持を付与」
function descGrantClauses(op){
  const cl = [];
  const fd = allEffectFieldDefs().find(d=>d.key===op.buffField);
  const label = fd ? String(fd.label).replace(/（[^）]*）/g, '') : op.buffField;
  if(op.buffField && ((op.buffAmount||0)!==0 || op.buffMode==='set')) cl.push(op.buffMode==='set' ? `${label}を${op.buffAmount||0}に上書き` : `${label}を${descSg(op.buffAmount||0)}`);
  const tg = tagListOf(op.addTags); if(tg.length) cl.push(`タグ[${tg.join('・')}]を追加`);
  grantFlagParts(op).forEach(p=> cl.push(p));
  return cl;
}

// カード操作1つ → 文の配列
function descOpSentences(op){
  if(!op) return [];
  const cond = descConds(op.conditions), cp = cond ? `${cond}の場合、` : '';
  const isGen = GENERATE_TYPES.includes(op.type);
  const permT = (CARDOP_REVERTIBLE_TYPES.includes(op.type) && op.type!=='moveToExhausted' && !isGen && op.permanent) ? '（永続）' : '';
  const out = [];
  let s = '';
  if(isGen){
    const dest = {generateToHand:'手札に加える', generateToDraw:'山札に加える', generatePlay:'コストを消費せず使用する', generateToEnemyDeck:'敵のデッキに加える'}[op.type];
    const n = op.countMode==='random' ? ((op.countMin|0)===(op.countMax|0) ? `${op.countMin}枚` : `${op.countMin}〜${op.countMax}枚`) : `${op.countFixed}枚`;
    const tt = scaleTagText(op.filterTag, op.filterTagMode);
    const pool = op.genPool==='exclusiveOnly' ? (op.type==='generateToEnemyDeck' ? '生成専用カードから' : '生成専用・敵専用カードから') : '';
    s = `${pool}${tt ? tt+'の' : ''}カードをランダムで${n}生成し、${dest}`;
  } else {
    // 動作（act）と、「選んで〜」の形にするか（te）
    let act = '', te = false;
    switch(op.type){
      case 'moveToHand': act = '手札に移動する'; break;
      case 'moveToDiscard': act = '捨て札に移動する'; break;
      case 'moveToDraw': act = '山札に加える(シャッフル)'; break;
      case 'moveToDrawTop': act = '山札の一番上に置く'; break;
      case 'moveToExhausted': te = true; act = '消滅させる' + (op.exhaustMode==='stay' ? '（永続）' : op.exhaustMode==='destroy' ? '（デッキから完全に取り除く）' : ''); break;
      case 'upgrade': te = true; act = '強化する'; break;
      case 'duplicate': te = true; act = '複製する'; break;
      case 'play': act = 'コストを消費せず使用する'; break;
      case 'costChange': act = `コストを${descSg(op.costDelta|0)}する`; break;
      case 'captureEffect': te = true; act = (op.captureFields||[]).includes(CAPTURE_ALL) ? '効果を取得する' : `「${(op.captureFields||[]).map(k=>{ const d = allEffectFieldDefs().find(x=>x.key===k); return d ? String(d.label).replace(/（[^）]*）/g,'') : k; }).join('・')}」の効果を取得する`; break;
      case 'elementAdd': act = `${elementName(op.elementId)||'?'}属性を付与する`; break;
      case 'elementRemove': if(op.elementId==='all'){ te = true; act = '属性を無効化する'; } else act = `${tipElementName(op.elementId)}属性を取り除く`; break;
      case 'grantBuff':
        if(op.buffSource==='captured'){ te = true; act = `取得した効果を付与する(${op.buffMode==='set' ? '上書き' : '加算'})`; }
        else act = descGrantClauses(op).join(', ') + 'する';
        break;
      default: act = op.type;
    }
    if(op.fromPile==='self' || op.fromPile==='last'){
      const subj = op.fromPile==='last' ? '最後に使ったカード' : 'このカード';
      if(op.type==='costChange') s = `${subj}のコストを${descSg(op.costDelta|0)}する`;
      else if(op.type==='grantBuff' && op.buffSource!=='captured'){
        const numeric = op.buffField && ((op.buffAmount||0)!==0 || op.buffMode==='set');
        s = `${subj}${numeric ? 'の' : 'に'}${act}`;
      }
      else if(op.type==='elementAdd') s = `${subj}に${act}`;
      else if(op.type==='elementRemove' && op.elementId!=='all') s = `${subj}から${act}`;
      else s = `${subj}を${act}`;
    } else {
      const tt = scaleTagText(op.filterTag, op.filterTagMode);
      const obj = `${descPile(op.fromPile)}${tt ? 'の'+tt : ''}`;
      const sel = te ? '選んで' : '選び、';
      const xs = (op.countSource==='xLast' || op.countSource==='xTotal') && (op.countMode==='fixed' || op.countMode==='choose');
      const seq = (op.sequential && op.countMode!=='all') ? '1枚ずつ' : '';
      if(xs){
        const lead = `${op.countSource==='xTotal' ? 'ここまでの合計枚数' : 'その数'}${op.xMult!==undefined && op.xMult!==1 ? '×'+op.xMult : ''}${op.countFixed ? descSg(op.countFixed) : ''}だけ、`;
        s = `${lead}${descPile(op.fromPile)}${tt ? 'の'+tt : ''}のカードを${act}`;
      } else if(op.countMode==='all'){
        const pk = (op.pickMode==='random' || op.pickMode==='choose') && !op.sequential
          ? `その中から${op.pickMode==='random' ? 'ランダムで' : ''}${Math.max(1, op.pickCount|0 || 1)}枚${op.pickMode==='choose' && op.pickOptional ? 'まで' : ''}選んで` : '';
        s = pk ? `${obj}をすべて選び、${pk}${act}` : `${obj}をすべて${sel}${act}`;
      } else if(op.countMode==='random'){
        const n = (op.countMin|0)===(op.countMax|0) ? `${op.countMin}枚` : `${op.countMin}〜${op.countMax}枚`;
        s = `${obj}を${n}ランダムで${sel}${act}`;
      } else if(op.countMode==='choose'){
        s = `${obj}を${seq}${op.countFixed}枚${sel}${act}`;
      } else {
        s = `${obj}を${op.countFixed}枚${act}`;
      }
    }
  }
  if(op.valueMode==='targetCount' && (op.type==='grantBuff' || op.type==='costChange')) s += '（設定値×対象の枚数）';
  s += permT;
  { const sn = opScaleNote(op); if(sn) s += sn; }
  out.push(cp + s);
  if(op.type==='duplicate') out.push('複製は捨て札に移動する');
  if(op.then && op.then.length){
    const cl = op.then.map(thenOpText).filter(Boolean);
    if(cl.length) out.push('さらに' + cl.map((t,i)=> t + (i<cl.length-1 ? 'し、' : 'する')).join(''));
  }
  return out;
}

// 続けて1回の処理にまとめられる同じ種類の効果か（条件・参照増減なし。固定の有無・カスタム状態の付与先が同じ）
function descCapTarget(e){ const st = isCustomCapsuleKind(e.kind) ? (S.customStatuses||[]).find(x=>'cs_'+x.id===e.kind) : null; return st ? ((e.target==='self'||e.target==='opponent') ? e.target : (st.target==='opponent' ? 'opponent' : 'self')) : ''; }
function descMergeable(a, b){
  const plain = x=> !(x.conditions && x.conditions.length) && !(x.scale && x.scale.source && x.scale.source!=='none' && x.scale.perPoint);
  return a.kind===b.kind && plain(a) && plain(b) && !!a.fixed===!!b.fixed && descCapTarget(a)===descCapTarget(b);
}
// 発動順の流れ → 文の配列（カード1セット分。即時効果、または仕込み側の効果）
function descSetSentences(c, hitsN, useFixed){
  const items = [], caps = Array.isArray(c.effects) ? c.effects : [];
  let prev = null;
  orderedPlayerSteps(c).forEach(id=>{
    if(id.startsWith('fx:')){
      const e = caps.find(x=>x && 'fx:'+x.id===id); if(!e) return;
      // 同じ種類が（しきりなく）続くときは、合計して1回の処理になるので「4+3」と書く。条件・参照増減つきは別に書く
      const last = items[items.length-1];
      if(prev && last===prev && prev._cap && descMergeable(prev._cap, e)){
        const pc = prev._cap, parts = (pc._parts || [pc.amount|0]).concat([e.amount|0]);
        const merged = descCapItem(c, {...pc, amount:(pc.amount|0)+(e.amount|0), _parts:parts}, null, useFixed);
        if(merged){ items[items.length-1] = merged; prev = merged; }
        return;
      }
      const it = descCapItem(c, e, prev, useFixed);
      if(it){ items.push(it); prev = it; }
    } else if(id.startsWith('op:')){
      const ops = cardOpsOf(c), op = ops.find((o,k)=>opStepId(o,k)===id);
      if(op){ descOpSentences(op).forEach(t=>{ if(t) items.push({sentence:t}); }); }
      prev = null;
    } else if(id==='statusOp'){
      const t = descStatusOp(c.statusOp); if(t) items.push({sentence:t});
      prev = null;
    } else if(id.startsWith('sep:') || id==='hits'){
      prev = null;
    } else {
      // 旧形式の固定欄（カプセルへの変換前のカード・補正で値が入ったものなど）
      const def = allEffectFieldDefs().find(d=>d.key===id); if(!def) return;
      const base = c[def.key]!==undefined ? c[def.key] : (def.default||0);
      let show = def.showIf ? def.showIf(base) : (def._statusId ? base!==0 : base>0);
      if(def._statusId && c['csT_'+def._statusId]==='both' && (c['csX_'+def._statusId]|0)!==0) show = true;
      if(show) items.push({sentence:def.desc(base, c)});
      const scale = c.scales && c.scales[def.key];
      if(scale && scale.source && scale.source!=='none' && scale.perPoint) items.push({sentence:`${descRef(scale, true)}ぶん${scale.perPoint>0 ? '増加' : '減少'}`});
      prev = null;
    }
  });
  const out = descEmit(items);
  if(hitsN>1) out.unshift(`${hitsN}回発動`);
  return out;
}

// ドロー時・消滅時・所持効果のカプセル（と、旧形式の固定欄）→ 文の配列
function descChannelSentences(c, prop, defs, pre){
  const items = [];
  (Array.isArray(c[prop]) ? c[prop] : []).forEach(e=>{ const it = descCapItem(c, e, null, false); if(it) items.push(it); });
  const out = descEmit(items);
  defs.forEach(def=>{
    const v = c[def.key]||0;
    const show = def._statusId ? (v!==0 || (c[pre+'csT_'+def._statusId]==='both' && ((c[pre+'csX_'+def._statusId])|0)!==0)) : v>0;
    if(show) out.push(def.desc(v, c));
  });
  return out;
}

function descTriggerHead(c){
  const onKind = cleanTriggerOn(c.triggerOn);
  const tl = tagListOf(c.triggerTag), tg = tl.length ? scaleTagText(c.triggerTag, c.triggerTagMode) : '';
  const n = triggerTurns(c), dur = n>0 ? (n===1 ? 'このターンの間、' : `${n}ターンの間、`) : '';
  const every = triggerEveryOf(c), ev = every>1 ? `${every}回` : '';
  let when;
  if(onKind==='damaged') when = c.triggerBlocked ? `敵の攻撃を${ev}受ける度に` : `敵の攻撃でダメージを${ev}受ける度に`;
  else if(onKind==='drawn') when = `カード効果で${tg || 'カード'}を${ev}引く度に`;
  else if(onKind==='discarded') when = `カード効果で${tg || 'カード'}が${ev}捨て札に移る度に`;
  else if(onKind==='turnStart') when = turnIntervalOf(c)>1 ? `${turnIntervalOf(c)}ターンごとに` : '毎ターン';
  else when = `${tg || (ev ? '任意のカード' : 'カード')}を${ev}使う度に`;
  return `【仕込み】${dur}${when}`;
}
const DESC_HOLD_LABEL = {hand:'手札にある間', draw:'山札にある間', discard:'捨て札にある間', exhausted:'消滅済みにある間', any:'デッキにある間'};

function cardDescription(c, setOnly){
  if(setOnly) return descSetSentences(c, 1, true).map(s=>s+'。').join('');
  const sents = [];
  const req = descConds(c.requirements);
  if(req) sents.push(`${req}のとき使用可能`);
  if(c.openingDraw) sents.push('戦闘開始時必ず引く');
  const imm = hasImmediate(c), trg = hasTrigger(c);
  if(imm) sents.push(...descSetSentences(c, c.hits>1 ? (c.hits|0) : 1, true));
  const traits = [];
  if(c.pierce) traits.push('貫通');
  if(c.lifesteal) traits.push('吸血');
  if(c.retain) traits.push('保持');
  if(c.exhaust) traits.push('消滅する');
  if(traits.length) sents.push(traits.join(' '));
  { const el = cardElementIds(c).map(elementName).filter(Boolean); if(el.length) sents.push(`${el.join(', ')}属性`); }
  if(trg){
    const head = descTriggerHead(c), th = triggerHitsOf(c);
    let eff;
    if(imm && !(c.triggerSeparate && c.trig)) eff = th>1 ? `このカードの効果が${th}回発動` : 'このカードの効果が発動';
    else eff = descSetSentences(triggerCardData(c), th>1 ? th : 1, true).join('。');
    if(eff) sents.push(`${head} ${eff}`);
  }
  const dw = descChannelSentences(c, 'dw_effects', drawEffectFieldDefs(), 'dw_'); if(dw.length) sents.push(`【ドロー時】${dw.join('。')}`);
  const ex = descChannelSentences(c, 'ex_effects', exhaustEffectFieldDefs(), 'ex_'); if(ex.length) sents.push(`【消滅時】${ex.join('。')}`);
  const ho = descChannelSentences(c, 'ho_effects', holdEffectFieldDefs(), 'ho_'); if(ho.length) sents.push(`【所持効果】${DESC_HOLD_LABEL[holdPileOf(c)] || DESC_HOLD_LABEL.hand}、${ho.join('。')}`);
  if(c.valueNoDrop) sents.push('効果値が減らされない');
  let desc = sents.length ? sents.join('。') + '。' : '';
  if(c.descPrefix) desc = `<span class="desc-prefix">${escapeHtml(c.descPrefix)}</span> ` + desc;
  return desc;
}

// ===== 状態名のポップアップ説明（カードの説明にある状態名: 説明） =====
function builtinStatusGeneral(id){
  const f = fmtNum, dec = k=> bsParam(id,'decay')>0 ? `毎ターン${bsParam(id,'decay')}ずつ減る` : '毎ターン減らない';
  switch(id){
    case 'strength': return `攻撃のダメージが、スタック1につき+${f(bsParam('strength','per'))}される`;
    case 'dexterity': return `ブロックを得るとき、スタック1につき+${f(bsParam('dexterity','per'))}される`;
    case 'weak': return `与えるダメージが${f(bsParam('weak','pct'))}％減る。${dec()}`;
    case 'vulnerable': return `受けるダメージが${f(bsParam('vulnerable','pct'))}％増える。${dec()}`;
    case 'poison': return `ターン開始時に、スタック1につき${f(bsParam('poison','per'))}ダメージを受ける（ブロックでは防げない）。${dec()}`;
    case 'regen': return `ターン開始時に、スタック1につきHPが${f(bsParam('regen','per'))}回復する。${dec()}`;
    case 'stun': return '行動できない。行動を封じられるたびに1減る';
    case 'metallicize': return `ターン開始時に、スタック1につきブロックを${f(bsParam('metallicize','per'))}獲得する`;
    case 'thorns': return `攻撃を受けるたびに、スタック1につき${f(bsParam('thorns','per'))}ダメージを攻撃した相手に返す`;
  }
  return '';
}
function customStatusGeneral(st){
  const lines = (st.effects||[]).map(eff=> customEffectText(eff, 1)
    .replace(/<span class="tip-dim">（1スタックにつき([^。]*)。いま[^）]*）<\/span>/g, '（スタック1につき$1）')
    .replace(/<[^>]+>/g, ''));
  if(st.perTurnDelta) lines.push(`持ち主のターン開始時に、スタックが${signed(st.perTurnDelta)}される`);
  if(st.persistent) lines.push('戦闘が終わっても残る');
  return lines.filter(Boolean).join('。') || '（効果なし）';
}
// 説明の要素 el の中の状態名を集めて、「状態名: 説明」のHTMLを返す（無ければ ''）
window.cardDescStatusInfo = function(el){
  const seen = new Set(), rows = [];
  Array.from(el ? el.querySelectorAll('.st-ref') : []).forEach(n=>{
    const key = n.getAttribute('data-st'); if(!key || seen.has(key)) return; seen.add(key);
    if(key.startsWith('b:')){
      const id = key.slice(2), txt = builtinStatusGeneral(id); if(!txt) return;
      rows.push(`<div class="pop-st"><b>${escapeHtml(bsEmoji(id)+' '+bsName(id))}</b>: ${escapeHtml(txt)}</div>`);
    } else if(key.startsWith('c:')){
      const st = (S.customStatuses||[]).find(x=>x.id===key.slice(2)); if(!st) return;
      rows.push(`<div class="pop-st"><b>${escapeHtml((st.emoji ? st.emoji+' ' : '')+st.name)}</b>: ${escapeHtml(customStatusGeneral(st))}</div>`);
    }
  });
  return rows.join('');
};

// ---- アプリ内のダイアログ
// ブラウザ標準の alert／confirm／prompt は、アプリ内ブラウザやプレビュー枠などで、ブロックされて無反応になることがあるため、使わない。
function uiDialog(o){
  const ov = el(`<div class="modal-overlay" style="z-index:99999;"><div class="modal-box" role="dialog" aria-modal="true" style="max-width:480px;">
    ${o.title ? `<h3>${escapeHtml(o.title)}</h3>` : ''}
    <p style="margin:8px 0; line-height:1.7;">${escapeHtml(o.message||'').replace(/\n/g,'<br>')}</p>
    ${o.input ? `<input type="text" class="ui-dlg-input" maxlength="${o.input.max||60}" value="${escapeHtml(o.input.value||'')}" style="width:100%; margin:6px 0;">` : ''}
    <div class="modal-actions">${(o.buttons||[]).map((b,i)=>`<button type="button" class="${b.cls||'ghost'}" data-b="${i}">${escapeHtml(b.label)}</button>`).join('')}</div>
  </div></div>`);
  document.body.appendChild(ov);
  const inp = ov.querySelector('.ui-dlg-input');
  const close = (b)=>{ const v = inp ? inp.value : undefined; ov.remove(); document.removeEventListener('keydown', onKey, true); if(b && b.run) b.run(v); };
  const onKey = e=>{ if(!ov.isConnected) return; if(e.key==='Escape'){ e.stopPropagation(); close(o.buttons.find(b=>b.cancel)); } else if(e.key==='Enter' && inp){ e.preventDefault(); close(o.buttons.find(b=>b.ok)); } };
  document.addEventListener('keydown', onKey, true);
  ov.querySelectorAll('[data-b]').forEach(btn=>{ btn.onclick = ()=> close(o.buttons[+btn.dataset.b]); });
  const first = inp || ov.querySelector('.primary') || ov.querySelector('button'); if(first) setTimeout(()=>{ try{ first.focus(); if(inp) inp.select(); }catch(e){} }, 0);
  return ov;
}
