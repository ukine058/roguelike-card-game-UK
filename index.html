// Everything the player edits (cards, relics, rules) can be exported to one JSON file and
// imported on another device or browser. To add a new kind of data later (custom statuses,
// enemies...), add one entry to DATA_SECTIONS — export, import, preview and backup pick it up.
// To change the file format, bump SAVE_FORMAT_VERSION and add a converter to SAVE_MIGRATIONS.
const SAVE_APP_ID = 'ashbound-codex';
const SAVE_FORMAT_VERSION = 1;
const BACKUP_KEY = 'backup_before_import';
// SAVE_MIGRATIONS[1] = (d)=>{ ...convert v1 data to v2...; d.version = 2; return d; };
const SAVE_MIGRATIONS = {};

function escapeHtml(t){
  return String(t).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// IDs: letters, digits, _ and - only. A trailing "+" marks an upgraded card and "::" separates
// an instance id, so neither may appear in an id.
function validSaveId(id){ return typeof id==='string' && /^[A-Za-z0-9_-]{1,64}$/.test(id); }

// Names are inserted into the page as HTML (also inside value="..."), so strip the characters
// that could break out of it from anything that arrives in a file.
function deepClean(v){
  if(typeof v==='string') return v.replace(/[<>"]/g,'');
  if(Array.isArray(v)) return v.map(deepClean);
  if(v && typeof v==='object'){
    const o = {};
    Object.keys(v).forEach(k=>{ if(k!=='__proto__') o[k] = deepClean(v[k]); });
    return o;
  }
  return v;
}

// Fill in anything missing on imported items rather than trusting the file.
function normalizeCard(c){
  c = migrateCard({...c});
  c.cost = Number.isFinite(c.cost) ? Math.max(0, Math.floor(c.cost)) : 1;
  c.costMode = c.costMode==='x' ? 'x' : 'fixed';
  if(!RARITY_LABEL[c.rarity]) c.rarity = 'common';
  // 発動タイミング: 即時効果と予約（仕込み）を独立して有効にできる。旧データ（timing:'trigger'）は予約のみに移行し、hits は予約側（triggerHits）へ引き継ぐ。
  if(c.immediateEnabled===undefined && c.triggerEnabled===undefined){
    if(c.timing==='trigger'){ c.triggerEnabled = true; c.immediateEnabled = false; c.triggerHits = clampInt(c.hits,1,99,1); c.hits = 1; }
    else { c.immediateEnabled = true; c.triggerEnabled = false; }
  } else {
    c.triggerEnabled = !!c.triggerEnabled;
    c.immediateEnabled = c.immediateEnabled===undefined ? !c.triggerEnabled : !!c.immediateEnabled;
  }
  if(!c.immediateEnabled && !c.triggerEnabled) c.immediateEnabled = true;
  c.triggerHits = clampInt(c.triggerHits,1,99,1);
  c.turnInterval = clampInt(c.turnInterval,1,99,1);
  c.timing = (c.triggerEnabled && !c.immediateEnabled) ? 'trigger' : 'immediate';   // 旧版との互換用（新しい処理は hasTrigger / hasImmediate を使う）
  c.triggerOn = cleanTriggerOn(c.triggerOn);
  c.triggerEvery = triggerEveryOf(c);
  c.triggerBlocked = !!c.triggerBlocked;
  if(typeof c.triggerTag==='string') c.triggerTag = cleanTagList(c.triggerTag);
  c.triggerTagMode = cleanTagMode(c.triggerTagMode);
  CAPSULE_CHANNELS.forEach(ch=>{ c[ch.prop] = normalizeCapsules(c[ch.prop]); });
  if(!Array.isArray(c.tags)) c.tags = [];
  c.tags = c.tags.map(cleanTag).filter((t,i,a)=>t && a.indexOf(t)===i);
  c.suppressTypeTag = !!c.suppressTypeTag; c.suppressCostTag = !!c.suppressCostTag;
  c.openingDraw = !!c.openingDraw;
  c.valueFixed = !!c.valueFixed;      // 効果値固定（旧: カード全体）。効果ごとの設定（カプセルの fixed）へ移すので、通常は false になる
  c.valueNoDrop = !!c.valueNoDrop;    // 効果値が下がらない: 弱体・状態などで、効果値が下がらない
  c.charTags = cleanIdList(c.charTags);
  c.elements = Array.isArray(c.elements) ? c.elements.filter((id,i,a)=>typeof id==='string' && a.indexOf(id)===i) : [];
  if(!c.scales || typeof c.scales!=='object') c.scales = {};
  Object.keys(c.scales).forEach(k=>{ const x = c.scales[k]; if(x && typeof x==='object'){ x.tag = cleanTagList(x.tag); x.tagMode = cleanTagMode(x.tagMode); } });
  if(!Number.isFinite(c.startingCount)) c.startingCount = 0;
  if(typeof c.icon!=='string') c.icon = '';
  c.statusOp = normalizeCardStatusOp(c.statusOp);
  c.holdPile = holdPileOf(c);   // 所持効果を発動する山（既定は手札）
  // カード操作は複数持てる（cardOps）。旧データの単一の cardOp は1件の配列に変換する。
  if(Array.isArray(c.cardOps)) c.cardOps = c.cardOps.filter(o=>o && typeof o==='object').map(normalizeStatusOp);
  else c.cardOps = (c.cardOp && c.cardOp.enabled) ? [normalizeStatusOp(c.cardOp)] : [];
  ensureOpIds(c.cardOps);
  delete c.cardOp;
  if(c.valueFixed && Array.isArray(c.effects) && c.effects.length){ c.effects.forEach(e=>{ if(e && typeof e==='object') e.fixed = true; }); c.valueFixed = false; }   // 旧: カード全体の効果値固定 → すべての効果に「固定」を付ける
  // トリガー側を別の効果にする（即時とトリガーの両方が有効なカードだけ）
  if(c.triggerSeparate && c.triggerEnabled && c.immediateEnabled && c.trig && typeof c.trig==='object'){
    c.trig = normalizeTrigSet(c.trig); c.triggerSeparate = true;
  } else { c.triggerSeparate = false; delete c.trig; }
  return convertLegacyCard(c);   // 旧形式の取り込みデータは、効果カプセルに変換する
}
function normalizeRelic(r){
  r = migrateRelic({...r});
  if(!['common','uncommon','rare','special'].includes(r.rarity)) r.rarity = 'common';
  if(!r.effect || typeof r.effect!=='object') r.effect = {};
  if(!RELIC_TIMINGS.some(t=>t.key===r.timing)) r.timing = 'onPickup';
  if(typeof r.triggerTag!=='string') r.triggerTag = '';
  r.favorTag = cleanTagList(r.favorTag);
  r.triggerTag = cleanTagList(r.triggerTag);
  r.favorTagMode = cleanTagMode(r.favorTagMode);
  r.triggerTagMode = cleanTagMode(r.triggerTagMode);
  r.favorPct = clampInt(r.favorPct,0,1000,0);
  r.turnCond = ['eq','gte','every'].includes(r.turnCond) ? r.turnCond : 'always';   // ターン開始時の発動条件（always=毎ターン／eq=N回目だけ／gte=N回目以降／every=Nターンごと）
  r.turnN = clampInt(r.turnN,1,99,1);
  r.useLimit = clampInt(r.useLimit,0,99,0);                                  // 使える回数の上限（0で無制限）
  r.useScope = ['run','round','battle'].includes(r.useScope) ? r.useScope : 'run';   // 回数を数える範囲
  r.shopPrice = clampInt(r.shopPrice,0,9999,0);                              // ショップでの価格（0で標準）
  // 獲得時に入手するカード（行の重複も許す。カードは参照IDで持つ）／入手のしかた／開始デッキの置き換え
  r.gainMode = ['optional','forced'].includes(r.gainMode) ? r.gainMode : 'none';
  r.gainCards = (Array.isArray(r.gainCards) ? r.gainCards : []).slice(0,60).filter(g=>g && typeof g.cardId==='string' && g.cardId)
    .map(g=>({id: (typeof g.id==='string' && /^[A-Za-z0-9_-]{1,40}$/.test(g.id)) ? g.id : newCapsuleId(), cardId: g.cardId.slice(0,80)}));
  r.replaceStart = r.replaceStart===true;
  return r;
}
// カード操作の数値に付けられる参照増減。値: [最小, 最大]。参照増減の結果はこの範囲に収める。
const OP_SCALE_FIELDS = {countFixed:[0,99], countMin:[0,99], countMax:[0,99], buffAmount:[-999,999], costDelta:[-99,99], deckWeight:[1,99]};
const OP_SCALE_LABELS = {countFixed:'枚数', countMin:'ランダム最小', countMax:'ランダム最大', buffAmount:'付与量', costDelta:'コスト増減量', deckWeight:'重み'};
function cleanOpScales(sc){
  const out = {};
  if(!sc || typeof sc!=='object') return out;
  Object.keys(OP_SCALE_FIELDS).forEach(f=>{
    const x = sc[f];
    if(!x || typeof x.source!=='string' || !x.source || x.source==='none') return;
    out[f] = {source:x.source, tag: cleanTagList(x.tag), tagMode: cleanTagMode(x.tagMode), perPoint: clampFloat(x.perPoint,-10,10,0)};
  });
  return out;
}
function defaultStatusOp(){
  return {enabled:true, type:'moveToDiscard', fromPile:'hand', genPool:'normal', countMode:'fixed',
    countFixed:1, countMin:1, countMax:1, filterTag:'', filterTagMode:'any', buffField:'', buffAmount:0, retainGrant:'', exhaustGrant:'', valueFixedGrant:'', valueNoDropGrant:'', costDelta:1, deckWeight:1, drawNext:false, sequential:false, pickMode:'none', pickCount:1, pickOptional:false, permanent:false};
}
// 空のIDに、カード内で一意なID（op1, op2…）を振る。すでにあるIDは変えない。
function ensureOpIds(list){
  const used = new Set();
  list.forEach(o=>{ if(o && o.id){ if(used.has(o.id)) o.id = ''; else used.add(o.id); } });
  let n = 1;
  list.forEach(o=>{ if(o && !o.id){ while(used.has('op'+n)) n++; o.id = 'op'+n; used.add(o.id); } });
  return list;
}
function normalizeStatusOp(o){
  const d = defaultStatusOp();
  o = (o && typeof o==='object') ? o : {};
  const okType = ['moveToHand','moveToDiscard','moveToDraw','moveToDrawTop','moveToExhausted','upgrade','duplicate','play','grantBuff','costChange','captureEffect','elementAdd','elementRemove','generateToHand','generateToDraw','generatePlay','generateToEnemyDeck'];
  return {
    enabled:true,
    conditions: normalizeConditions(o.conditions),   // 実行条件（すべて満たしたときだけ、この操作を行う）
    type: okType.includes(o.type) ? o.type : d.type,
    fromPile: PILE_OPTIONS.some(x=>x.key===o.fromPile) ? o.fromPile : d.fromPile,
    genPool: GENERATE_POOL_OPTIONS.some(x=>x.key===o.genPool) ? o.genPool : d.genPool,
    countMode: ['fixed','random','all','choose'].includes(o.countMode) ? o.countMode : d.countMode,
    countFixed: clampInt(o.countFixed,0,20,1),
    // 枚数の元: value=設定値／xLast=直前のカード操作の対象枚数(X)／xTotal=ここまでのカード操作の対象枚数の合計(X)。X×倍率＋設定値（加算）が、枚数になる
    countSource: ['xLast','xTotal'].includes(o.countSource) ? o.countSource : 'value',
    xMult: clampFloat(o.xMult,0,20,1),
    countMin: clampInt(o.countMin,0,20,1),
    countMax: clampInt(o.countMax,0,20,1),
    filterTag: cleanTagList(o.filterTag),
    filterTagMode: cleanTagMode(o.filterTagMode),
    buffField: typeof o.buffField==='string' ? o.buffField : '',
    buffAmount: clampInt(o.buffAmount,-99,99,0),
    addTags: cleanTagList(o.addTags),   // 効果付与で、対象のカードに追加するタグ（カンマ区切り）
    retainGrant: cleanGrantMode(o.retainGrant),    // 効果付与で、保持を付ける／外す
    exhaustGrant: cleanGrantMode(o.exhaustGrant),  // 効果付与で、消滅（使用後に消滅）を付ける／外す
    valueFixedGrant: cleanGrantMode(o.valueFixedGrant),    // 効果付与で、効果値固定を付ける／外す
    valueNoDropGrant: cleanGrantMode(o.valueNoDropGrant),  // 効果付与で、効果値が下がらない特性を付ける／外す
    buffTarget: ['self','opponent'].includes(o.buffTarget) ? o.buffTarget : 'default',   // カスタム状態の付与先（default＝カード側の設定／状態の標準のまま）
    costDelta: clampInt(o.costDelta,-9,9,1),
    deckWeight: clampInt(o.deckWeight,1,99,1),
    drawNext: !!o.drawNext,
    sequential: !!o.sequential,
    // 「さらに選ぶ」: 対象が決まったあと、操作を行う前に、その中から pickCount 枚をランダム／プレイヤーが選ぶ。選ばれなかったカードには何も起きない（生成は作られない）。
    // 枚数の決め方が「プレイヤーが任意に選ぶ」のとき、「1枚ずつ選び直す」のときは使えない。pickOptional＝選ばなくてもよい（プレイヤーが選ぶときだけ）
    pickMode: (['random','choose'].includes(o.pickMode) && o.countMode!=='choose' && !o.sequential) ? o.pickMode : 'none',
    pickCount: clampInt(o.pickCount,1,20,1),
    pickOptional: o.pickMode==='choose' && !!o.pickOptional,
    permanent: !!o.permanent,
    exhaustMode: EXHAUST_MODES.some(m=>m.key===o.exhaustMode) ? o.exhaustMode : (o.permanent ? 'destroy' : 'combat'),
    buffSource: o.buffSource==='captured' ? 'captured' : 'fixed',   // fixed=設定した効果／captured=直前に取得した効果
    buffMode: o.buffMode==='set' ? 'set' : 'add',                  // add=加算／set=上書き
    captureFields: Array.isArray(o.captureFields) && o.captureFields.length ? o.captureFields.filter(k=>typeof k==='string').slice(0,80) : [CAPTURE_ALL],
    elementId: typeof o.elementId==='string' ? o.elementId.slice(0,64) : '',
    id: (typeof o.id==='string' && /^[A-Za-z0-9_-]{1,24}$/.test(o.id)) ? o.id : '',   // 効果の順番で、この操作を指す安定したID（カード内で一意）
    scales: cleanOpScales(o.scales),
    // 値（付与量・コスト増減量）を「設定値 × 対象の枚数」にする（枚数は、絞り込みと選択が終わったあとの実際の対象数）
    valueMode: o.valueMode==='targetCount' ? 'targetCount' : 'fixed',
    // 続けて、同じ対象のカードに行う操作（カードを追跡して順に行う。生成・敵のデッキへの追加は入れられない）
    ...(Array.isArray(o.then) && o.then.length ? {then: o.then.filter(t=>t && typeof t==='object' && !['generateToHand','generateToDraw','generatePlay','generateToEnemyDeck','useCardById','captureEffect'].includes(t.type)).slice(0,6)
      .map(t=>normalizeStatusOp({...t, then:[], countMode:'all', fromPile:'hand', sequential:false, filterTag:'', pickMode:'none'}))} : {}),
  };
}
function normalizeReaction(g){
  if(!g || typeof g!=='object' || typeof g.field!=='string' || !g.field) return null;
  const n = Number(g.amount);
  return {
    id: (typeof g.id==='string' && /^[A-Za-z0-9_-]{1,40}$/.test(g.id)) ? g.id : newCapsuleId(),
    field: g.field.slice(0,80),
    target: g.target==='self' ? 'self' : 'opponent',
    source: ['taken','blocked'].includes(g.source) ? g.source : 'fixed',
    amount: isFinite(n) ? Math.max(-999, Math.min(999, Math.round(n*100)/100)) : 0,
    perStack: g.perStack!==false,
  };
}
// 反射（reflectDamage）で「何を与えるか」: 'damage'（既定）／組み込みの 'weak'・'vulnerable'・'poison'／'cs:<カスタム状態ID>'
const REFLECT_BUILTIN_GIVES = ['weak','vulnerable','poison'];
function cleanReflectGive(v){
  if(typeof v!=='string') return 'damage';
  if(REFLECT_BUILTIN_GIVES.includes(v)) return v;
  return /^cs:[A-Za-z0-9_-]{1,64}$/.test(v) ? v : 'damage';
}
function normalizeStatusEffect(x){
  if(!x || typeof x!=='object') return null;
  if(x.kind!=='cardOp' && !CUSTOM_STATUS_KINDS.some(k=>k.key===x.kind)) return null;
  const e = {
    kind: x.kind,
    magnitudeMode: x.magnitudeMode==='perStack' ? 'perStack' : 'fixed',
    magnitudeValue: DECIMAL_MAG_KINDS.includes(x.kind)
      ? (Number.isFinite(parseFloat(x.magnitudeValue)) ? Math.max(-999, Math.min(999, Math.round(parseFloat(x.magnitudeValue)*1000)/1000)) : 1)
      : clampInt(x.magnitudeValue,-999,999,1),
  };
  if(x.kind==='cardOp') e.op = normalizeStatusOp(x.op);
  if(ELEMENT_KINDS.includes(x.kind)) e.element = (typeof x.element==='string' && x.element) ? x.element.slice(0,64) : 'all';
  if(ELEMENT_ATTACH_KINDS.includes(x.kind)){
    e.element = (typeof x.element==='string' && x.element) ? x.element.slice(0,64) : '';
    if(x.kind==='elGrant' && e.element==='all') e.element = '';   // 付与に「全属性」はない
  }
  if(x.kind==='keepBlock') e.keepCap = clampInt(x.keepCap,0,9999,0);   // 持ち越す最大値（0で上限なし）
  if(x.kind==='reflectDamage'){
    // 攻撃を受けた時の反応: 「効果のリスト」だけを持つ（rxVer 2）。主な効果と追加の効果の区別はない。
    // 旧形式（reflectGive／rxBasis／rxTarget＋magnitude の主な効果と、reactions の追加の効果）は、読み込み時に1つのリストへ変換する。
    let list = Array.isArray(x.reactions) ? x.reactions.slice() : [];
    if(x.rxVer!==2){
      const mv0 = parseFloat(x.magnitudeValue), mv = Number.isFinite(mv0) ? mv0 : 1;
      if(mv>0){   // 旧の主な効果は、0以下の値のとき何も起こさなかったので、変換もしない
        const give = cleanReflectGive(x.reflectGive);
        list.unshift({field: give.startsWith('cs:') ? 'cs_'+give.slice(3) : give, target: x.rxTarget==='self' ? 'self' : 'opponent',
          source: ['taken','blocked'].includes(x.rxBasis) ? x.rxBasis : 'fixed', amount: mv, perStack: x.magnitudeMode==='perStack'});
      }
    }
    e.reactions = list.slice(0,99).map(normalizeReaction).filter(Boolean);
    e.rxVer = 2;
    e.magnitudeMode = 'fixed'; e.magnitudeValue = 1;   // この種類では使わない
  }
  if(x.kind==='cardMod' || x.kind==='cardModPct'){
    e.modField = (typeof x.modField==='string' && x.modField) ? x.modField.slice(0,80) : 'damage';
    e.modTag = cleanTagList(x.modTag);
    e.modTagMode = cleanTagMode(x.modTagMode);
    e.decayOnUse = !!x.decayOnUse;
    e.decayN = clampInt(x.decayN,1,99,1);
  }
  if(x.kind==='revive'){
    e.reviveUnit = x.reviveUnit==='percent' ? 'percent' : 'fixed';
    // 復活したときのスタックの消費: one=1つ／all=すべて／keep=消費しない／n=reviveConsumeN個（足りないときは、あるだけ）
    e.reviveConsume = ['all','keep','n'].includes(x.reviveConsume) ? x.reviveConsume : 'one';
    if(e.reviveConsume==='n') e.reviveConsumeN = clampInt(x.reviveConsumeN,1,99,1);
    e.reviveGrants = (Array.isArray(x.reviveGrants) ? x.reviveGrants : []).filter(g=> g && typeof g.statusId==='string')
      .map(g=>({statusId:g.statusId, stacks:clampInt(g.stacks,1,99,1)}));
  }
  if(x.hpCondOp==='le' || x.hpCondOp==='ge'){ e.hpCondOp = x.hpCondOp; e.hpCondPct = clampInt(x.hpCondPct,0,100,50); }
  return e;
}
function parseExclTags(v){ return Array.isArray(v) ? v.map(cleanTag).filter((t,i,a)=>t && a.indexOf(t)===i) : parseTags(v); }
function normalizeCustomStatus(st){
  st = {...st};
  st.tags = (Array.isArray(st.tags) ? st.tags : []).map(cleanTag).filter((t,i,a)=>t && a.indexOf(t)===i);
  st = migrateCustomStatus({...st});
  if(st.target!=='opponent') st.target = 'self';
  if(!Number.isFinite(st.perTurnDelta)) st.perTurnDelta = 0;
  st.persistent = !!st.persistent;
  st.color = (typeof st.color==='string' && /^#[0-9a-fA-F]{6}$/.test(st.color)) ? st.color : '';   // 付与エフェクトの色（空欄なら、良い状態/悪い状態の色）
  // 排他: 付与のときに、指定タグ（組み込みの強化・弱体などの同名タグも可）の状態をどう扱うか
  st.exclOverwrite = parseExclTags(st.exclOverwrite);   // 付与する前に、これらのタグの状態をすべて取り除く
  st.exclYield = parseExclTags(st.exclYield);           // これらのタグの状態が付与されている間は、自分を付与しない
  st.exclReplaced = parseExclTags(st.exclReplaced);     // これらのタグの状態が後から付与されたら、自分が消える
  st.exclGuard = parseExclTags(st.exclGuard);           // 自分がいる間、これらのタグの状態の付与を無効にする
  st.effects = (Array.isArray(st.effects) ? st.effects : []).map(normalizeStatusEffect).filter(Boolean);
  return st;
}
/* ============================= ASSETS（素材: 画像・音声）============================= */
// 素材の一覧（IDなどの情報）は、ゲームデータ（DATA_SECTIONS の assets）に入る。ファイル本体は、ブラウザの IndexedDB に置く。
// 本体は JSON の保存データには入らず、ZIPパッケージ（assets/）で運ぶ。配布版は、パッケージの assets/<ID>.<拡張子> から読む。
// ゲームデータは、素材を「asset:<ID>」の形でだけ参照する（ファイル名やパスは書かない）。
const ASSET_TYPES = {
  png:{kind:'image', mime:'image/png'}, jpg:{kind:'image', mime:'image/jpeg'}, gif:{kind:'image', mime:'image/gif'}, webp:{kind:'image', mime:'image/webp'},
  ogg:{kind:'audio', mime:'audio/ogg'}, mp3:{kind:'audio', mime:'audio/mpeg'}, wav:{kind:'audio', mime:'audio/wav'}, m4a:{kind:'audio', mime:'audio/mp4'},
};
const ASSET_KIND_LABEL = {image:'画像', audio:'音声'};
const ASSET_MAX_BYTES = {image: 20*1024*1024, audio: 30*1024*1024};
// ファイルの先頭の数バイトで、種類を判定する（拡張子や申告された種類は信用しない。SVGなど、スクリプトを含み得る形式は受け付けない）
function assetSniff(u8){
  const s = (o,t)=> t.split('').every((ch,i)=> u8[o+i]===ch.charCodeAt(0));
  if(u8.length < 12) return '';
  if(u8[0]===0x89 && s(1,'PNG') && u8[4]===0x0D && u8[5]===0x0A && u8[6]===0x1A && u8[7]===0x0A) return 'png';
  if(u8[0]===0xFF && u8[1]===0xD8 && u8[2]===0xFF) return 'jpg';
  if(s(0,'GIF87a') || s(0,'GIF89a')) return 'gif';
  if(s(0,'RIFF') && s(8,'WEBP')) return 'webp';
  if(s(0,'RIFF') && s(8,'WAVE')) return 'wav';
  if(s(0,'OggS')) return 'ogg';
  if(s(0,'ID3') || (u8[0]===0xFF && (u8[1]&0xE0)===0xE0)) return 'mp3';
  if(s(4,'ftyp')) return 'm4a';
  return '';
}
// スプライトシート（コマ送りの画像）の設定。コマの大きさ(fw×fh)・列数・行数・コマ数・1秒あたりのコマ数。GIFは、そのまま動くので対象外
function cleanSheet(s, kind, ext){
  if(kind!=='image' || ext==='gif' || !s || typeof s!=='object') return null;
  const n = (v,lo,hi)=> Math.max(lo, Math.min(hi, parseInt(v,10) || lo));
  const cols = n(s.cols,1,256), rows = n(s.rows,1,256);
  return {fw:n(s.fw,1,4096), fh:n(s.fh,1,4096), cols, rows, frames:Math.min(n(s.frames,1,256), cols*rows), fps:n(s.fps,1,60)};
}
function normalizeAsset(a){
  a = a || {};
  const ext = (typeof a.ext==='string' ? a.ext.toLowerCase() : '');
  const t = ASSET_TYPES[ext] || ASSET_TYPES.png, realExt = ASSET_TYPES[ext] ? ext : 'png';
  const sheet = cleanSheet(a.sheet, t.kind, realExt);
  return {
    ...(sheet ? {sheet} : {}),
    id: a.id,
    kind: t.kind,                         // 種類と形式は、拡張子から決める（申告された値は使わない）
    ext: realExt, mime: t.mime,
    name: ((typeof a.name==='string' ? a.name : '').replace(/[<>"'&\u0000-\u001f]/g,'').trim().slice(0,60)) || '名無し',
    size: Math.max(0, Math.min(1e10, parseInt(a.size,10) || 0)),
    note: (typeof a.note==='string' ? a.note : '').replace(/[<>"'&\u0000-\u001f]/g,'').slice(0,200),
  };
}
function loadAssets(){
  try{ const v = localStorage.getItem('assets'); if(v){ const a = JSON.parse(v); if(Array.isArray(a)) return a.filter(x=>x && validSaveId(x.id) && ASSET_TYPES[x.ext]).map(normalizeAsset); } }catch(e){ console.error(e); }
  return [];
}
function saveAssets(list){ try{ localStorage.setItem('assets', JSON.stringify(list)); }catch(e){ console.error(e); storageFailed(); } }
function assetById(id){ return (S.assets||[]).find(a=>a.id===id) || null; }
function newAssetId(){ return 'a_' + Math.random().toString(36).slice(2,10).padEnd(8,'0'); }

// ---- ファイル本体（IndexedDB）。配布版では使わない ----
let __assetDbP = null;
function assetDB(){
  if(__assetDbP) return __assetDbP;
  __assetDbP = new Promise((res,rej)=>{
    if(typeof indexedDB==='undefined'){ rej(new Error('このブラウザでは、素材を保存できません（IndexedDBが使えません）。')); return; }
    let rq; try{ rq = indexedDB.open('ashbound-assets:' + (location.pathname||'/'), 1); }catch(e){ rej(e); return; }
    rq.onupgradeneeded = ()=>{ rq.result.createObjectStore('blobs'); };
    rq.onsuccess = ()=> res(rq.result);
    rq.onerror = ()=> rej(rq.error || new Error('素材の保存領域を開けませんでした。'));
    rq.onblocked = ()=> rej(new Error('素材の保存領域を開けませんでした。'));
  });
  __assetDbP.catch(()=>{ __assetDbP = null; });
  return __assetDbP;
}
function assetIdb(mode, fn){
  return assetDB().then(db=> new Promise((res,rej)=>{
    const tx = db.transaction('blobs', mode); let rq;
    try{ rq = fn(tx.objectStore('blobs')); }catch(e){ rej(e); return; }
    tx.oncomplete = ()=> res(rq ? rq.result : undefined);
    tx.onerror = ()=> rej(tx.error); tx.onabort = ()=> rej(tx.error || new Error('素材の保存に失敗しました（容量がいっぱいの可能性があります）。'));
  }));
}
const assetPutBytes = (id, u8, mime)=> assetIdb('readwrite', st=> st.put({buf: u8.buffer.slice(u8.byteOffset, u8.byteOffset+u8.byteLength), mime}, id));
const assetGetBytes = (id)=> assetIdb('readonly', st=> st.get(id)).then(r=> r && r.buf ? new Uint8Array(r.buf) : null);
const assetDelBytes = (id)=> assetIdb('readwrite', st=> st.delete(id));

// 画面に出すためのURL。通常版・管理者版: IndexedDBの中身から作ったURL（ブラウザ内のメモリ上）。配布版: パッケージの assets/ フォルダ
const ASSET_URLS = new Map();
function assetUrl(id){
  const a = assetById(id); if(!a) return '';
  return IS_DIST ? `assets/${a.id}.${a.ext}` : (ASSET_URLS.get(id) || '');
}
function assetSetUrl(id, u8, mime){
  const old = ASSET_URLS.get(id); if(old) URL.revokeObjectURL(old);
  ASSET_URLS.set(id, URL.createObjectURL(new Blob([u8], {type:mime})));
}
async function assetsInit(){
  if(IS_DIST) return;
  try{
    await Promise.all((S.assets||[]).map(async a=>{
      try{ const u8 = await assetGetBytes(a.id); if(u8) assetSetUrl(a.id, u8, a.mime); }catch(e){ console.error(e); }
    }));
  }catch(e){ console.error(e); }
}
// 画像の値（data: の画像、または asset:<ID>）を、表示に使えるURLにする。無いとき（素材のファイルが無い等）は ''
function resolveImage(v){
  if(typeof v!=='string' || !v) return '';
  return v.startsWith('asset:') ? assetUrl(v.slice(6)) : v;
}
// データの中で、素材が使われている場所の数（素材の一覧そのものは数えない）
function assetUsage(id){
  const needle = '"asset:' + id + '"';
  let n = 0;
  DATA_SECTIONS.forEach(sec=>{
    if(sec.key==='assets') return;
    let t = ''; try{ t = JSON.stringify(sec.get()); }catch(e){}
    let i = -1; while((i = t.indexOf(needle, i+1)) >= 0) n++;
  });
  return n;
}
function assetFileLabel(a){ return `${a.name}.${a.ext}`; }

/* ===== 素材の管理画面・選択ダイアログ（編集できる版だけ）===== */
const assetScreenState = {msg:''};
const fmtBytes = n=> n>=1048576 ? (n/1048576).toFixed(1)+'MB' : (n>=1024 ? Math.round(n/1024)+'KB' : n+'B');
async function assetAddFile(file){
  const kindGuess = /^audio\//.test(file.type) ? 'audio' : 'image';
  if(file.size > Math.max(ASSET_MAX_BYTES.image, ASSET_MAX_BYTES.audio)) throw new Error(`${file.name}: ファイルが大きすぎます（画像${fmtBytes(ASSET_MAX_BYTES.image)}・音声${fmtBytes(ASSET_MAX_BYTES.audio)}まで）。`);
  const u8 = new Uint8Array(await file.arrayBuffer());
  const ext = assetSniff(u8);
  if(!ext) throw new Error(`${file.name}: 対応していない形式です（画像: PNG・JPEG・GIF・WebP／音声: OGG・MP3・WAV・M4A）。`);
  const t = ASSET_TYPES[ext];
  if(u8.length > ASSET_MAX_BYTES[t.kind]) throw new Error(`${file.name}: ファイルが大きすぎます（${ASSET_KIND_LABEL[t.kind]}は${fmtBytes(ASSET_MAX_BYTES[t.kind])}まで）。`);
  const id = newAssetId();
  await assetPutBytes(id, u8, t.mime);
  assetSetUrl(id, u8, t.mime);
  const a = normalizeAsset({id, ext, name: file.name.replace(/\.[^.]*$/, ''), size: u8.length});
  S.assets = (S.assets||[]).concat([a]); saveAssets(S.assets);
  return a;
}

// 音とエフェクトの、ワンテンポのずらし方（ミリ秒）。ボイス→カードの音→ダメージなどの反応、の順に、少しずつずらす
const AUDIO_TIMING = [
  {key:'fxStagger',      label:'エフェクトの間隔', def:170, hint:'ダメージ・ブロックなどのエフェクトを、続けて出すときの間隔（同じ側に、続けて出る分）。大きくすると、1つずつゆっくり出ます。'},
  {key:'voiceToCard',    label:'ボイス → カード使用の音（敵: 行動の音）', def:200, hint:'カードを使うときの、キャラクターのボイスのあと、カード使用SEまでの間隔。ボイスが出ないときは、ずらしません。'},
  {key:'cardToReaction', label:'カード使用の音 → 効果の反応', def:200, hint:'カード使用SEのあと、ダメージ・ブロックなどのエフェクトと音までの間隔。カード使用SEが無いときは、ずらしません。'},
  {key:'hurtVoiceDelay', label:'ダメージの音 → やられボイス', def:150, hint:'自分のHPが減る音のあと、やられボイスまでの間隔。'},
  {key:'enemyTurnWait',  label:'ターン終了 → 敵の行動', def:550, hint:'ターンを終えてから、敵が動き出すまでの待ち時間。'},
  {key:'afterEnemyWait', label:'敵の行動 → 次の自分のターン', def:0, hint:'敵の行動が終わってから、次のターンに入るまでの待ち時間。反応の音やエフェクトを、最後まで見せたいときに増やします。'},
];
function cleanAudioData(v){
  v = (v && typeof v==='object') ? v : {};
  const out = {bgm:{}, se:{}, timing:{}};
  const tmv = (v.timing && typeof v.timing==='object') ? v.timing : {};
  AUDIO_TIMING.forEach(t=>{ const n = parseInt(tmv[t.key],10); out.timing[t.key] = isFinite(n) ? Math.max(0, Math.min(3000, n)) : t.def; });
  ['bgm','se'].forEach(g=>{
    const src = (v[g] && typeof v[g]==='object') ? v[g] : {};
    AUDIO_SLOT_KEYS[g].forEach(k=>{
      const x = src[k];
      if(x && typeof x==='object' && typeof x.id==='string' && validSaveId(x.id)) out[g][k] = {id:x.id, vol: Math.max(0, Math.min(100, parseInt(x.vol,10)>=0 ? parseInt(x.vol,10) : 100))};
    });
  });
  return out;
}
function loadAudioData(){ try{ const v = localStorage.getItem('audio'); if(v) return cleanAudioData(JSON.parse(v)); }catch(e){ console.error(e); } return cleanAudioData(null); }
function saveAudioData(d){ try{ localStorage.setItem('audio', JSON.stringify(d)); }catch(e){ console.error(e); storageFailed(); } }

const AUD = {voiceStop:null, prefs:{master:80, bgm:70, se:80, voice:90, mute:false}, bgmEl:null, bgmSlot:'', bgmKey:'', fadeT:null, ctx:null, bufs:new Map(), lastSe:{}, active:0, unlocked:false, pendingBgm:false, timers:new Set()};
function audLoadPrefs(){
  try{ const v = JSON.parse(localStorage.getItem('audioPrefs')||'null');
    if(v && typeof v==='object'){ const n = (x,d)=> (isFinite(+x) ? Math.max(0, Math.min(100, Math.round(+x))) : d); AUD.prefs = {master:n(v.master,80), bgm:n(v.bgm,70), se:n(v.se,80), voice:n(v.voice,90), mute:!!v.mute}; } }catch(e){}
}
function audSavePrefs(){ try{ localStorage.setItem('audioPrefs', JSON.stringify(AUD.prefs)); }catch(e){} }
audLoadPrefs();
const audGain = (group, slotVol)=> AUD.prefs.mute ? 0 : (AUD.prefs.master/100) * (AUD.prefs[group]/100) * ((slotVol==null ? 100 : slotVol)/100);
// ブラウザは、ユーザーが操作するまで、音を鳴らさせない。最初の操作で解禁して、待っていたBGMを始める
function audUnlock(){
  if(AUD.unlocked) return; AUD.unlocked = true;
  try{ const AC = window.AudioContext || window.webkitAudioContext; if(AC && !AUD.ctx) AUD.ctx = new AC(); if(AUD.ctx && AUD.ctx.state==='suspended') AUD.ctx.resume(); }catch(e){}
  if(AUD.pendingBgm){ AUD.pendingBgm = false; audSyncBgm(true); }
}
['pointerdown','keydown','touchstart'].forEach(ev=> document.addEventListener(ev, audUnlock, {capture:true, passive:true}));
document.addEventListener('visibilitychange', ()=>{
  if(AUD.bgmEl){ if(document.hidden) AUD.bgmEl.pause(); else if(!AUD.prefs.mute && AUD.unlocked){ AUD.bgmEl.play().catch(()=>{}); } }
  try{ if(AUD.ctx){ if(document.hidden) AUD.ctx.suspend(); else AUD.ctx.resume(); } }catch(e){}
});

// ---- BGM ----
function audFade(el, to, ms, done){
  const from = el.volume, t0 = performance.now();
  const step = ()=>{ const k = Math.min(1, (performance.now()-t0)/Math.max(1,ms)); el.volume = Math.max(0, Math.min(1, from + (to-from)*k)); if(k<1) requestAnimationFrame(step); else if(done) done(); };
  step();
}
function audStopBgm(ms){
  const el = AUD.bgmEl; AUD.bgmEl = null; AUD.bgmKey = ''; AUD.bgmSlot = '';
  if(!el) return;
  if(ms>0) audFade(el, 0, ms, ()=>{ el.pause(); el.src = ''; }); else { el.pause(); el.src = ''; }
}
function audPlayBgm(slotKey, assetId, vol){
  const url = assetUrl(assetId); if(!url){ audStopBgm(300); return; }
  const key = slotKey + '|' + assetId;
  if(AUD.bgmEl && AUD.bgmKey === key){ AUD.bgmEl.volume = audGain('bgm', vol); return; }   // 同じ曲は、続けて流す
  const slot = AUDIO_BGM_SLOTS.find(s=>s.key===slotKey);
  const same = AUD.bgmEl && AUD.bgmSlot !== slotKey && AUD.bgmEl.dataset.asset === assetId;
  if(same){ AUD.bgmKey = key; AUD.bgmSlot = slotKey; AUD.bgmEl.loop = !slot || slot.loop; AUD.bgmEl.volume = audGain('bgm', vol); return; }   // 場面が変わっても、同じ素材なら途切れさせない
  audStopBgm(400);
  const el = new Audio(url); el.dataset.asset = assetId; el.loop = !slot || slot.loop; el.preload = 'auto'; el.volume = 0;
  AUD.bgmEl = el; AUD.bgmKey = key; AUD.bgmSlot = slotKey;
  const p = el.play();
  if(p && p.catch) p.catch(()=>{ if(AUD.bgmEl===el){ AUD.pendingBgm = true; AUD.unlocked = false; AUD.bgmEl = null; AUD.bgmKey = ''; } });   // まだ操作されていない: 操作されたら、やり直す
  audFade(el, audGain('bgm', vol), 500);
}
// 今の画面に合う BGM の場所。null は「変えない」（報酬の画面では、戦闘の曲を続ける）
function audWantedSlot(){
  const sc = S.screen, r = S.run;
  if(sc==='battle'){ const cat = r && r.enemy && r.enemy.category; return cat==='boss' ? 'boss' : cat==='elite' ? 'elite' : 'battle'; }
  if(sc==='map') return 'map';
  if(sc==='event' || sc==='shop' || sc==='rest') return sc;
  if(sc==='victory' || sc==='defeat') return sc;
  if(sc==='reward' || sc==='relicReward' || sc==='dropCards') return null;
  return 'home';
}
const AUD_FALLBACK = {boss:'battle', elite:'battle', event:'map', shop:'map', rest:'map'};
function audSyncBgm(force){
  if(typeof S==='undefined' || !S.audio) return;
  let slot = audWantedSlot(); if(slot===null) return;
  let cfg = S.audio.bgm[slot];
  if((!cfg || !assetById(cfg.id)) && AUD_FALLBACK[slot]){ slot = AUD_FALLBACK[slot]; cfg = S.audio.bgm[slot]; if((!cfg || !assetById(cfg.id)) && AUD_FALLBACK[slot]){ slot = AUD_FALLBACK[slot]; cfg = S.audio.bgm[slot]; } }
  if(!cfg || !assetById(cfg.id)){ if(AUD.bgmEl) audStopBgm(400); return; }
  if(!AUD.unlocked && !force){ AUD.pendingBgm = true; return; }
  if(AUD.prefs.mute && !AUD.bgmEl){ AUD.pendingBgm = true; return; }
  audPlayBgm(slot, cfg.id, cfg.vol);
}
function audApplyPrefs(){
  if(AUD.bgmEl){ const cfg = S.audio && S.audio.bgm[AUD.bgmSlot]; AUD.bgmEl.volume = audGain('bgm', cfg ? cfg.vol : 100); if(AUD.prefs.mute) AUD.bgmEl.pause(); else if(AUD.unlocked) AUD.bgmEl.play().catch(()=>{}); }
  else if(!AUD.prefs.mute) audSyncBgm();
}

// ---- SE ----
async function audBuffer(assetId){
  if(AUD.bufs.has(assetId)) return AUD.bufs.get(assetId);
  const url = assetUrl(assetId); if(!url || !AUD.ctx) return null;
  let buf = null;
  try{ const res = await fetch(url); const ab = await res.arrayBuffer(); buf = await new Promise((ok,ng)=> AUD.ctx.decodeAudioData(ab, ok, ng)); }catch(e){ buf = null; }   // ローカルのファイルでは、読み込めないことがある（その場合は、通常の再生で代用する）
  AUD.bufs.set(assetId, buf);
  return buf;
}
function audPlaySe(assetId, vol, group){
  group = group || 'se';
  const isVoice = group==='voice';
  if(isVoice && AUD.voiceStop){ try{ AUD.voiceStop(); }catch(e){} AUD.voiceStop = null; }   // ボイスは、前のボイスを止めてから鳴らす（重ねない）
  const g = audGain(group, vol); if(g<=0 || !AUD.unlocked) return;
  if(AUD.active >= 12) return;
  const fallback = ()=>{ const url = assetUrl(assetId); if(!url) return; const el = new Audio(url); el.volume = Math.min(1,g); if(isVoice) AUD.voiceStop = ()=>{ el.pause(); }; AUD.active++; const done = ()=>{ AUD.active = Math.max(0, AUD.active-1); }; el.onended = done; el.onerror = done; el.play().catch(done); };
  if(AUD.ctx && AUD.bufs.get(assetId)){
    const src = AUD.ctx.createBufferSource(), gn = AUD.ctx.createGain(); src.buffer = AUD.bufs.get(assetId); gn.gain.value = Math.min(1,g);
    src.connect(gn); gn.connect(AUD.ctx.destination); if(isVoice) AUD.voiceStop = ()=>{ try{ src.stop(); }catch(e){} }; AUD.active++; src.onended = ()=>{ AUD.active = Math.max(0, AUD.active-1); }; src.start();
  } else if(AUD.ctx && !AUD.bufs.has(assetId)){
    audBuffer(assetId).then(b=>{ if(b) audPlaySe(assetId, vol, group); else fallback(); });
  } else fallback();
}
// 出来事の名前（スロット）で、SEを鳴らす。同じ種類は、一瞬のうちに何度も鳴らさない
function voicePlay(assetId, vol){ try{ audPlaySe(assetId, vol, 'voice'); }catch(e){ console.error(e); } }
function sePlay(slot, delay){
  if(delay>0){ setTimeout(()=>sePlay(slot, 0), delay); return; }
  try{
    if(typeof S==='undefined' || !S.audio) return;
    const cfg = S.audio.se[slot]; if(!cfg || !assetById(cfg.id)) return;
    const now = performance.now(); if(AUD.lastSe[slot] && now - AUD.lastSe[slot] < 70) return; AUD.lastSe[slot] = now;
    audPlaySe(cfg.id, cfg.vol);
  }catch(e){ console.error(e); }
}
// 戦闘エフェクトの出来事から、SEを鳴らす（エフェクトを切っていても、鳴らす）
function audOnFx(ev){
  if(!ev) return;
  if(ev.type==='hit'){
    if(ev.hpLoss>0) sePlay(ev.side==='enemy' ? 'hitEnemy' : 'hitPlayer'); else if(ev.blocked>0) sePlay('blockHit');
  } else if(ev.se) sePlay(ev.se);
}

/* ============================= IMAGES ============================= */
// Pictures (enemies, events) are stored inside the data itself as small "data:" URLs, so
// they travel with save files and need no server. Uploads are shrunk first to keep the
// browser's storage (about 5 MB in total) from filling up.
const IMAGE_MAX_CHARS = 700000;
function cleanImage(v){
  if(typeof v==='string' && /^asset:[A-Za-z0-9_-]{1,64}$/.test(v)) return v;   // 素材（asset:<ID>）への参照
  return (typeof v==='string' && v.length<=IMAGE_MAX_CHARS && /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(v)) ? v : '';
}
function imageFileToDataUrl(file, maxSide, done){
  if(!file || !/^image\//.test(file.type)){ done(null,'画像ファイルを選んでください。'); return; }
  const reader = new FileReader();
  reader.onerror = ()=> done(null,'画像を読み込めませんでした。');
  reader.onload = ()=>{
    const img = new Image();
    img.onerror = ()=> done(null,'画像を読み込めませんでした。');
    img.onload = ()=>{
      let side = maxSide, out = '';
      for(let attempt=0; attempt<5; attempt++){
        const scale = Math.min(1, side/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        out = cv.toDataURL('image/webp', 0.85);
        if(out.indexOf('data:image/webp')!==0) out = cv.toDataURL('image/png'); // browsers without WebP export
        if(out.length <= 350000) break;
        side = Math.round(side*0.75);
      }
      const clean = cleanImage(out);
      if(clean) done(clean); else done(null,'画像が大きすぎて縮小できませんでした。別の画像を試してください。');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function imageFieldHTML(prefix, image){
  return `<div class="img-field">
    <div class="img-preview" id="${prefix}-img-preview">${resolveImage(image) ? imgTag(image) : (image ? '<span>ファイルなし</span>' : '<span>なし</span>')}</div>
    <div class="img-ctrl">
      <input type="file" accept="image/*" id="${prefix}-img-file">
      <button type="button" id="${prefix}-img-pick">素材から選ぶ</button>
      <button type="button" id="${prefix}-img-clear" ${image?'':'disabled'}>画像を削除</button>
    </div>
  </div>`;
}
function bindImageField(root, prefix, maxSide, get, set){
  const fileEl = qs(`#${prefix}-img-file`, root), clr = qs(`#${prefix}-img-clear`, root), prev = qs(`#${prefix}-img-preview`, root);
  const refresh = ()=>{
    const v = get();
    prev.innerHTML = resolveImage(v) ? imgTag(v) : (v ? '<span>ファイルなし</span>' : '<span>なし</span>');
    clr.disabled = !v;
  };
  fileEl.onchange = ()=>{

  clr.onclick = ()=>{ set(''); fileEl.value = ''; refresh(); };

/* ============================= 反応（画像の演出・ボイス）・スプライトシート ============================= */
// 反応: 出来事ごとに、条件を満たしたとき、演出用の画像（ポーズ）とボイス（音声）を出す。
//   プレイヤー側は、メインキャラクターのタグ（charTag.reactions）、敵側は、敵の設定（enemy.reactions）。
//   条件は、すべて満たしたときだけ合う。合うものが複数あれば、条件の数が多いものを優先する（同じなら、ランダム）。
//   「カード効果」の条件は、そのカードを使った結果（ダメージ・ブロックなどの計算結果）で判定する。
const REACT_WHENS = {
  player: [
    {key:'cardUse',     label:'カードを使ったとき'},
    {key:'hurt',        label:'HPが減ったとき'},
    {key:'battleStart', label:'戦闘の開始'},
    {key:'turnStart',   label:'自分のターンの開始'},
    {key:'enemyDefeat', label:'敵を倒したとき'},
  ],
  enemy: [
    {key:'action',      label:'敵が行動したとき'},
    {key:'hurt',        label:'HPが減ったとき'},
    {key:'battleStart', label:'戦闘の開始'},
    {key:'defeated',    label:'倒されたとき'},
  ],
};
const REACT_USE_WHENS = ['cardUse','action'];   // カードの効果が結果として出る出来事
const REACT_CONDS = {
  cardId:    {label:'特定のカード（どれか）', when:['cardUse','action']},
  cardType:  {label:'カードの種類', when:['cardUse','action']},
  effect:    {label:'カード効果（対象・計算結果の値）', when:['cardUse','action']},
  hpLoss:    {label:'減ったHP', when:['hurt']},
  hpLossPct: {label:'減ったHP（最大HPに対する%）', when:['hurt']},
};
const REACT_CMPS = [{key:'gte', label:'以上'}, {key:'lt', label:'未満'}, {key:'eq', label:'ちょうど'}];
const POSE_HOLD_MS = 900, POSE_HALF_MS = 140;
const cleanAssetRef = v=> (typeof v==='string' && /^asset:[A-Za-z0-9_-]{1,64}$/.test(v)) ? v : '';
function cleanReactions(list, who){
  who = who==='enemy' ? 'enemy' : 'player';
  const whens = REACT_WHENS[who].map(w=>w.key);
  const num = (v,lo,hi,d)=> { const n = parseInt(v,10); return isFinite(n) ? Math.max(lo, Math.min(hi, n)) : d; };
  return (Array.isArray(list) ? list : []).slice(0,40).map(r=>{
    if(!r || typeof r!=='object' || !whens.includes(r.when)) return null;
    const conds = (Array.isArray(r.conds) ? r.conds : []).slice(0,8).map(c=>{
      if(!c || !REACT_CONDS[c.t] || !REACT_CONDS[c.t].when.includes(r.when)) return null;
      const cmp = REACT_CMPS.some(x=>x.key===c.cmp) ? c.cmp : 'gte';
      if(c.t==='cardType') return ['attack','skill','other'].includes(c.v) ? {t:'cardType', v:c.v} : null;
      if(c.t==='cardId'){ const ids = (Array.isArray(c.ids) ? c.ids : []).filter(x=>typeof x==='string' && validSaveId(x)).slice(0,30); return {t:'cardId', ids}; }   // カードが1つも選ばれていないときは、どの行動にも合わない（全部に合ってしまわないように）
      if(c.t==='effect'){ const hasN = c.hasN!==false && c.hasN!==0; return {t:'effect', kind: typeof c.kind==='string' ? c.kind.slice(0,64) : 'damage', target: ['opponent','self','any'].includes(c.target) ? c.target : 'any', cmp, n: hasN ? num(c.n,0,99999,0) : 0, hasN}; }
      return {t:c.t, cmp, n:num(c.n,0,99999,0)};
    }).filter(Boolean);
    const v = r.voice && typeof r.voice==='object' && typeof r.voice.id==='string' && validSaveId(r.voice.id) ? {id:r.voice.id, vol:num(r.voice.vol,0,100,100)} : null;
    const image = cleanAssetRef(r.image);
    if(!image && !v) return null;
    return {when:r.when, conds, image, voice:v, at: r.at==='effect' ? 'effect' : 'use', delay: num(r.delay,0,3000,0)};
  }).filter(Boolean);
}
// 前の版の「ポーズ」（when: cardAttack など）を、反応に変換する
function legacyPosesToReactions(poses, heavyPct){
  const map = {cardAttack:{when:'cardUse', conds:[{t:'cardType',v:'attack'}]}, cardSkill:{when:'cardUse', conds:[{t:'cardType',v:'skill'}]}, cardOther:{when:'cardUse', conds:[{t:'cardType',v:'other'}]},
    hurt:{when:'hurt', conds:[]}, hurtHeavy:{when:'hurt', conds:[{t:'hpLossPct', cmp:'gte', n:Math.max(1,Math.min(100,parseInt(heavyPct,10)||25))}]}};
  return (Array.isArray(poses) ? poses : []).map(p=> (p && map[p.when]) ? {...map[p.when], image:p.image, voice:null} : null).filter(Boolean);
}
const reactCmp = (cmp, a, n)=> cmp==='lt' ? a<n : cmp==='eq' ? a===n : a>=n;
// カードが持つ効果の、対象（相手／自身）
function reactEffectSide(e){
  if(e.target==='self' || e.target==='opponent') return e.target;
  if(isCustomCapsuleKind(e.kind)) return capSide(e);
  return ['damage','weak','vulnerable','poison','stun','reduceEnemyStrength'].includes(e.kind) ? 'opponent' : 'self';
}
// カード効果の「結果」の値。使った結果（エフェクトの出来事）から集めた、計算後の値。結果の出ない種類（ドロー・エネルギーなど）は、カードに設定された値。見つからなければ null
function reactResultOf(ctx, kind, target){
  const res = ctx.res || {}, keys = target==='any' ? [kind+'|opponent', kind+'|self'] : [kind+'|'+target];
  let found = false, sum = 0;
  keys.forEach(k=>{ if(k in res){ found = true; sum += res[k]; } });
  if(found) return sum;
  const effs = (ctx.card && Array.isArray(ctx.card.effects)) ? ctx.card.effects : [];
  const hit = effs.filter(e=> e.kind===kind && (target==='any' || reactEffectSide(e)===target));
  return hit.length ? hit.reduce((t,e)=>t+(e.amount|0),0) : null;
}
function reactCondOk(c, ctx){
  if(c.t==='cardId') return !!ctx.cardId && c.ids.includes(ctx.cardId);
  if(c.t==='cardType'){ const ty = ctx.card && ctx.card.type; return c.v==='attack' ? ty==='attack' : c.v==='skill' ? ty==='skill' : (ty!=='attack' && ty!=='skill'); }
  if(c.t==='effect'){ const v = reactResultOf(ctx, c.kind, c.target); if(v===null) return false; return c.hasN ? reactCmp(c.cmp, v, c.n) : true; }
  if(c.t==='hpLoss') return reactCmp(c.cmp, ctx.hpLoss||0, c.n);
  if(c.t==='hpLossPct') return reactCmp(c.cmp, ctx.pct||0, c.n);
  return false;
}
function poseMainTag(){ return (S.run && S.run.mainCharTagId) ? charTagById(S.run.mainCharTagId) : null; }
function reactListOf(actor){
  if(actor==='player'){ const t = poseMainTag(); return (t && t.reactions) || []; }
  return (S.run && S.run.enemy && S.run.enemy.reactions) || [];
}
function reactPick(actor, when, ctx){
  const ok = reactListOf(actor).filter(r=> r.when===when && r.conds.every(c=>reactCondOk(c, ctx||{})) && (resolveImage(r.image) || (r.voice && assetById(r.voice.id))));
  if(!ok.length) return null;
  const score = r=> r.conds.length + (r.conds.some(c=>c.t==='cardId') ? 10 : 0);   // 特定のカードの指定は、いちばん優先する
  const best = Math.max(...ok.map(score)), top = ok.filter(r=>score(r)===best);
  return top[Math.floor(Math.random()*top.length)];
}
// タイミングの設定。全体の設定に、敵ごとの設定（空欄でない項目）を重ねる
function rxTiming(enemy){
  const t = {...S.audio.timing}, o = enemy && enemy.timing;
  if(o) AUDIO_TIMING.forEach(k=>{ if(o[k.key]!==undefined && o[k.key]!==null && o[k.key]!=='') t[k.key] = o[k.key]; });
  return t;
}
function cleanTimingOverride(o){
  const out = {}; if(!o || typeof o!=='object') return out;
  AUDIO_TIMING.forEach(k=>{ if(k.key==='fxStagger') return; const n = parseInt(o[k.key],10); if(o[k.key]!=='' && o[k.key]!==null && o[k.key]!==undefined && isFinite(n)) out[k.key] = Math.max(0, Math.min(3000, n)); });
  return out;
}
function imgTag(v, cls, style){
  const u = resolveImage(v); if(!u) return '';
  const a = (typeof v==='string' && v.startsWith('asset:')) ? assetById(v.slice(6)) : null;
  const c = cls ? ` class="${cls}"` : '', st = style ? ` style="${style}"` : '';
  if(a && a.sheet){
    const s = a.sheet;
    return `<span${cls ? ` class="sprite-view ${cls}"` : ' class="sprite-view"'} data-cols="${s.cols}" data-rows="${s.rows}" data-frames="${s.frames}" data-fps="${s.fps}" style="background-image:url('${u}'); background-size:${s.cols*100}% ${s.rows*100}%; aspect-ratio:${s.fw}/${s.fh};${style||''}"></span>`;
  }
  return `<img${c} src="${u}" alt=""${st}>`;
}
setInterval(()=>{
  const els = document.querySelectorAll('.sprite-view'); if(!els.length) return;
  const t = performance.now()/1000;
  els.forEach(e=>{
    const cols = +e.dataset.cols, rows = +e.dataset.rows, n = +e.dataset.frames, fps = +e.dataset.fps;
    const f = Math.floor(t*fps) % Math.max(1,n), cx = f % cols, cy = Math.floor(f/cols);
    e.style.backgroundPosition = `${cols>1 ? cx/(cols-1)*100 : 0}% ${rows>1 ? cy/(rows-1)*100 : 0}%`;
  });
}, 50);

// ---- 画像（ポーズ）の切り替え: 回転して入れ替え、しばらく見せて、通常に戻す。プレイヤー側と敵側で、別々に動く ----
const POSE = {player:{img:'', target:'', busy:false, timer:null}, enemy:{img:'', target:'', busy:false, timer:null}};
function poseSpeed(){ return (typeof FX!=='undefined' && FX.prefs && FX.prefs.speed) || 1; }
function poseInstant(){ return !(FX.prefs.on) || fxReduced(); }
const poseEl = side=> document.querySelector(`.combatant.${side} .portrait`);
function poseRepaint(side){
  const el = poseEl(side); if(!el) return;
  if(side==='player'){ el.innerHTML = playerPortraitInner(); el.classList.toggle('has-img', !!resolveImage(playerIdentity().image)); }
  else if(S.run && S.run.enemy){ el.innerHTML = enemyPortraitInner(S.run.enemy); el.classList.toggle('has-img', !!resolveImage(enemyShownImage(S.run.enemy))); }
}
function poseGo(side, target){
  const P = POSE[side]; P.target = target;
  if(P.busy || P.img===target) return;
  const el = poseEl(side);
  if(!el || poseInstant() || !el.animate){ P.img = target; poseRepaint(side); return; }
  P.busy = true;
  const ms = POSE_HALF_MS/poseSpeed();
  const done = ()=>{ P.busy = false; if(P.img!==P.target) poseGo(side, P.target); };
  const a1 = el.animate([{transform:'perspective(500px) rotateY(0deg)'},{transform:'perspective(500px) rotateY(90deg)'}], {duration:ms, easing:'ease-in'});
  a1.onfinish = ()=>{
    P.img = P.target; poseRepaint(side);
    const e2 = poseEl(side);
    const a2 = e2 ? e2.animate([{transform:'perspective(500px) rotateY(90deg)'},{transform:'perspective(500px) rotateY(0deg)'}], {duration:ms, easing:'ease-out'}) : null;
    if(a2) a2.onfinish = done; else done();
  };
  a1.oncancel = ()=>{ P.busy = false; };
}
function poseReset(){ ['player','enemy'].forEach(s=>{ const P = POSE[s]; clearTimeout(P.timer); P.timer = null; P.img = ''; P.target = ''; P.busy = false; }); }
function poseShow(side, image){
  if(!resolveImage(image)) return;
  const P = POSE[side]; clearTimeout(P.timer); poseGo(side, image);
  P.timer = setTimeout(()=>poseGo(side, ''), POSE_HOLD_MS/poseSpeed());
}
// 反応を出す（画像とボイス）。delay（ms）だけ遅らせる。rx を渡すと、その反応を使う（選び直さない）
function reactFire(actor, when, ctx, delay, rx){
  try{
    if(S.screen!=='battle' && when!=='battleStart') return null;
    rx = rx || reactPick(actor, when, ctx); if(!rx) return null;
    const go = ()=>{ if(rx.image) poseShow(actor, rx.image); if(rx.voice && assetById(rx.voice.id)) voicePlay(rx.voice.id, rx.voice.vol); };
    const d = (delay||0) + (rx.delay|0);
    if(d>0) setTimeout(go, d); else go();
    return rx;
  }catch(e){ console.error(e); return null; }
}
// HPが減ったとき（エフェクトが出る瞬間に呼ぶ）。ダメージの音のあとに、やられボイス
function reactOnHurt(side, hpLoss){
  const r = S.run; if(!r || !(hpLoss>0)) return;
  const ent = side==='player' ? r.player : r.enemy; if(!ent) return;
  const tm = rxTiming(r.enemy), slot = side==='player' ? 'hitPlayer' : 'hitEnemy';
  const hasHitSe = !!(S.audio.se[slot] && assetById(S.audio.se[slot].id));
  reactFire(side, 'hurt', {hpLoss, pct: ent.maxHp>0 ? hpLoss/ent.maxHp*100 : 0}, hasHitSe ? tm.hurtVoiceDelay : 0);
}

// ---- 行動の窓: カードを使う／敵が行動する間に起きたエフェクトの出来事を、いったん集めて、結果（計算後の値）を数える ----
// 窓を閉じるときに、結果を使って反応を選び、「反応 → 行動の音 → エフェクトと反応の音」の順に、ワンテンポずつずらして出す。
const RX = {win:null};
function baseCardId(id){ try{ const {cid} = splitInstanceId(id); return isUpgradedInstanceId(cid) ? cid.slice(0,-1) : cid; }catch(e){ return ''; } }
function rxOpen(actor, card, enemy, cardId){ if(RX.win) return false; RX.win = {actor, card, enemy, cardId: baseCardId(cardId), events:[], res:{}}; return true; }
function rxAccumulate(w, ev){
  const rel = ev.side===w.actor ? 'self' : 'opponent', add = (k,n)=>{ if(n) w.res[k+'|'+rel] = (w.res[k+'|'+rel]||0) + n; };
  if(ev.type==='hit'){ add('damage', (ev.hpLoss||0) + (ev.blocked||0)); add('@hpLoss', ev.hpLoss||0); if(ev.lose) add('loseHp', ev.hpLoss||0); }
  else if(ev.res) add(ev.res.kind, ev.res.n);
}
function rxClose(){
  const w = RX.win; RX.win = null; if(!w) return;
  const ctx = {card:w.card, cardId:w.cardId, res:w.res}, tm = rxTiming(w.enemy), c = w.card || {};
  const rx = reactPick(w.actor, w.actor==='player' ? 'cardUse' : 'action', ctx);
  const seSlot = w.actor==='player' ? (c.type==='attack' ? 'cardAttack' : c.type==='skill' ? 'cardSkill' : 'cardOther') : 'enemyAction';
  const hasSe = !!(S.audio.se[seSlot] && assetById(S.audio.se[seSlot].id));
  const voiceFirst = !!(rx && rx.voice && assetById(rx.voice.id) && rx.at==='use');
  const seAt = voiceFirst ? tm.voiceToCard : 0;                    // 反応のボイス → 行動の音
  const effAt = seAt + (hasSe ? tm.cardToReaction : 0);            // 行動の音 → エフェクトと、その音
  if(rx) reactFire(w.actor, null, ctx, rx.at==='effect' ? effAt : 0, rx);
  sePlay(seSlot, seAt);
  w.events.forEach(ev=>{ ev.extra = effAt; fxEmitNow(ev); });
}

/* ===== 反応の編集（キャラクタータグ・敵で共通）===== */
// box: 描く場所。list: 反応の配列（直接書き換える）。who: 'player' / 'enemy'
function reactionEditor(box, list, who){
  const whens = REACT_WHENS[who];
  const effKinds = ()=> capsuleKinds().map(k=>({key:k.key, label:(k.label||k.key).replace(/（.*$/,'').slice(0,24)})).concat([{key:'@hpLoss', label:'HPを実際に減らした量'}]);
  const optSel = (arr, cur)=> arr.map(([k,l])=>`<option value="${escapeHtml(k)}" ${k===cur?'selected':''}>${escapeHtml(l)}</option>`).join('');
  const condHTML = (c, ci)=>{
    const cmpSel = `<select data-f="cmp">${REACT_CMPS.map(x=>`<option value="${x.key}" ${x.key===c.cmp?'selected':''}>${x.label}</option>`).join('')}</select>`;
    let body = '';
    if(c.t==='cardId') body = `<span class="rx-chips">${(c.ids||[]).map(id=>{ const cc = S.cards.find(x=>x.id===id); return `<span class="rx-chip" data-id="${escapeHtml(id)}">${escapeHtml(cc ? cc.name : '（削除されたカード）')}<button type="button" class="rx-chip-del">×</button></span>`; }).join('')}</span>
      <select data-f="addcard"><option value="">＋ カードを選ぶ…</option>${S.cards.map(x=>`<option value="${escapeHtml(x.id)}">${escapeHtml(x.name)}</option>`).join('')}</select>`;
    else if(c.t==='cardType') body = `<select data-f="v">${optSel([['attack','攻撃'],['skill','スキル'],['other','その他の種類']], c.v)}</select>`;
    else if(c.t==='effect') body = `<select data-f="kind">${optSel(effKinds().map(k=>[k.key,k.label]), c.kind)}</select>
      <select data-f="target">${optSel([['any','対象を問わない'],['opponent','相手に'],['self','自身に']], c.target)}</select>
      <label><input type="checkbox" data-f="hasN" ${c.hasN?'checked':''}> 計算結果の値</label> <input type="number" data-f="n" min="0" max="99999" value="${c.n|0}" ${c.hasN?'':'disabled'}> ${cmpSel}`;
    else body = `<input type="number" data-f="n" min="0" max="99999" value="${c.n|0}">${c.t==='hpLossPct'?'%':''} ${cmpSel}`;
    return `<div class="rx-cond" data-ci="${ci}"><span class="rx-cond-l">${REACT_CONDS[c.t].label}</span>${body}<button type="button" class="rx-cond-del">×</button></div>`;
  };
  const draw = ()=>{
    const aud = (S.assets||[]).filter(a=>a.kind==='audio');
    box.innerHTML = list.length ? list.map((r,i)=>{
      const types = Object.keys(REACT_CONDS).filter(k=>REACT_CONDS[k].when.includes(r.when));
      const use = REACT_USE_WHENS.includes(r.when);
      return `<div class="rx-row" data-i="${i}">
        <div class="rx-top"><select class="rx-when">${optSel(whens.map(w=>[w.key,w.label]), r.when)}</select><button type="button" class="rx-del">この反応を削除</button></div>
        <div class="rx-conds">${(r.conds||[]).map((c,ci)=>condHTML(c,ci)).join('')}</div>
        ${types.length ? `<div><select class="rx-cond-type"><option value="">＋ 条件を追加…</option>${types.map(k=>`<option value="${k}">${REACT_CONDS[k].label}</option>`).join('')}</select></div>` : ''}
        <div class="rx-out"><span>画像</span><span class="pose-prev">${resolveImage(r.image) ? imgTag(r.image) : '<small>なし</small>'}</span><button type="button" class="rx-pick">素材から選ぶ</button><button type="button" class="rx-clear">解除</button></div>
        <div class="rx-out"><span>ボイス</span><select class="rx-voice"><option value="">（なし）</option>${aud.map(a=>`<option value="${a.id}" ${r.voice&&r.voice.id===a.id?'selected':''}>${escapeHtml(a.name)}.${a.ext}</option>`).join('')}${r.voice && !aud.some(a=>a.id===r.voice.id) ? `<option value="${r.voice.id}" selected>（見つからない素材）</option>` : ''}</select>
          <input type="range" class="rx-vol" min="0" max="100" step="5" value="${r.voice?r.voice.vol:100}" title="音量"><button type="button" class="rx-play" ${r.voice?'':'disabled'}>▶</button></div>
        <div class="rx-out"><span>タイミング</span>${use ? `<select class="rx-at">${optSel([['use', who==='player' ? '使った瞬間（ボイスを先に）' : '行動の最初（ボイスを先に）'],['effect','エフェクトに合わせる']], r.at)}</select>` : ''}
          <label>さらに遅らせる<input type="number" class="rx-delay" min="0" max="3000" step="50" value="${r.delay|0}" style="width:76px;">ms</label></div>
      </div>`; }).join('') : '<p class="hint">まだありません。</p>';
    qsa('.rx-row', box).forEach(row=>{
      const i = +row.dataset.i, r = list[i];
      qs('.rx-when', row).onchange = e=>{ r.when = e.target.value; r.conds = (r.conds||[]).filter(c=>REACT_CONDS[c.t].when.includes(r.when)); draw(); };
      qs('.rx-del', row).onclick = ()=>{ list.splice(i,1); draw(); };

      qsa('.rx-cond', row).forEach(cr=>{

        qsa('[data-f]', cr).forEach(f=>{ if(f.dataset.f==='addcard'){ f.onchange = ()=>{ if(f.value && !(c.ids||[]).includes(f.value)){ c.ids = (c.ids||[]).concat([f.value]); } draw(); }; return; } f.onchange = ()=>{ const k = f.dataset.f; c[k] = f.type==='checkbox' ? f.checked : (f.type==='number' ? (parseInt(f.value,10)||0) : f.value); if(k==='hasN') draw(); }; });
      });

      qs('.rx-clear', row).onclick = ()=>{ r.image = ''; draw(); };
      const vs = qs('.rx-voice', row), vv = qs('.rx-vol', row), vp = qs('.rx-play', row);
      const setV = ()=>{ r.voice = vs.value ? {id:vs.value, vol:+vv.value} : null; vp.disabled = !vs.value; };
      vs.onchange = setV; vv.onchange = setV;
      vp.onclick = ()=>{ if(vs.value) voicePlay(vs.value, +vv.value); };
      const at = qs('.rx-at', row); if(at) at.onchange = ()=>{ r.at = at.value; };
      qs('.rx-delay', row).onchange = e=>{ r.delay = Math.max(0, Math.min(3000, parseInt(e.target.value,10)||0)); };
    });
  };
  draw();
  return {draw, add: ()=>{ list.push({when:whens[0].key, conds:[], image:'', voice:null, at:'use', delay:0}); draw(); }};
}

// ドロップ確率（%）。dropCardChances は dropCardIds と同じ並び。未設定（旧データ）は100%。
function alignDropChances(e){
  const src = Array.isArray(e.dropCardChances) ? e.dropCardChances : [];
  e.dropCardChances = (e.dropCardIds||[]).map((_,i)=> clampInt(src[i],0,100,100));
  e.dropRelicChance = clampInt(e.dropRelicChance,0,100,100);
}
function normalizeEnemy(e){
  e = migrateEnemy({...e});
  if(!['normal','elite','boss'].includes(e.category)) e.category = 'normal';
  e.baseHp = Number.isFinite(e.baseHp) ? Math.max(1, Math.floor(e.baseHp)) : 30;
  e.weight = Number.isFinite(e.weight) ? Math.max(1, Math.floor(e.weight)) : 1;
  e.minFloor = clampInt(e.minFloor,1,99,1);     // この階層以降から出る（1で制限なし）
  e.minRound = clampInt(e.minRound,1,99,1);     // このラウンド以降から出る（1で制限なし）
  e.noRepeat = !!e.noRepeat;                    // 1度出たら、同じラウンドでは出ない
  if(!Array.isArray(e.deck)) e.deck = [];
  e.deck = e.deck.filter(x=> x && S.cards.some(c=>c.id===x.cardId))
    .map(x=>({cardId:x.cardId, weight: Number.isFinite(x.weight) ? Math.max(1, Math.floor(x.weight)) : 1}));
  if(!e.startEffect || typeof e.startEffect!=='object') e.startEffect = {};
  e.dropRelicId = typeof e.dropRelicId==='string' ? e.dropRelicId : '';
  e.dropCardIds = Array.isArray(e.dropCardIds) ? e.dropCardIds.filter(x=>typeof x==='string') : [];
  alignDropChances(e);
  e.startCards = e.startCards.filter(id=> typeof id==='string' && S.cards.some(c=>c.id===id));
  e.forcedMoves = cleanForcedMoves(e.forcedMoves);
  e.chains = cleanChains(e.chains);
  e.lines = cleanEnemyLines(e.lines);
  e.elementMods = cleanElementMods(e.elementMods);
  e.image = cleanImage(e.image);
  e.reactions = cleanReactions(e.reactions, 'enemy');
  e.timing = cleanTimingOverride(e.timing);
  return e;
}
// ---- 敵の属性相性（弱点・耐性） ----
// elementMods: [{element:属性ID, pct:被ダメージの増減％}]。+50＝弱点（1.5倍）、-50＝耐性（半分）、-100＝無効。0は持たない。
function cleanElementMods(list){
  return (Array.isArray(list) ? list : []).filter(x=>x && typeof x==='object' && typeof x.element==='string' && x.element)
    .map(x=>({element:x.element.slice(0,64), pct:clampInt(x.pct,-100,500,0)})).filter(x=>x.pct!==0).slice(0,30);
}
// ---- 敵のセリフ ----
// 各セリフは、条件を満たしたとき戦闘中に1回だけ言う。trigger の種類と、HPの割合(pct)を使うもの。
const ENEMY_LINE_TRIGGERS = [
  {key:'start',          label:'戦闘開始時'},
  {key:'playerHpBelow',  label:'プレイヤーのHPが残り○％以下になったとき', pct:true},
  {key:'selfHpBelow',    label:'自身のHPが残り○％以下になったとき', pct:true},
  {key:'selfDefeated',   label:'自身が倒されたとき（HPが0になり、復活しなかったとき）'},
  {key:'selfRevived',    label:'自身が復活したとき'},
  {key:'playerDefeated', label:'プレイヤーが倒されたとき（HPが0になり、復活しなかったとき）'},
  {key:'playerRevived',  label:'プレイヤーが復活したとき'},
];
function cleanEnemyLines(list){
  return (Array.isArray(list) ? list : []).filter(x=> x && typeof x==='object' && typeof x.text==='string' && x.text.trim()
      && ENEMY_LINE_TRIGGERS.some(t=>t.key===x.trigger))
    .map(x=>({id: (typeof x.id==='string' && x.id) ? x.id.slice(0,40) : newId(), trigger:x.trigger,
              pct: clampInt(x.pct,1,100,50), text: x.text.trim().slice(0,200)}));
}
// Only known keys of the right type are taken (numbers stay numbers, switches stay booleans).
function cleanSettings(obj){
  const out = {};
  Object.keys(DEFAULT_SETTINGS).forEach(k=>{
    const dv = DEFAULT_SETTINGS[k], v = obj[k];
    if(typeof dv==='boolean' && typeof v==='boolean') out[k] = v;
    else if(typeof dv==='number' && typeof v==='number' && Number.isFinite(v)) out[k] = Math.max(0, Math.floor(v));
    else if(k==='formationPickMode' && ['each','batch'].includes(v)) out[k] = v;
  });
  return out;
}

function buildSaveData(keys){
  const data = {app:SAVE_APP_ID, version:SAVE_FORMAT_VERSION, exportedAt:new Date().toISOString()};
  DATA_SECTIONS.forEach(sec=>{
    if(!keys || keys.includes(sec.key)) data[sec.key] = JSON.parse(JSON.stringify(sec.get()));
  });
  return data;
}

// Text -> validated data. Throws an Error with a readable message if anything is wrong.
function parseSaveText(text){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error('JSONとして読み取れませんでした。ファイルが壊れているか、別の形式のデータです。'); }
  if(!data || typeof data!=='object' || data.app!==SAVE_APP_ID){
    throw new Error('このゲームの保存データではありません。');
  }
  let v = parseInt(data.version,10);
  if(isNaN(v) || v<1) throw new Error('バージョン情報が不正です。');
  if(v>SAVE_FORMAT_VERSION) throw new Error(`より新しい形式（v${v}）のファイルです。ゲーム側を更新してください。`);
  while(v<SAVE_FORMAT_VERSION){
    const fn = SAVE_MIGRATIONS[v];
    if(!fn) throw new Error(`v${v}の変換処理がありません。`);
    data = fn(data);
    v = parseInt(data.version,10);
  }
  const result = {sections:{}, dups:{}, skipped:0, exportedAt: typeof data.exportedAt==='string' ? data.exportedAt : ''};
  // 正規化では、他のデータへの参照（敵のデッキのカード、属性、状態など）が「いま存在するか」を確かめて、無いものを取り除く。
  // 同じファイルで一緒に読み込むカード・状態・属性・レリックは、まだ保存前なので、正規化のあいだだけ、いまのデータに加えて見せる
  // （そうしないと、新しいカードを参照する敵の行動などが、1回目の読み込みで消えてしまう）。
  const incomingRaw = {};
  DATA_SECTIONS.forEach(sec=>{
    if(sec.kind!=='list' || !(sec.key in data) || !Array.isArray(data[sec.key])) return;
    incomingRaw[sec.key] = data[sec.key].map(deepClean).filter(x=>sec.check(x));
  });
  const stateKeyOf = {cards:'cards', relics:'relics', customStatuses:'customStatuses', elements:'elements', enemies:'enemies', events:'events', charTags:'charTags', assets:'assets'};
  const saved = {};
  Object.keys(incomingRaw).forEach(k=>{
    const sk = stateKeyOf[k]; saved[sk] = S[sk];
    const ids = new Set(incomingRaw[k].map(x=>x.id));
    S[sk] = incomingRaw[k].concat((S[sk]||[]).filter(x=>!ids.has(x.id)));
  });
  try{
    DATA_SECTIONS.forEach(sec=>{
      if(!(sec.key in data)) return;
      const raw = data[sec.key];
      if(sec.kind==='list'){
        if(!Array.isArray(raw)) return;
        const seen = new Set(), items = [];
        raw.forEach(x=>{
          x = deepClean(x);
          if(sec.check(x) && !seen.has(x.id)){ seen.add(x.id); items.push(sec.normalize(x)); }
          else result.skipped++;
        });
        const cur = new Set((saved[stateKeyOf[sec.key]] || sec.get()).map(x=>x.id));
        result.dups[sec.key] = items.filter(x=>cur.has(x.id)).length;
        result.sections[sec.key] = items;
      } else if(raw && typeof raw==='object' && !Array.isArray(raw)){
        result.sections[sec.key] = sec.key==='world' ? cleanWorld(deepClean(raw)) : sec.key==='audio' ? cleanAudioData(deepClean(raw)) : sec.key==='builtinStatuses' ? cleanBuiltinStatuses(deepClean(raw)) : sec.key==='formation' ? cleanFormationData(deepClean(raw)) : cleanSettings(deepClean(raw));
      }
    });
  } finally {
    Object.keys(saved).forEach(sk=>{ S[sk] = saved[sk]; });
  }
  if(Object.keys(result.sections).length===0) throw new Error('読み込めるデータが含まれていません。');
  return result;
}

// mode: 'replace' (swap everything) | 'overwrite' (add; same id is overwritten) | 'skip' (add; same id is kept)
function applySaveData(parsed, mode, keys, makeBackup){
  if(makeBackup){
    // Safety net: keep the state from before the import (ignore failures such as a full storage).
    try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(buildSaveData())); }catch(e){ console.error(e); }
  }
  const results = [];
  DATA_SECTIONS.forEach(sec=>{
    const incoming = parsed.sections[sec.key];
    if(incoming===undefined || !keys.includes(sec.key)) return;
    if(sec.kind==='list'){
      if(incoming.length===0){ results.push(`${sec.label}: 有効なデータが0件のため変更しませんでした。`); return; }
      if(mode==='replace'){
        sec.set(incoming);
        results.push(`${sec.label}: ${incoming.length}件で置き換えました。`);
      } else {
        const cur = sec.get().slice();
        const idx = new Map(cur.map((x,i)=>[x.id,i]));
        let added = 0, replaced = 0, skipped = 0;
        incoming.forEach(x=>{
          if(idx.has(x.id)){
            if(mode==='overwrite'){ cur[idx.get(x.id)] = x; replaced++; } else skipped++;
          } else { cur.push(x); idx.set(x.id, cur.length-1); added++; }
        });
        sec.set(cur);
        results.push(`${sec.label}: 追加${added}件・上書き${replaced}件・そのまま${skipped}件。`);
      }
    } else {
      if(mode==='replace') sec.set(sec.key==='settings' ? Object.assign({}, DEFAULT_SETTINGS, incoming) : incoming);
      else if(mode==='overwrite') sec.set(Object.assign({}, sec.get(), incoming));
      else { results.push(`${sec.label}: 「そのまま残す」を選んだため変更しませんでした。`); return; }
      results.push(`${sec.label}: 読み込みました。`);
    }
  });
  return results;
}

function downloadTextFile(filename, text){
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
