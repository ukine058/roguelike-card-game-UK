const PKG_READER_VERSION = 2;          // このリーダーが読める packageVersion の上限
const PKG_ENGINE_LABEL = 'phase15a';
const PKG_LIMITS = { fileBytes: 512*1024*1024, entries: 5000, totalBytes: 1024*1024*1024, manifestBytes: 1024*1024, dataBytes: 128*1024*1024, ratio: 1000 };

const PKG_CRC_TABLE = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function pkgCrc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = PKG_CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
function pkgConcat(chunks, n){ const out = new Uint8Array(n); let o=0; chunks.forEach(c=>{ out.set(c,o); o+=c.length; }); return out; }
// ストリームを最後まで読む。上限を超えたら、その場で中止する（ZIP爆弾の対策）
async function pkgReadAll(stream, maxBytes){
  const rd = stream.getReader(), chunks = []; let n = 0;
  for(;;){
    const r = await rd.read(); if(r.done) break;
    n += r.value.length;
    if(n > maxBytes){ try{ await rd.cancel(); }catch(e){} throw new Error('展開後のサイズが上限を超えています。'); }
    chunks.push(r.value);
  }
  return pkgConcat(chunks, n);
}
const pkgInflate = (u8, fmt, maxBytes)=> pkgReadAll(new Blob([u8]).stream().pipeThrough(new DecompressionStream(fmt)), maxBytes);
const pkgDeflate = async (u8)=> pkgReadAll(new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw')), u8.length + 1024*1024);
const pkgB64ToBytes = (b64)=>{ const bin = atob(b64), u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; };
const pkgText = (u8)=> new TextDecoder('utf-8', {fatal:true}).decode(u8);

// ZIPを作る。entries: [{name, data:Uint8Array}]。text系は圧縮(deflate)、小さいものや圧縮が効かないものは無圧縮(store)
async function pkgZipWrite(entries){
  const enc = new TextEncoder(), parts = [], central = [];
  const now = new Date();
  const dosTime = (now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1);
  const dosDate = ((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate();
  let offset = 0;
  const canDeflate = typeof CompressionStream !== 'undefined';
  for(const e of entries){
    const name = enc.encode(e.name), crc = pkgCrc32(e.data);
    let method = 0, body = e.data;
    if(canDeflate && !e.store && e.data.length > 256){ try{ const d = await pkgDeflate(e.data); if(d.length < e.data.length){ method = 8; body = d; } }catch(err){ console.error(err); } }
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,method,true);
    lh.setUint16(10,dosTime,true); lh.setUint16(12,dosDate,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,body.length,true); lh.setUint32(22,e.data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, body);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,method,true);
    ch.setUint16(12,dosTime,true); ch.setUint16(14,dosDate,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,body.length,true); ch.setUint32(24,e.data.length,true); ch.setUint16(28,name.length,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + body.length;
  }
  const cdSize = central.reduce((t,c)=>t+c.length,0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,entries.length,true); eo.setUint16(10,entries.length,true);
  eo.setUint32(12,cdSize,true); eo.setUint32(16,offset,true);
  return new Blob([...parts, ...central, new Uint8Array(eo.buffer)], {type:'application/zip'});
}

// ZIPを読む（取り出す前に、構造をすべて確かめる）。返り値: {names, get(name, maxBytes)}
function pkgZipOpen(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  if(u8.length > PKG_LIMITS.fileBytes) throw new Error('ファイルが大きすぎます。');
  if(u8.length < 22) throw new Error('ZIPファイルではありません。');
  let eocd = -1;
  for(let i = u8.length-22; i >= Math.max(0, u8.length-22-65535); i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd = i; break; } }
  if(eocd<0) throw new Error('ZIPファイルではありません（終端が見つかりません）。');
  const count = dv.getUint16(eocd+10,true), cdSize = dv.getUint32(eocd+12,true), cdOff = dv.getUint32(eocd+16,true);
  if(count===0xFFFF || cdSize===0xFFFFFFFF || cdOff===0xFFFFFFFF) throw new Error('ZIP64形式には対応していません。');
  if(count > PKG_LIMITS.entries) throw new Error('ファイル数が多すぎます。');
  if(cdOff + cdSize > eocd) throw new Error('ZIPの目次が壊れています。');
  const entries = new Map(); let p = cdOff, total = 0;
  for(let i=0;i<count;i++){
    if(p+46 > eocd || dv.getUint32(p,true)!==0x02014b50) throw new Error('ZIPの目次が壊れています。');
    const flags = dv.getUint16(p+8,true), method = dv.getUint16(p+10,true), crc = dv.getUint32(p+16,true);
    const csize = dv.getUint32(p+20,true), usize = dv.getUint32(p+24,true);
    const nlen = dv.getUint16(p+28,true), elen = dv.getUint16(p+30,true), clen = dv.getUint16(p+32,true), lho = dv.getUint32(p+42,true);
    if(p+46+nlen > eocd) throw new Error('ZIPの目次が壊れています。');
    let name; try{ name = pkgText(u8.subarray(p+46, p+46+nlen)); }catch(e){ throw new Error('ファイル名を読み取れませんでした。'); }
    p += 46 + nlen + elen + clen;
    if(csize===0xFFFFFFFF || usize===0xFFFFFFFF) throw new Error('ZIP64形式には対応していません。');
    if(name.endsWith('/')) continue;                                                     // フォルダ
    if(name.includes('\\') || name.includes('\0') || name.startsWith('/') || /^[A-Za-z]:/.test(name) || name.split('/').some(s=>s==='..' || s==='')) throw new Error(`不正なファイル名が含まれています: ${name.replace(/[^\x20-\x7E\u3000-\u9FFF]/g,'?')}`);
    if(entries.has(name)) throw new Error(`同じ名前のファイルが重複しています: ${name}`);
    if(flags & 1) throw new Error('暗号化されたZIPには対応していません。');
    if(method!==0 && method!==8) throw new Error('対応していない圧縮方式です。');
    if(method===0 && csize!==usize) throw new Error('ZIPの目次が壊れています。');
    if(method===8 && usize > 1024*1024 && usize/Math.max(1,csize) > PKG_LIMITS.ratio) throw new Error('圧縮率が異常に高いファイルが含まれています。');
    total += usize; if(total > PKG_LIMITS.totalBytes) throw new Error('展開後の合計サイズが上限を超えています。');
    entries.set(name, {method, crc, csize, usize, lho});
  }
  return {
    names: [...entries.keys()],
    has: n=>entries.has(n),
    async get(name, maxBytes){
      const e = entries.get(name); if(!e) throw new Error(`${name} が入っていません。`);
      if(e.usize > maxBytes) throw new Error(`${name} が大きすぎます。`);
      const o = e.lho;
      if(o+30 > u8.length || dv.getUint32(o,true)!==0x04034b50) throw new Error('ZIPのファイル情報が壊れています。');
      const start = o + 30 + dv.getUint16(o+26,true) + dv.getUint16(o+28,true);
      if(start + e.csize > u8.length) throw new Error('ZIPのデータが途中で切れています。');
      const raw = u8.subarray(start, start + e.csize);
      let out; try{ out = e.method===0 ? raw : await pkgInflate(raw, 'deflate-raw', e.usize); }catch(err){ throw new Error(`${name} を展開できませんでした（壊れています）。`); }
      if(out.length !== e.usize) throw new Error(`${name} のサイズが一致しません。`);
      if(pkgCrc32(out) !== e.crc) throw new Error(`${name} が壊れています（CRCが一致しません）。`);
      return out;
    },
  };
}

async function pkgSha256(u8){
  try{ if(!(window.crypto && crypto.subtle)) return ''; const h = new Uint8Array(await crypto.subtle.digest('SHA-256', u8)); return 'sha256-' + Array.from(h).map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return ''; }
}
function pkgJsonForHtml(obj){ return JSON.stringify(obj).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029'); }

// 配布用のゲーム（HTML）を作る: 埋め込んだエンジンに、データ（圧縮）とタイトルを入れる
async function pkgBuildDistHtml(data){
  const engine = pkgText(await pkgInflate(pkgB64ToBytes(PKG_ENGINE_B64), 'gzip', 64*1024*1024));
  const SC = 'scr'+'ipt', slot = '<'+SC+' id="ashbound-data" type="application/json">{}</'+SC+'>';   // scriptの閉じタグをそのまま書くと、HTMLが途中で終わってしまう
  if(engine.split(slot).length !== 2) throw new Error('配布用のゲーム本体の形式が想定と違います。');
  let html = engine;
  const title = data.world && typeof data.world.title==='string' ? data.world.title.trim() : '';
  if(title){ const esc = title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); html = html.replace(/<title>[\s\S]*?<\/title>/, ()=>'<title>'+esc+'</title>'); }
  const bg = data.world && /^#[0-9a-fA-F]{6}$/.test(data.world.bg||'') ? data.world.bg : '#14110F';
  html = html.replace(/<meta name="theme-color" content="[^"]*">/, ()=>'<meta name="theme-color" content="'+bg+'">');
  // データは、deflate（raw）+ base64 で埋め込む（読みやすい文字のまま置かない。暗号ではなく、見えにくくするだけ）
  const z = await pkgDeflate(new TextEncoder().encode(JSON.stringify(data)));
  let bin = ''; for(let i=0;i<z.length;i+=0x8000) bin += String.fromCharCode.apply(null, z.subarray(i, i+0x8000));
  return html.replace(slot, ()=>'<'+SC+' id="ashbound-data" type="application/json" data-enc="z">'+btoa(bin)+'</'+SC+'>');
}

// アプリのアイコン（PNG）を作る。素材に、名前に「icon」か「アイコン」を含む画像があれば、それを使う。なければ、タイトルの1文字から作る
async function pkgMakeIcons(data){
  const w = data.world || {}, bg = /^#[0-9a-fA-F]{6}$/.test(w.bg||'') ? w.bg : '#14110F', accent = /^#[0-9a-fA-F]{6}$/.test(w.accent||'') ? w.accent : '#D4A73E';
  const glyph = Array.from((w.title||'灰').trim() || '灰')[0];
  let bmp = null;
  const src = (S.assets||[]).find(a=> a.kind==='image' && /icon|アイコン/i.test(a.name||''));
  if(src){ try{ const u8 = await assetGetBytes(src.id); if(u8) bmp = await createImageBitmap(new Blob([u8], {type:src.mime})); }catch(e){ console.error(e); } }
  const make = async (size, maskable)=>{
    const cv = document.createElement('canvas'); cv.width = cv.height = size; const g = cv.getContext('2d');
    g.fillStyle = bg; g.fillRect(0,0,size,size);
    const inner = maskable ? size*0.62 : size*0.8, o = (size-inner)/2;   // maskable は、周りが切り取られるので、中心の80%以内に収める
    if(bmp){ const r = Math.min(inner/bmp.width, inner/bmp.height); g.drawImage(bmp, (size-bmp.width*r)/2, (size-bmp.height*r)/2, bmp.width*r, bmp.height*r); }
    else{
      if(!maskable){ g.strokeStyle = accent; g.lineWidth = size*0.02; g.strokeRect(size*0.06, size*0.06, size*0.88, size*0.88); }
      g.fillStyle = accent; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `700 ${Math.round(inner*0.8)}px "Shippori Mincho","Noto Serif JP",serif`;
      g.fillText(glyph, size/2, size/2 + inner*0.04);
    }
    const blob = await new Promise(r=> cv.toBlob(r, 'image/png'));
    if(!blob) throw new Error('アイコンを作れませんでした。');
    return new Uint8Array(await blob.arrayBuffer());
  };
  return [
    {name:'icons/icon-192.png', data: await make(192,false), type:'image/png', sizes:'192x192', purpose:'any'},
    {name:'icons/icon-512.png', data: await make(512,false), type:'image/png', sizes:'512x512', purpose:'any'},
    {name:'icons/icon-maskable-512.png', data: await make(512,true), type:'image/png', sizes:'512x512', purpose:'maskable'},
  ];
}
function pkgWebManifest(data, icons){
  const w = data.world || {}, title = (w.title||'').trim() || '灰燼の書庫', bg = /^#[0-9a-fA-F]{6}$/.test(w.bg||'') ? w.bg : '#14110F';
  return JSON.stringify({
    id: './', name: title, short_name: Array.from(title).slice(0,12).join(''), start_url: './', scope: './', display: 'standalone', lang: 'ja',
    background_color: bg, theme_color: bg,
    icons: icons.map(i=>({src:i.name, sizes:i.sizes, type:i.type, purpose:i.purpose})),
  }, null, 1);
}
// 端末にゲームを保存して、通信なしでも遊べるようにする（Service Worker）。buildId が変わると、新しい版として入れ替わる
function pkgServiceWorker(buildId, files){
  return `// 自動生成（書き出しのたびに作り直されます）。編集しないでください。
const BUILD = ${JSON.stringify(buildId)};
const PREFIX = 'ashbound:' + new URL(self.registration.scope).pathname + ':';   // 同じサイトに別のゲームがあっても、保存領域が混ざらないように、場所ごとに分ける
const CACHE = PREFIX + BUILD;
const FILES = ${JSON.stringify(files)};
self.addEventListener('install', e=>{
  e.waitUntil((async()=>{
    const c = await caches.open(CACHE);
    // 本体は必ず入れる。素材は、1つ失敗しても、ほかは入れる
    await c.addAll(FILES.core.map(u=>new Request(u,{cache:'reload'})));
    for(const u of FILES.assets){ try{ await c.add(new Request(u,{cache:'reload'})); }catch(_){} }
    await self.skipWaiting();
  })());
});
self.addEventListener('activate', e=>{
  e.waitUntil((async()=>{
    for(const k of await caches.keys()) if(k.startsWith(PREFIX) && k!==CACHE) await caches.delete(k);
    await self.clients.claim();
  })());
});
async function ranged(req, res){   // 音声など、Rangeつきの要求（Safariなど）に、保存した全体から答える
  const m = /bytes=(\\d*)-(\\d*)/.exec(req.headers.get('range')||''); if(!m) return res;
  const buf = await res.arrayBuffer(), n = buf.byteLength;
  let a = m[1]==='' ? Math.max(0, n-Number(m[2])) : Number(m[1]), b = (m[1]==='' || m[2]==='') ? n-1 : Math.min(n-1, Number(m[2]));
  if(!(a<=b) || a>=n) return new Response(null, {status:416, headers:{'Content-Range':'bytes */'+n}});
  return new Response(buf.slice(a,b+1), {status:206, headers:{'Content-Type':res.headers.get('Content-Type')||'application/octet-stream','Content-Range':'bytes '+a+'-'+b+'/'+n,'Content-Length':String(b-a+1)}});
}
self.addEventListener('fetch', e=>{
  const req = e.request, url = new URL(req.url);
  if(req.method!=='GET' || url.origin!==location.origin) return;
  e.respondWith((async()=>{
    const c = await caches.open(CACHE);
    let hit = await c.match(req, {ignoreSearch:true});
    if(!hit && req.mode==='navigate') hit = await c.match('index.html');
    if(hit) return req.headers.has('range') ? ranged(req, hit) : hit;
    try{ return await fetch(req); }catch(err){ return new Response('オフラインです。', {status:503, headers:{'Content-Type':'text/plain; charset=utf-8'}}); }
  })());
});
`;
}

async function pkgExport(){
  const data = buildSaveData();
  const enc = new TextEncoder();
  const dataBytes = enc.encode(JSON.stringify(data, null, 1));
  const html = await pkgBuildDistHtml(data);
  const htmlBytes = enc.encode(html);
  // 素材のファイル本体（IndexedDB）を、site/assets/<ID>.<拡張子> として入れる。画像・音声は、もともと圧縮されているので、無圧縮で入れる
  const assetEntries = [], missing = [];
  for(const a of (S.assets||[])){
    let u8 = null; try{ u8 = await assetGetBytes(a.id); }catch(e){ console.error(e); }
    if(u8) assetEntries.push({name:`site/assets/${a.id}.${a.ext}`, data:u8, store:true}); else missing.push(a.name);
  }
  const icons = await pkgMakeIcons(data);
  const webManifest = enc.encode(pkgWebManifest(data, icons));
  const buildId = await pkgSha256(pkgConcat([dataBytes, htmlBytes], dataBytes.length + htmlBytes.length)) || ('t' + Date.now().toString(36));
  const sw = enc.encode(pkgServiceWorker(buildId, {
    core: ['./', 'index.html', 'manifest.webmanifest', ...icons.map(i=>i.name)],
    assets: assetEntries.map(e=>e.name.slice('site/'.length)),
  }));
  const readme = enc.encode(PKG_README);
  const manifest = {
    format: 'ashbound-package', packageVersion: 2, minReader: 1,
    engine: {version: PKG_ENGINE_LABEL, builtAt: new Date().toISOString()},
    game: {title: (data.world && data.world.title) || ''},
    site: {root: 'site/'},
    data: {path: 'project/data.json', encoding: 'json', saveFormat: SAVE_FORMAT_VERSION},
    buildId,
  };
  const blob = await pkgZipWrite([
    {name:'manifest.json', data: enc.encode(JSON.stringify(manifest, null, 1))},
    {name:'README.txt', data: readme},
    {name:'site/index.html', data: htmlBytes},
    {name:'site/sw.js', data: sw},
    {name:'site/manifest.webmanifest', data: webManifest},
    ...icons.map(i=>({name:'site/'+i.name, data:i.data, store:true})),
    {name:'project/data.json', data: dataBytes},
    ...assetEntries,
  ]);
  const d = new Date(), pad = n=>String(n).padStart(2,'0');
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = `ashbound-package-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.zip`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
  return {size: blob.size, title: manifest.game.title, assets: assetEntries.length, missing, buildId};
}
const PKG_README = `【ZIPの中身】
  site/      … 公開するもの（Webサイトに置くのは、このフォルダの中身だけ）
  project/   … 制作用のデータ（data.json）。公開しないでください。管理者版で、ZIPごと読み込むと、続きから編集できます
  manifest.json … ZIPの情報（編集しないでください）

【公開のしかた】
  1. site フォルダの中身（index.html, sw.js, manifest.webmanifest, icons, assets）を、そのままWebサイトに置く
     （GitHub Pages、Netlify、Cloudflare Pages など。必ず https:// で公開すると、アプリとして追加・通信なしで遊ぶ機能も使えます）
  2. project フォルダ・manifest.json・README.txt は、置かない

【更新のしかた】
  管理者版で編集して、「パッケージを書き出す」→ 新しいZIPの site フォルダの中身で、公開中のファイルを丸ごと置き換える。
  （assets の古いファイルは、消しても残してもかまいません。sw.js は、必ず新しいものに置き換えてください）
`;

// ZIPからゲームデータを取り出して、これまでの「読み込み」と同じ確認画面に渡す（正規化・移行も同じ処理を通る）
async function pkgImport(file){
  if(file.size > PKG_LIMITS.fileBytes) throw new Error('ファイルが大きすぎます。');
  const zip = pkgZipOpen(await file.arrayBuffer());
  let mf; try{ mf = JSON.parse(pkgText(await zip.get('manifest.json', PKG_LIMITS.manifestBytes))); }catch(e){ throw new Error('manifest.json を読み取れませんでした。'+(e.message ? '（'+e.message+'）' : '')); }
  if(!mf || mf.format!=='ashbound-package') throw new Error('このゲームのパッケージではありません。');
  if(!(mf.minReader<=PKG_READER_VERSION) || !(mf.packageVersion>=1)) throw new Error('より新しい形式のパッケージです。管理者版を更新してください。');
  if(!mf.data || mf.data.encoding!=='json' || typeof mf.data.path!=='string') throw new Error('対応していないデータ形式です。');
  const text = pkgText(await zip.get(mf.data.path, PKG_LIMITS.dataBytes));
  const parsed = parseSaveText(text);
  // 素材のファイルを取り出して、中身を確かめる（確認画面で「読み込む」を押すまでは、保存しない）
  parsed.assetBlobs = new Map(); parsed.assetProblems = [];
  let total = 0;
  for(const a of (parsed.sections.assets || [])){
    const root = (mf.site && typeof mf.site.root==='string' && /^[A-Za-z0-9_\-]+\/$/.test(mf.site.root)) ? mf.site.root : '';   // 旧形式（packageVersion 1）は、ZIPの直下に assets/ がある
    const path = `${root}assets/${a.id}.${a.ext}`;
    if(!zip.has(path)){ parsed.assetProblems.push(`${a.name}: ファイルがパッケージに入っていません。`); continue; }
    try{
      const u8 = await zip.get(path, ASSET_MAX_BYTES[a.kind]);
      total += u8.length; if(total > PKG_LIMITS.totalBytes) throw new Error('素材の合計サイズが上限を超えています。');
      if(assetSniff(u8) !== a.ext) throw new Error('ファイルの中身が、素材の種類と一致しません。');
      parsed.assetBlobs.set(a.id, u8);
    }catch(e){ parsed.assetProblems.push(`${a.name}: ${e.message}`); }
  }
  return parsed;
}
// 取り込む素材のファイルを、IndexedDBに保存する（今ある素材は、「同じIDはそのまま」のときは上書きしない）
async function pkgStoreAssets(parsed, mode, keys, existedBefore){
  if(!parsed.assetBlobs || !keys.includes('assets')) return '';
  let n = 0, fail = 0;
  for(const a of (parsed.sections.assets || [])){
    const u8 = parsed.assetBlobs.get(a.id); if(!u8) continue;
    if(mode==='skip' && existedBefore.has(a.id)) continue;
    try{ await assetPutBytes(a.id, u8, a.mime); assetSetUrl(a.id, u8, a.mime); n++; }catch(e){ console.error(e); fail++; }
  }
  return `素材のファイル: ${n}件を保存しました。` + (fail ? `${fail}件は保存できませんでした（容量不足の可能性）。` : '') + (parsed.assetProblems.length ? '\n' + parsed.assetProblems.join('\n') : '');
}

  };
  if(qs('#btn-import-apply')){
    qs('#btn-import-apply').onclick = ()=>{
      const keys = selectedKeys('im');
      if(keys.length===0){ st.msg = '読み込む項目を選んでください。'; renderDataScreen(); return; }
      const mode = qs('#im-mode').value;
      const doImport = async ()=>{
        const pend = st.pending, existedBefore = new Set((S.assets||[]).map(a=>a.id));
        st.msg = applySaveData(pend, mode, keys, true).join('\n');
        st.pending = null;
        if(ASHBOUND_EDITION==='admin' && pend.assetBlobs){ try{ const m = await pkgStoreAssets(pend, mode, keys, existedBefore); if(m) st.msg += '\n' + m; }catch(e){ console.error(e); st.msg += '\n素材のファイルを保存できませんでした: ' + e.message; } }
        renderDataScreen();
      };
      if(mode==='replace'){
        const names = keys.map(k=>DATA_SECTIONS.find(x=>x.key===k)).map(sec=> sec.kind==='list' ? `${sec.label}${sec.get().length}件` : sec.label).join('・');
        uiConfirm(`今の${names}を、読み込むデータで置き換えます。よろしいですか？\n（読み込み前の状態は「元に戻す」で復元できます）`, doImport);
        return;
      }
      doImport();
    };
  }
  if(qs('#btn-restore')){
    qs('#btn-restore').onclick = ()=>{
      uiConfirm('直前の読み込みの前の状態に戻します。今のデータは上書きされます。よろしいですか？', ()=>{
        try{
          const parsed = parseSaveText(localStorage.getItem(BACKUP_KEY)||'');
          applySaveData(parsed, 'replace', DATA_SECTIONS.map(s=>s.key), false);
          localStorage.removeItem(BACKUP_KEY);
          st.msg = '読み込み前の状態に戻しました。';
        }catch(e){ st.msg = '元に戻せませんでした: ' + e.message; }
        renderDataScreen();
      });
    };
  }
}

    };

function clampInt(v,min,max,def){
  v = parseInt(v,10); if(isNaN(v)) return def; return Math.max(min,Math.min(max,v));

function clampFloat(v,min,max,def){

}

// 参照元の一覧。カスタム状態ごとに「自分の○○スタック数」「敵の○○スタック数」を追加する
function allScaleSources(){
  const extra = [];
  (S.customStatuses||[]).forEach(st=>{
    const nm = `${st.emoji?st.emoji+' ':''}${st.name}`;
    extra.push({key:'csSelf:'+st.id, label:`自分の「${nm}」スタック数`});
    extra.push({key:'csEnemy:'+st.id, label:`敵の「${nm}」スタック数`});
  });
  return SCALE_SOURCES.concat(extra);
}
// actor='enemy' のとき、「自分」は行動する敵、「敵」はプレイヤーとして数える。
// 敵には手札・山札・ゴールドがないため、それらを参照する項目は0になる。
function scaleSourceValue(key, tag, actor, mode){
  const r = S.run; if(!r) return 0;
  const isE = actor==='enemy';
  const me = isE ? r.enemy : r.player;
  const foe = isE ? r.player : r.enemy;
  const n = (o,k)=> (o && Number(o[k])) || 0;
  if(typeof key==='string' && key.startsWith('csSelf:')) return customStatusStacks(me, key.slice(7));
  if(typeof key==='string' && key.startsWith('csEnemy:')) return foe ? customStatusStacks(foe, key.slice(8)) : 0;
  const ownPile = !isE;
  const tl = tagListOf(tag);           // 指定タグ（複数可）
  // 失っているHPの割合（％）。小数のまま返し、最終的な増減量の切り捨てだけで丸める
  const missPct = o=>{ const mx = n(o,'maxHp'); return mx>0 ? Math.max(0, Math.min(100, (mx - n(o,'hp'))/mx*100)) : 0; };
  switch(key){
    case 'playerStrength': return n(me,'strength') + n(me,'permStrength');
    case 'playerMetallicize': return n(me,'metallicize') + n(me,'permMetallicize');
    case 'playerBlock': return n(me,'block');
    case 'playerGold': return ownPile ? n(me,'gold') : 0;
    case 'playerMissingHp': return Math.max(0, n(me,'maxHp') - n(me,'hp'));
    case 'playerMissingHpPct': return missPct(me);
    case 'enemyMissingHpPct': return missPct(foe);
    case 'playerHandSize': return ownPile ? r.hand.length : 0;
    case 'playerDrawSize': return ownPile ? r.draw.length : 0;
    case 'playerDiscardSize': return ownPile ? r.discard.length : 0;
    case 'playerDrawDiscardSize': return ownPile ? r.draw.length + r.discard.length : 0;
    case 'enemyWeak': return n(foe,'weak');
    case 'enemyVulnerable': return n(foe,'vulnerable');
    case 'enemyPoison': return n(foe,'poison');
    case 'enemyBlock': return n(foe,'block');
    case 'enemyStrength': return n(foe,'strength');
    case 'cardsPlayedThisTurn': return ownPile ? (r.cardsPlayedThisTurn || 0) : 0;
    case 'combatPlayed': return ownPile ? ((r.combatStats||{}).played || 0) : 0;
    case 'combatTagPlayed': return ownPile && tl.length ? (((r.combatStats||{}).tagSetsPlayed)||[]).filter(set=>tagsMatch(set, tl, mode)).length : 0;
    case 'combatDrawn': return ownPile ? ((r.combatStats||{}).drawn || 0) : 0;
    case 'combatDiscarded': return ownPile ? ((r.combatStats||{}).discarded || 0) : 0;
    case 'combatExhausted': return ownPile ? (r.exhausted||[]).length : 0;
    case 'combatHitsTaken': return ownPile ? ((r.combatStats||{}).hitsTaken || 0) : 0;
    case 'combatTurn': return ownPile ? (r.turnNo || 0) : 0;
    case 'xValue': return ownPile ? (r.xValue || 0) : 0;
    case 'lastOpTargets': return ownPile ? ((r._opX||{}).last || 0) : 0;
    case 'totalOpTargets': return ownPile ? ((r._opX||{}).total || 0) : 0;
    case 'tagCountHand': return ownPile && tl.length ? r.hand.filter(cid=>{ const c=cardById(cid); return c && cardMatchesTags(c, tl, mode); }).length : 0;
    case 'tagCountPlayedThisTurn': return ownPile && tl.length ? (r.tagSetsPlayedThisTurn||[]).filter(set=>tagsMatch(set, tl, mode)).length : 0;
    case 'tagKindsHand': return ownPile ? distinctTagKinds(r.hand.map(cid=>effectiveCardTags(cardById(cid))), tl) : 0;
    case 'tagKindsPlayedThisTurn': return ownPile ? distinctTagKinds([r.tagsPlayedThisTurn||[]], tl) : 0;
    case 'tagKindsDrawDiscard': return ownPile ? distinctTagKinds([...r.draw, ...r.discard].map(cid=>effectiveCardTags(cardById(cid))), tl) : 0;
    case 'selfTagStacks': return tl.length ? tagStacks(me, tl, mode) : 0;
    case 'enemyTagStacks': return tl.length ? tagStacks(foe, tl, mode) : 0;
    case 'lastHitTotal': return ownPile ? ((r._lastDealt||{}).total || 0) : 0;
    case 'lastHitHpLoss': return ownPile ? ((r._lastDealt||{}).hpLoss || 0) : 0;
    case 'lastHitBlocked': return ownPile ? ((r._lastDealt||{}).blocked || 0) : 0;
    case 'lastHitBlockLost': return ownPile ? ((r._lastDealt||{}).blockLost || 0) : 0;
    case 'cardDealtTotal': return ownPile ? ((r._cardDealt||{}).total || 0) : 0;
    case 'cardDealtHpLoss': return ownPile ? ((r._cardDealt||{}).hpLoss || 0) : 0;
    case 'lastTakenTotal': return ownPile ? ((r._lastTaken||{}).total || 0) : 0;
    case 'lastTakenHpLoss': return ownPile ? ((r._lastTaken||{}).hpLoss || 0) : 0;
    case 'lastTakenBlocked': return ownPile ? ((r._lastTaken||{}).blocked || 0) : 0;
    case 'tagCountDrawDiscard': return ownPile && tl.length ? [...r.draw, ...r.discard].filter(cid=>{ const c=cardById(cid); return c && cardMatchesTags(c, tl, mode); }).length : 0;
    default: return 0;
  }
}
function scaleBonus(c, field, actor){
  const s = c.scales && c.scales[field];
  if(!s || !s.source || s.source==='none') return 0;
  return Math.floor((s.perPoint||0) * scaleSourceValue(s.source, s.tag, actor, s.tagMode));
}
// 敵が使うカードの効果値（参照増減を含む）
function enemyVal(c, key){ return Math.max(0, (c[key]||0) + scaleBonus(c, key, 'enemy')); }
// ===== 敵の効果の順番（敵専用カードも通常のカードと同じ形。順番・同じ種類の連続の合計は、通常のカードと同じ規則）=====
// 項目: 従来の固定欄のキー／'statusOp'／'fx:<ID>'（効果カプセル）／'sep:<ID>'（しきり）。カード操作（'op:'）は、敵では別に予約されるので含めない。
function orderedEnemySteps(c){
  const defaults = defaultEffectOrder(c, ENEMY_EFFECT_ORDER);
  const fxIds = (Array.isArray(c && c.effects) ? c.effects : []).filter(e=>e && e.id).map(e=>'fx:'+e.id);
  const out = [];
  (Array.isArray(c && c.effectOrder) ? c.effectOrder : []).forEach(id0=>{
    if(typeof id0!=='string') return;
    const id = ENEMY_PERM_ALIAS[id0] || id0;
    if(id.startsWith('op:') || out.includes(id)) return;
    if(id.startsWith('fx:')){ if(fxIds.includes(id)) out.push(id); }
    else if(id.startsWith('sep:')) out.push(id);
    else if(defaults.includes(id)) out.push(id);
  });
  defaults.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  fxIds.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  return out;
}
// 順番どおりの項目（まだ値は解決していない）。同じ種類のカプセルが連続しているものは、1つの項目にまとめる
function enemyStepItems(c){
  const seq = orderedEnemySteps(c);
  const capById = id=> (Array.isArray(c.effects) ? c.effects : []).find(e=>e && 'fx:'+e.id===id);
  const items = [];
  for(let i=0; i<seq.length; ){
    const id = seq[i]; i++;
    if(id.startsWith('fx:')){
      const cap = capById(id); if(!cap) continue;
      const run = [cap], sk = k=> ENEMY_PERM_ALIAS[k] || k;   // 敵では、戦闘中の項目と永続の項目は同じ処理なので、連続していれば1つにまとめる
      while(i<seq.length && seq[i].startsWith('fx:')){ const nx = capById(seq[i]); if(!nx || sk(nx.kind)!==sk(cap.kind)) break; run.push(nx); i++; }
      items.push({type:'cap', kind:sk(cap.kind), caps:run});
    } else if(!id.startsWith('sep:')) items.push({type:'legacy', id});
  }
  return items;
}
// 項目を、いまの状態で解決する（実行・行動予告・攻撃予測で共通）。効果がない（0以下・条件を満たさない）なら null
function enemyItemEntry(r, c, it){
  if(it.type==='legacy'){
    const id = it.id;
    if(id==='statusOp') return c.statusOp ? {step:'statusOp'} : null;
    if(customStatusFieldDefs().some(d=>d.key===id)) return {step:id, custom:true, legacy:true};
    const V = k=> enemyVal(c, k);
    const pair = {strength:'permStrength', dexterity:'permDexterity', metallicize:'permMetallicize', thorns:'permThorns'};
    const n = pair[id] ? V(id) + V(pair[id]) : V(id);
    const printed = pair[id] ? (c[id]||0) + (c[pair[id]]||0) : (c[id]||0);
    return n>0 ? {step:id, kind:id, n, printed} : null;
  }
  const act = it.caps.filter(x=>capsuleActive(r, x, 'enemy'));
  if(!act.length) return null;
  if(isCustomCapsuleKind(it.kind)){
    const def = customStatusFieldDefs().find(d=>d.key===it.kind); if(!def) return null;
    const st = (S.customStatuses||[]).find(x=>x.id===def._statusId); if(!st) return null;
    const groups = ['self','opponent'].map(sd=>({side:sd, n: act.filter(x=>capSide(x)===sd).reduce((t,x)=>t+capsuleAmount(x,'enemy'), 0)})).filter(g=>g.n!==0);
    return groups.length ? {step:it.kind, custom:true, act, groups, st} : null;
  }
  if(!ENEMY_CAPSULE_KEYS.includes(it.kind)) return null;
  const n = act.reduce((t,x)=>t+capsuleAmount(x,'enemy'), 0);
  return n>0 ? {step:ENEMY_PERM_ALIAS[it.kind]||it.kind, kind:it.kind, n, act, printed: act.reduce((t,x)=>t+(x.amount|0), 0)} : null;
}
function enemyPlan(e, c){
  const r = S.run; if(!r) return [];
  return enemyStepItems(c).map(it=>({it, en:enemyItemEntry(r, c, it)})).filter(x=>x.en).map(x=>({...x.en, it:x.it}));
}

function cleanBuiltinStatuses(obj){
  const out = {};
  if(!obj || typeof obj!=='object') return out;
  BUILTIN_STATUS_DEFS.forEach(d=>{
    const x = obj[d.id]; if(!x || typeof x!=='object') return;
    const o = {};
    const nm = (typeof x.name==='string' ? x.name.trim() : '').slice(0,12); if(nm && nm!==d.name) o.name = nm;
    const em = typeof x.emoji==='string' ? Array.from(x.emoji.trim()).slice(0,3).join('') : ''; if(em && em!==d.emoji) o.emoji = em;
    if(Array.isArray(x.tags)){ const t = tagListOf(x.tags); if(t.join(',')!==d.name) o.tags = t; }   // 既定（もとの名前のタグ1個）と同じなら保存しない。空配列は「タグなし」
    const pd = BS_PARAM_DEFS[d.id];
    if(pd && x.params && typeof x.params==='object'){
      const pr = {};
      Object.keys(pd).forEach(k=>{ const n = Number(x.params[k]); if(x.params[k]!=='' && isFinite(n)){ const v = Math.max(pd[k].min, Math.min(pd[k].max, Math.round(n*100)/100)); if(v!==pd[k].def) pr[k] = v; } });
      if(Object.keys(pr).length) o.params = pr;

  });

}

// 状態は「タグを持つひとまとまり」として扱う。組み込みの状態もカスタム状態も、自分のタグ一覧を持つ（組み込みの既定は、もとの名前のタグ1個）。
// tag（複数可）に mode（any／all）で一致する状態だけを対象にする。1つの状態は1回だけ数える。
function tagStacks(entity, tag, mode){
  const w = tagListOf(tag);

  BUILTIN_STATUS_DEFS.forEach(d=>{ if(tagsMatch(bsTags(d.id), w, mode)) sum += d.value(entity); });
  (S.customStatuses||[]).forEach(st=>{ if(tagsMatch(st.tags||[], w, mode)) sum += customStatusStacks(entity, st.id); });
  return sum;
}

function requirementValueOf(entity, stat, mode){

  if(stat==='hp:pct') return Math.floor((Number(entity.maxHp)||0)>0 ? (Number(entity.hp)||0)/entity.maxHp*100 : 0);

const PILE_REQ_KEYS = [{key:'hand', label:'手札の枚数（使用前・使うカード自身を含む）'}, {key:'draw', label:'山札の枚数'}, {key:'discard', label:'捨て札の枚数'}, {key:'deck', label:'デッキ全体の枚数'}, {key:'exhausted', label:'消滅済みの山の枚数'}];

function pileCountOf(r, stat){
  if(!r) return 0;
  const tmp = r.temporaryCardIids || {};
  const real = raw=>{ const {iid} = splitInstanceId(raw); if(iid && tmp[iid]) return false; const c = cardById(splitInstanceId(raw).cid); return !(c && c.rarity==='enemy'); };

  if(stat==='discard') return L('discard').length;
  if(stat==='exhausted') return L('exhausted').length;
  if(stat==='deck') return [...L('draw'),...L('hand'),...L('discard'),...L('exhausted')].filter(real).length;

// ===== 効果カプセル（card.effects）=====
// 1つの効果を表す独立した要素: {id, kind:'damage'|'block', amount, conditions:[使用条件と同じ形式]}。
// 同じ種類を何個でも追加できる。条件を満たしたカプセルだけを、種類ごとに合計して1回の処理に加える（ダメージ2個＝合計を1回のダメージ）。
// 旧来の固定欄（damage/block）はそのまま残り、カプセルの合計が加算される（旧データの変換は行わない＝二重実行しない）。

const CAPSULE_KIND_KEYS = ['damage','block','heal','weak','vulnerable','poison','strength','permStrength','dexterity','permDexterity','metallicize','permMetallicize','thorns','permThorns','regen','stun','reduceEnemyStrength','selfWeak','selfVulnerable','selfPoison','loseHp','draw','energy'];
function capsuleKinds(){
  const base = CAPSULE_KIND_KEYS.map(k=>{ const d = EFFECT_FIELD_DEFS.find(x=>x.key===k); return d ? {key:k, label:d.label, desc:d.desc} : null; }).filter(Boolean);
  const cs = customStatusFieldDefs().map(d=>({key:d.key, label:d.label, desc:d.desc, custom:true, statusId:d._statusId}));

const isCustomCapsuleKind = k=> typeof k==='string' && k.startsWith('cs_');
const SCALE_TAG_USERS = ['tagCountHand','tagCountPlayedThisTurn','combatTagPlayed','tagCountDrawDiscard','selfTagStacks','enemyTagStacks'];
function scaleUsesTag(src){ return SCALE_TAG_USERS.includes(src) || TAG_KINDS_SOURCES.includes(src); }
function pileSnapshot(r){ return {hand:pileCountOf(r,'hand'), draw:pileCountOf(r,'draw'), discard:pileCountOf(r,'discard'), deck:pileCountOf(r,'deck'), exhausted:pileCountOf(r,'exhausted')}; }
function newCapsuleId(){ return 'fx_' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); }
// 効果カプセルの発動タイミング（保存先）。imm＝カード使用時（trig別セットの対象）。dw/ex/ho＝ドロー時・消滅時・所持効果（個別の発動チャンネルで、即時／トリガーの別セットとは独立）
const CAPSULE_CHANNELS = [{key:'imm', label:'カード使用時', prop:'effects'}, {key:'dw', label:'ドロー時', prop:'dw_effects'}, {key:'ex', label:'消滅時', prop:'ex_effects'}, {key:'ho', label:'所持効果（ターン開始時）', prop:'ho_effects'}];
function upgradeCapsuleList(list){
  return (Array.isArray(list) ? list : []).map(e=>{
    const o = {...e, amount: (capsuleAllowsNegative(e.kind) ? Math.max(-99,Math.min(99,(e.amount|0)+(e.upAmount|0))) : Math.max(0,(e.amount|0)+(e.upAmount|0)))};
    if(e.scale) o.scale = {...e.scale, perPoint: (e.scale.perPoint||0) + (e.upScalePP||0)};
    return o;
  });
}
// ===== 補正をカプセルとして足す =====
// カード操作による効果付与（インスタンスの補正）と、状態によるカード補正は、補正を表すカプセルを1つ足す形で反映する。
// 位置: 同じ種類のカプセルが（効果の順番で）先頭にあれば、そのすぐ後ろ。なければ、効果の順番の先頭。値は負でもよい（同じ処理にまとまった合計が0未満なら、効果は0）。
function isCapsuleField(k){ return CAPSULE_KIND_KEYS.includes(k) || isCustomCapsuleKind(k); }
function capSide(e){   // カスタム状態のカプセルの、実際の付与先
  if(e.target==='self' || e.target==='opponent') return e.target;
  const st = (S.customStatuses||[]).find(x=>'cs_'+x.id===e.kind);
  return st && st.target==='opponent' ? 'opponent' : 'self';
}
function capsuleAddDelta(obj, kind, amount, side){
  if(!amount) return;
  const eff = (Array.isArray(obj.effects) ? obj.effects : []).slice();
  const id = 'buff_' + Math.random().toString(36).slice(2,9);
  const cap = {id, kind, amount, upAmount:0, conditions:[], buff:true};
  if(isCustomCapsuleKind(kind)) cap.target = side || '';
  eff.push(cap); obj.effects = eff;
  const me = 'fx:' + id;
  const ids = orderedPlayerSteps(obj).filter(x=>x!==me);
  const same = x=>{
    if(!x.startsWith('fx:')) return false;
    const e = eff.find(y=>'fx:'+y.id===x);
    return !!e && e.kind===kind && (!isCustomCapsuleKind(kind) || capSide(e)===capSide(cap));
  };
  const at = ids.findIndex(same);
  ids.splice(at>=0 ? at+1 : 0, 0, me);
  obj.effectOrder = ids;
}
// その種類（カスタム状態は付与先も）の、参照増減を含まない基本値の合計（％の補正の元になる値）
function capsuleRawTotal(obj, kind, side){
  const legacy = isCustomCapsuleKind(kind) ? 0 : (Number(obj[kind])||0);
  return legacy + (Array.isArray(obj.effects) ? obj.effects : []).filter(e=>e.kind===kind && (!side || capSide(e)===side)).reduce((t,e)=>t+(e.amount|0), 0);
}
// 「その値に上書き」: その種類のカプセル（と固定欄）を取り除き、指定の値を1つだけ持たせる
function capsuleSetTotal(obj, kind, value, side){
  const keep = (Array.isArray(obj.effects) ? obj.effects : []).filter(e=>!(e.kind===kind && (!side || capSide(e)===side)));
  const gone = new Set((Array.isArray(obj.effects) ? obj.effects : []).filter(e=>!keep.includes(e)).map(e=>'fx:'+e.id));
  obj.effects = keep;
  if(Array.isArray(obj.effectOrder)) obj.effectOrder = obj.effectOrder.filter(x=>!gone.has(x));
  if(!isCustomCapsuleKind(kind)) obj[kind] = 0;
  capsuleAddDelta(obj, kind, value, side);
}
// ===== 旧データ（固定欄の効果）→ 効果カプセルへの変換 =====
// 旧形式のカード（ダメージ・ブロックなどの固定欄、参照増減 scales、強化時の変化 upgrades、ドロー時／消滅時／所持効果の dw_・ex_・ho_ 欄）を、
// 効果カプセルに変換する。変換済みのカードには fx2 を付け、二度と変換しない。効果の順番（旧 effectOrder）は、カプセルの並びに引き継ぐ。
// 変換の対象: カードの本体、トリガー側が別の効果ならそのセット、ドロー時・消滅時・所持効果。（hits・貫通・吸収などの固定の設定は、そのまま残す）
function convertLegacySet(set, isEnemy){
  const upg = set.upgrades || {}, scales = set.scales || {}, ppAll = upg.scalePP || {};
  const legacySteps = (isEnemy ? orderedEnemySteps : orderedPlayerSteps)(set);   // 変換前の実行順（旧 effectOrder と既定の順番を反映）
  const caps = [];
  const mk = (kind, amount, o)=>{ const e = {id:newCapsuleId(), kind, amount, upAmount:0, conditions:[], ...o}; caps.push(e); return e; };
  const keyCaps = key=>{
    const out = [];
    const def = customStatusFieldDefs().find(d=>d.key===key);
    const sc = scales[key], ppd = Number(ppAll[key])||0, ud = (Number(upg[key])||0)|0;
    if(def){
      const st = (S.customStatuses||[]).find(x=>x.id===def._statusId); if(!st) return out;
      const side = csGrantSide(set, st), base = Number(set[key])||0, extra = side==='both' ? ((set['csX_'+st.id])|0) : 0, udx = ((Number(upg['csX_'+st.id])||0)|0);
      if(base!==0 || sc || ud!==0 || ppd!==0){ const e = mk(key, base, {target: side==='opponent' ? 'opponent' : 'self', upAmount:ud}); if(sc){ e.scale = {...sc}; e.upScalePP = ppd; } out.push(e); }
      if(side==='both' && (extra!==0 || udx!==0)) out.push(mk(key, extra, {target:'opponent', upAmount:udx}));
      return out;
    }
    if(!CAPSULE_KIND_KEYS.includes(key)) return out;
    const base = Number(set[key])||0;
    if(base!==0 || sc || ud!==0 || ppd!==0){ const e = mk(key, base, {upAmount:ud}); if(sc){ e.scale = {...sc}; e.upScalePP = ppd; } out.push(e); }
    return out;
  };
  const order = [];
  legacySteps.forEach(id=>{
    if(id==='statusOp' || id.startsWith('op:') || id.startsWith('sep:')){ order.push(id); return; }
    // 敵では、強化・器用・自動ブロック・棘の項目が、戦闘中のものと永続のものを1つの項目として扱っていた
    const keys = (isEnemy && ENEMY_PERM_ALIAS['perm'+id.charAt(0).toUpperCase()+id.slice(1)]===id) ? [id, 'perm'+id.charAt(0).toUpperCase()+id.slice(1)] : [id];
    keys.forEach(k=> keyCaps(k).forEach(e=> order.push('fx:'+e.id)));
  });
  // 変換した旧欄を取り除く
  CAPSULE_KIND_KEYS.concat(customStatusFieldDefs().map(d=>d.key)).forEach(k=>{
    delete set[k]; delete scales[k]; delete upg[k]; if(upg.scalePP) delete upg.scalePP[k];
    if(k.startsWith('cs_')){ const id = k.slice(3); delete set['csT_'+id]; delete set['csX_'+id]; delete upg['csX_'+id]; }
  });
  if(caps.length){ set.effects = normalizeCapsules(caps); set.effectOrder = order; }
  return caps.length;
}
function convertLegacyChannels(c){
  const order = PLAYER_EFFECT_ORDER.concat(customStatusFieldDefs().map(d=>d.key));
  CAPSULE_CHANNELS.filter(ch=>ch.key!=='imm').forEach(ch=>{
    const pre = ch.key + '_', list = [];
    order.forEach(base=>{
      const key = pre + base, v = Number(c[key])||0;
      if(base.startsWith('cs_')){
        const id = base.slice(3), st = (S.customStatuses||[]).find(x=>x.id===id);
        if(st){
          const side = csGrantSide({['csT_'+id]: c[pre+'csT_'+id]}, st), extra = side==='both' ? ((c[pre+'csX_'+id])|0) : 0;
          if(v!==0) list.push({id:newCapsuleId(), kind:base, amount:v, target: side==='opponent' ? 'opponent' : 'self', upAmount:0, conditions:[]});
          if(extra!==0) list.push({id:newCapsuleId(), kind:base, amount:extra, target:'opponent', upAmount:0, conditions:[]});
        }
        delete c[pre+'csT_'+id]; delete c[pre+'csX_'+id];
      } else if(v!==0 && CAPSULE_KIND_KEYS.includes(base)) list.push({id:newCapsuleId(), kind:base, amount:v, upAmount:0, conditions:[]});
      delete c[key];
    });
    if(list.length) c[ch.prop] = normalizeCapsules(list);
  });
}
// 旧形式なら変換した新しいカードを返す（変換済み・すでにカプセルを持つカードは、印だけ付ける）。状態（カスタム状態）の読み込みのあとに呼ぶこと。
function convertLegacyCard(c0){
  if(!c0 || c0.fx2) return c0;
  const cl = o=> o && typeof o==='object' ? {...o, scales:{...(o.scales||{})}, upgrades:{...(o.upgrades||{}), scalePP:{...((o.upgrades||{}).scalePP||{})}}} : o;
  const c = cl(c0);
  if(c0.trig && typeof c0.trig==='object') c.trig = cl(c0.trig);
  const hasCap = CAPSULE_CHANNELS.some(ch=> Array.isArray(c[ch.prop]) && c[ch.prop].length);
  if(!hasCap){
    const enemy = c.rarity==='enemy';
    convertLegacySet(c, enemy);
    if(c.triggerSeparate && c.trig) convertLegacySet(c.trig, enemy);
    convertLegacyChannels(c);
  }
  c.fx2 = 1;
  return c;
}
// 起動時: 読み込んだカードを変換し、保存データがあれば変換結果を保存する（変換前のデータは、別の保存領域に1回だけ控えを残す）
function convertLegacyAll(){
  let changed = false;
  S.cards = (S.cards||[]).map(c=>{ if(c && !c.fx2){ changed = true; return convertLegacyCard(migrateCard({...c})); } return c; });
  if(!changed) return;
  try{
    const raw = localStorage.getItem('cards');
    if(raw){
      if(!localStorage.getItem('cards_backup_before_capsule')) localStorage.setItem('cards_backup_before_capsule', raw);
      saveCards(S.cards);
    }
  }catch(e){ console.error(e); }
}
function normalizeConditions(list){
  return (Array.isArray(list) ? list : []).filter(q=>q && q.stat).map(q=>({
    subject: q.subject==='enemy' ? 'enemy' : q.subject==='pile' ? 'pile' : 'self', stat: q.stat,
    tagMode: cleanTagMode(q.tagMode), op: ['ge','le','eq'].includes(q.op) ? q.op : 'ge', value: clampInt(q.value,0,999,0)}));
}
// カード操作の実行条件テキスト（先頭に付ける「〜の場合、」）
function opCondPrefix(op){
  const conds = (Array.isArray(op && op.conditions) ? op.conditions : []).map(requirementText).filter(Boolean);
  return conds.length ? `${conds.join('かつ')}の場合、` : '';
}
// 量がマイナスでもよいカプセルの種類（カスタム状態の付与、エネルギー）。今後、マイナスを許す種類を増やすときは、ここに足す。
function capsuleAllowsNegative(kind){ return isCustomCapsuleKind(kind) || kind==='energy'; }
function normalizeCapsules(list){
  const seen = new Set();
  return (Array.isArray(list) ? list : []).filter(e=>e && (CAPSULE_KIND_KEYS.includes(e.kind) || isCustomCapsuleKind(e.kind))).map(e=>{
    let id = (typeof e.id==='string' && e.id) ? e.id : newCapsuleId();
    while(seen.has(id)) id = newCapsuleId();
    seen.add(id);
    const conditions = normalizeConditions(e.conditions);
    const custom = isCustomCapsuleKind(e.kind);
    const out = {id, kind:e.kind, amount:clampInt(e.amount, capsuleAllowsNegative(e.kind)?-99:0, 99, 0), upAmount:clampInt(e.upAmount,-99,99,0), conditions};
    if(custom) out.target = (e.target==='self'||e.target==='opponent') ? e.target : '';   // ''＝状態の既定の付与先
    if(e.fixed) out.fixed = true;   // 効果ごとの「効果値固定」（強化・器用・状態などで、この効果の値が増えない）
    const sc = e.scale;
    if(sc && typeof sc.source==='string' && sc.source && sc.source!=='none'){
      const pp = Number(sc.perPoint); 
      out.scale = {source:sc.source, perPoint: Number.isFinite(pp) ? Math.max(-99, Math.min(99, Math.round(pp*100)/100)) : 0, tag: cleanTagList(sc.tag||''), tagMode: cleanTagMode(sc.tagMode)};
      const up = Number(e.upScalePP); out.upScalePP = Number.isFinite(up) ? Math.max(-99, Math.min(99, Math.round(up*100)/100)) : 0;
    }
    return out;
  });
}
// 条件1つの判定。置き場の枚数は効果発動開始時のスナップショット（r._pileSnap）、状態は今この瞬間の値。削除された状態を指す条件は無視（成立扱い）。
// actor='enemy'（敵が使うカード）のとき、「自分」は行動する敵、「敵」はプレイヤー。敵には手札・山札などがないので、置き場の枚数は常に0として判定する。
function conditionPasses(r, q, actor){
  const isE = actor==='enemy';
  if(q.subject==='pile'){
    if(!pileReqLabel(q.stat)) return true;
    const cur = isE ? 0 : ((r._pileSnap && r._pileSnap[q.stat]!==undefined) ? r._pileSnap[q.stat] : pileCountOf(r, q.stat)), need = q.value|0;
    return q.op==='le' ? cur<=need : q.op==='eq' ? cur===need : cur>=need;
  }
  if(!requirementStatLabel(q.stat, q.tagMode)) return true;
  const me = isE ? r.enemy : r.player, foe = isE ? r.player : r.enemy;
  const cur = requirementValueOf(q.subject==='enemy' ? foe : me, q.stat, q.tagMode), need = q.value|0;
  return q.op==='le' ? cur<=need : q.op==='eq' ? cur===need : cur>=need;
}
function capsuleActive(r, e, actor){ return (e.conditions||[]).every(q=>conditionPasses(r, q, actor)); }
// 敵が使うカードで効果を持てるカプセルの種類（敵の行動に実装されている効果）
const ENEMY_CAPSULE_KEYS = ['damage','block','heal','strength','permStrength','dexterity','permDexterity','metallicize','permMetallicize','thorns','permThorns','weak','vulnerable','poison'];
// 1つのカプセルの値（参照増減を含む）。付与する状態以外の効果は0未満にならない。
function capsuleAmount(e, actor){
  let v = e.amount|0;
  if(e.scale && e.scale.source && e.scale.source!=='none') v += scaleBonus({scales:{x:e.scale}}, 'x', actor);
  return (isCustomCapsuleKind(e.kind) || e.buff || e.kind==='energy') ? v : Math.max(0, v);   // 補正のカプセル（buff）とエネルギー（旧仕様どおり、参照増減でマイナスになれる）は負の値を持てる
}
function capsuleSum(r, c, kind, actor){
  return (Array.isArray(c && c.effects) ? c.effects : []).reduce((t,e)=> t + (e.kind===kind && capsuleActive(r,e,actor) ? capsuleAmount(e,actor) : 0), 0);
}
function capsuleText(e){
  const k = capsuleKinds().find(x=>x.key===e.kind); if(!k) return '';
  const conds = (e.conditions||[]).map(requirementText).filter(Boolean);
  let base = `${k.desc(e.amount, k.custom ? {['csT_'+k.statusId]: e.target||''} : undefined)}`;
  if(e.scale && e.scale.source && e.scale.source!=='none' && e.scale.perPoint){
    const src = allScaleSources().find(x=>x.key===e.scale.source);
    base += `（${src ? src.label : e.scale.source}${scaleUsesTag(e.scale.source) ? scaleSourceTagText(e.scale.source, e.scale.tag, e.scale.tagMode) : ''}×${e.scale.perPoint}）`;
  }
  return conds.length ? `${conds.join('かつ')}の場合、${base}` : base;
}
function requirementText(q){
  if(q.subject==='pile'){ const pl = pileReqLabel(q.stat); return pl ? `${pl}が${q.value}${(REQ_OPS.find(o=>o.key===q.op)||REQ_OPS[0]).label}` : ''; }
  const who = q.subject==='enemy' ? '敵' : '自分';
  const label = requirementStatLabel(q.stat, q.tagMode);
  const op = (REQ_OPS.find(o=>o.key===q.op)||REQ_OPS[0]).label;
  return label ? `${who}の${label}が${q.value}${op}` : '';
}
// 満たしていない条件の説明を返す（すべて満たしていれば空文字）。削除された状態を指す条件は無視する。
function requirementFailure(r, c){
  const list = (c && Array.isArray(c.requirements)) ? c.requirements : [];
  for(const q of list){
    if(q.subject==='pile'){
      if(!pileReqLabel(q.stat)) continue;
      const cur = pileCountOf(r, q.stat), need = q.value|0;
      const ok = q.op==='le' ? cur<=need : q.op==='eq' ? cur===need : cur>=need;
      if(!ok) return `${pileReqLabel(q.stat)}が${cur}（必要: ${need}${(REQ_OPS.find(o=>o.key===q.op)||REQ_OPS[0]).label}）`;
      continue;
    }
    if(!requirementStatLabel(q.stat, q.tagMode)) continue;
    const ent = q.subject==='enemy' ? r.enemy : r.player;
    const cur = requirementValueOf(ent, q.stat, q.tagMode);
    const need = q.value|0;
    const ok = q.op==='le' ? cur<=need : q.op==='eq' ? cur===need : cur>=need;
    if(!ok) return `${q.subject==='enemy'?'敵':'自分'}の${requirementStatLabel(q.stat, q.tagMode)}が${cur}（必要: ${need}${(REQ_OPS.find(o=>o.key===q.op)||REQ_OPS[0]).label}）`;
  }
  return '';
}
// amount===null なら全部取り除く。そうでなければ、該当する状態それぞれからamountずつ減らす。減らせた合計を返す。
function reduceTagStatuses(entity, tag, amount, mode){
  const w = tagListOf(tag);
  if(!entity || !w.length) return 0;
  let total = 0;
  const cut = cur=> amount===null ? cur : Math.min(cur, Math.max(0, amount));
  BUILTIN_STATUS_DEFS.forEach(def=>{
    if(!tagsMatch(bsTags(def.id), w, mode)) return;
    def.fields.forEach(f=>{
      const cur = entity[f]||0;
      if(cur>0){ const d = cut(cur); entity[f] = cur - d; total += d; }
    });
  });
  (S.customStatuses||[]).forEach(st=>{
    if(!tagsMatch(st.tags||[], w, mode)) return;
    const cur = customStatusStacks(entity, st.id);
    if(cur>0){ const d = cut(cur); addCustomStatusStacks(entity, st.id, -d); total += d; }
  });
  return total;
}
// タグの状態を amount だけ増やす。対象は「すでに持っている（1以上）、そのタグを持つ全状態」
// （組み込みの状態＋カスタム状態。何も持っていなければ何も起きない）。カスタム状態は排他ルールを通す。増えた合計を返す。
function increaseTagStatus(entity, tag, amount, mode){
  const w = tagListOf(tag);
  if(!entity || !w.length || !(amount>0)) return 0;
  let total = 0;
  BUILTIN_STATUS_DEFS.forEach(def=>{
    if(!tagsMatch(bsTags(def.id), w, mode)) return;
    def.fields.forEach(f=>{ if((entity[f]||0)>0){ entity[f] += amount; total += amount; } });
  });
  (S.customStatuses||[]).forEach(st=>{
    if(!tagsMatch(st.tags||[], w, mode) || customStatusStacks(entity, st.id)<=0) return;
    total += grantCustomStatus(entity, st.id, amount);
  });
  return total;
}
function normalizeCardStatusOp(o){
  if(!o || typeof o!=='object' || !o.enabled) return {enabled:false};
  return {enabled:true, side:['self','opponent','both'].includes(o.side)?o.side:'self', tag:cleanTagList(o.tag), tagMode:cleanTagMode(o.tagMode),
    mode:(o.mode==='reduce'||o.mode==='increase')?o.mode:'removeAll', amount:clampInt(o.amount,0,99,1), first:!!o.first};
}
function statusOpText(op){
  if(!op || !op.enabled || !op.tag) return '';
  const who = op.side==='opponent' ? '相手' : (op.side==='both' ? '自分と相手' : '自分');
  const tg = tagCondText(op.tag, op.tagMode);
  const base = op.mode==='increase' ? `${who}の${tg}状態を${op.amount}増やす` : op.mode==='reduce' ? `${who}の${tg}状態を${op.amount}減らす` : `${who}の${tg}状態をすべて取り除く`;
  return op.first ? base+'（付与より先）' : base;
}
// selfE＝このカードを使った側、foeE＝その相手
function applyStatusOp(op, selfE, foeE, name){
  if(!op || !op.enabled || !op.tag) return;
  const amt = op.mode==='removeAll' ? null : Math.max(0, op.amount|0);
  const targets = op.side==='both' ? [selfE, foeE] : (op.side==='opponent' ? [foeE] : [selfE]);
  let total = 0;
  targets.forEach(t=>{ total += op.mode==='increase' ? increaseTagStatus(t, op.tag, amt, op.tagMode) : reduceTagStatuses(t, op.tag, amt, op.tagMode); });
  if(total>0) pushLog(`${name}: ${statusOpText(op)}（計${total}）。`);
}
function customStatusStacks(entity, statusId){
  return (entity.customStatus && entity.customStatus[statusId]) || 0;
}
function setCustomStatusStacks(entity, statusId, val){
  if(!entity.customStatus) entity.customStatus = {};
  if(val<=0) delete entity.customStatus[statusId];
  else entity.customStatus[statusId] = val;
}
function addCustomStatusStacks(entity, statusId, delta){
  setCustomStatusStacks(entity, statusId, customStatusStacks(entity, statusId) + delta);
}
// ===== 排他（付与のときだけ判定。ターンごとの増減・消費では働かない。自分自身は数えない） =====
function exclWho(entity){ return (S.run && entity===S.run.player) ? 'あなた' : ((entity && entity.name) || ''); }
// 自分（selfId）以外で、そのタグを持つ状態の合計（組み込みの同名タグを含む）
function otherTagStacks(entity, tag, selfId){
  if(!entity || !tag) return 0;
  let sum = 0;
  BUILTIN_STATUS_DEFS.forEach(d=>{ if(bsTags(d.id).includes(tag)) sum += d.value(entity); });
  (S.customStatuses||[]).forEach(x=>{ if(x.id!==selfId && (x.tags||[]).includes(tag)) sum += customStatusStacks(entity, x.id); });
  return sum;
}
// 自分以外の、そのタグの状態をすべて取り除く（永続の強化・器用などは対象外）。取り除いた合計を返す
function removeOtherTagStatuses(entity, tag, selfId){
  let total = 0;
  BUILTIN_STATUS_DEFS.forEach(d=>{ if(!bsTags(d.id).includes(tag)) return; d.fields.forEach(f=>{ const cur = entity[f]||0; if(cur>0){ entity[f] = 0; total += cur; } }); });
  (S.customStatuses||[]).forEach(x=>{
    if(x.id===selfId || !(x.tags||[]).includes(tag)) return;
    const cur = customStatusStacks(entity, x.id);
    if(cur>0){ setCustomStatusStacks(entity, x.id, 0); total += cur; }
  });
  return total;
}
function exclLog(msg){ try{ pushLog(msg); }catch(e){} }
// g＝いま付与されようとしている状態 {id（カスタム状態のid。組み込みはnull）, name, tags}
// ④ すでにいる別の状態が「付与を無効にする」設定で、g のタグに当たるなら、付与を止める
function exclGuardBlocks(entity, g){
  const guard = (S.customStatuses||[]).find(h=> h.id!==g.id && customStatusStacks(entity, h.id)>0 && (h.exclGuard||[]).some(t=>g.tags.includes(t)));
  if(!guard) return false;
  exclLog(`${exclWho(entity)}は${guard.emoji||''}${guard.name}があるため、${g.name}は付与されなかった。`);
  return true;
}
// ③ すでにいる別の状態が「後から付与されると消える」設定で、g のタグに当たるなら、その状態を消す
function exclRemoveReplaced(entity, g){
  (S.customStatuses||[]).forEach(h=>{
    if(h.id===g.id || !(customStatusStacks(entity, h.id)>0)) return;
    if(!(h.exclReplaced||[]).some(t=>g.tags.includes(t))) return;
    setCustomStatusStacks(entity, h.id, 0);
    exclLog(`${g.name}が付与されたため、${exclWho(entity)}の${h.emoji||''}${h.name}が消えた。`);
  });
}
// 組み込みの状態を「付与」する（ある欄にvを足す）。付与されなければ0を返す
function grantBuiltin(entity, field, v){
  if(!(v>0)) return 0;
  const bid = BUILTIN_FIELD_ID[field];
  const g = {id:null, name: bid ? bsName(bid) : field, tags: bid ? bsTags(bid) : []};
  if(bid && exclGuardBlocks(entity, g)) return 0;
  entity[field] = (entity[field]||0) + v;
  if(bid) exclRemoveReplaced(entity, g);
  const fb = FX_BUILTIN[field];
  if(fb) fxStatus(entity, fb[0]+fb[1], fxWorldColor(fb[2]), v, fb[2]==='buff' ? 'buff' : 'debuff', field);
  return v;
}
// カスタム状態を「付与」する。排他の設定に従い、付与されなければ0を返す（スタックを減らす操作はそのまま通す）
// 判定の順: ④（守る）→ ②（先着に負ける）→ ①（上書きする）→ 付与 → ③（後から上書きされる）
function grantCustomStatus(entity, statusId, delta){
  if(!(delta>0)){ addCustomStatusStacks(entity, statusId, delta); return delta; }
  const st = (S.customStatuses||[]).find(x=>x.id===statusId);
  const nm = st ? `${st.emoji||''}${st.name}` : '';
  const g = {id:statusId, name:nm, tags:(st&&st.tags)||[]};
  if(st){
    if(exclGuardBlocks(entity, g)) return 0;
    const yTag = (st.exclYield||[]).find(t=> otherTagStacks(entity, t, statusId)>0);
    if(yTag){ exclLog(`${exclWho(entity)}は[${yTag}]の状態を持っているため、${nm}は付与されなかった。`); return 0; }
    (st.exclOverwrite||[]).forEach(t=>{
      const n = removeOtherTagStatuses(entity, t, statusId);
      if(n>0) exclLog(`${nm}の付与で、${exclWho(entity)}の[${t}]の状態が取り除かれた。`);
    });
  }
  addCustomStatusStacks(entity, statusId, delta);
  if(st) exclRemoveReplaced(entity, g);
  if(st) fxStatus(entity, nm, fxStatusColorOf(st), delta, st.target==='opponent' ? 'debuff' : 'buff', 'cs_'+st.id);
  return delta;
}
// 'fixed': the configured value applies as-is, regardless of stack count (stacks just
// count down as a duration, like weak/vulnerable). 'perStack': the configured value is
// a per-stack coefficient, so the total scales with the current stack count (like poison).
const DECIMAL_MAG_KINDS = ['damageDealtFlat','damageTakenFlat','elDealtFlat','elTakenFlat','damageDealtPct','damageTakenPct','blockGainFlat','autoBlock','turnStartDamage','turnStartHeal','reflectDamage','elDealtPct','elTakenPct','cardMod','cardModPct'];
function customStatusMagnitude(status, stacks){
  const v = status.magnitudeMode==='perStack' ? status.magnitudeValue*stacks : status.magnitudeValue;
  // 数値で働く効果は、係数に小数を使える。計算結果は切り捨て（浮動小数の誤差を丸めてから）
  return DECIMAL_MAG_KINDS.includes(status.kind) ? Math.trunc(Math.round(v*1e6)/1e6) : v;
}
// Every effect of the given kind, across all custom statuses the entity currently holds.
// 状態の効果1つに付ける「持ち主のHP条件」。eff.hpCondOp が 'le'（以下）か 'ge'（以上）で、eff.hpCondPct（0〜100）が基準。
// 付いていなければ常に働く。この判定を通るのは、customEffectsOn を使う効果すべてと、ターン開始時に働く効果（復活は対象外）。
function effHpOk(entity, eff){
  if(!eff || (eff.hpCondOp!=='le' && eff.hpCondOp!=='ge')) return true;
  const mx = Number(entity && entity.maxHp) || 0; if(mx<=0) return true;
  const pct = (Number(entity.hp)||0) / mx * 100, need = Number(eff.hpCondPct) || 0;
  return eff.hpCondOp==='ge' ? pct>=need : pct<=need;
}
function customEffectsOn(entity, kind){
  const out = [];
  (S.customStatuses||[]).forEach(st=>{
    const stacks = customStatusStacks(entity, st.id);
    if(stacks<=0) return;
    (st.effects||[]).forEach(eff=>{ if(eff.kind===kind && effHpOk(entity, eff)) out.push({st, eff, stacks}); });
  });
  return out;
}
// ===== 使うカードの効果を増減させる状態（cardMod） =====
// 使用するカードのコピーに、持ち主が持つ cardMod の増減を上乗せして返す。used は、実際に効果が出たものの一覧。
// （元のカードやラン中のカード補正は書き換えない。使うたびに減る分は decayCardMods で、使用が終わってから減らす）
// ％の増減。端数は0に近いほうへ切り捨てる（浮動小数点の誤差が出ないよう、整数に直して計算する）
function cardModPct(v, pct){ return Math.trunc(Math.round(v*(100+pct)*100)/10000); }
// modField の特別な形: 'flag:<特性>'（特性を付ける／外す。プラスの効果量で付け、マイナスで外す）、'cs_<状態ID>@self'（自分に与える分）／'@opponent'（相手に与える分）／'@both'（両方）。それ以外はカードの数値欄のキー。
const CARDMOD_FLAG_KEYS = ['valueFixed','valueNoDrop'];
function cardModFlagKey(f){ const m = /^flag:(.+)$/.exec(f || ''); return (m && CARDMOD_FLAG_KEYS.includes(m[1])) ? m[1] : ''; }
function parseCardModField(f){
  const m = /^(cs_.+)@(self|opponent|both)$/.exec(f || '');
  if(!m) return null;
  const st = (S.customStatuses||[]).find(x=>'cs_'+x.id===m[1]);
  return st ? {st, scope:m[2]} : null;
}
const CARDMOD_SCOPE_LABEL = {self:'自分に与える分', opponent:'相手に与える分', both:'両方に与える分'};
function cardModFieldLabel(f){
  const fk = cardModFlagKey(f);
  if(fk){ const d = GRANT_FLAG_DEFS.find(x=>x.key===fk); return `特性：${d ? d.label : fk}`; }
  const p = parseCardModField(f);
  if(p) return `${p.st.emoji ? p.st.emoji+' ' : ''}${p.st.name} 付与（${CARDMOD_SCOPE_LABEL[p.scope]}）`;
  const fd = allEffectFieldDefs().find(d=>d.key===f);
  return fd ? fd.label.replace(/（.*$/,'') : f;
}
// 効果セット（カード本体、またはトリガー側）に、増減を上乗せする。固定値でも％でも使う。
function cardModApply(obj, f, amt, isPct){
  const fk = cardModFlagKey(f);
  if(fk){ if(amt>0) obj[fk] = true; else if(amt<0) obj[fk] = false; return; }   // 特性: プラスで付ける、マイナスで外す
  const p = parseCardModField(f);
  const hasCaps = k=> (Array.isArray(obj.effects) ? obj.effects : []).some(e=>e.kind===k);
  if(p){
    const kind = 'cs_' + p.st.id;
    const legacyVals = (Number(obj[kind])||0)!==0 || ((obj['csX_'+p.st.id])|0)!==0;
    if(hasCaps(kind) || !legacyVals){   // カプセル: 付与先（自分／相手）ごとに、補正を表すカプセルを足す
      (p.scope==='both' ? ['self','opponent'] : [p.scope]).forEach(sd=>{
        const raw = capsuleRawTotal(obj, kind, sd);
        capsuleAddDelta(obj, kind, isPct ? cardModPct(raw, amt) - raw : amt, sd);
      });
      return;
    }   // カスタム状態の付与：自分への量と相手への量に分けて増減し、付与先を決め直す（自分: cs_ ／ 相手: cs_（相手のみ）、両方: cs_=自分・csX_=相手）
    const id = p.st.id, side = csGrantSide(obj, p.st);
    let selfA = side==='opponent' ? 0 : (Number(obj['cs_'+id])||0);
    let oppA = side==='opponent' ? (Number(obj['cs_'+id])||0) : side==='both' ? ((obj['csX_'+id])|0) : 0;
    const ch = v=> Math.max(-99, Math.min(99, isPct ? cardModPct(v, amt) : v + amt));
    if(p.scope==='self' || p.scope==='both') selfA = ch(selfA);
    if(p.scope==='opponent' || p.scope==='both') oppA = ch(oppA);
    if(selfA!==0 && oppA!==0){ obj['csT_'+id] = 'both'; obj['cs_'+id] = selfA; obj['csX_'+id] = oppA; }
    else if(oppA!==0){ obj['csT_'+id] = 'opponent'; obj['cs_'+id] = oppA; obj['csX_'+id] = 0; }
    else { obj['csT_'+id] = 'self'; obj['cs_'+id] = selfA; obj['csX_'+id] = 0; }
    return;
  }
  if(isCapsuleField(f) && (hasCaps(f) || !(Number(obj[f])||0))){   // カプセル: 補正を表すカプセルを足す（％は、基本値の合計に対する増減分）
    const raw = capsuleRawTotal(obj, f);
    capsuleAddDelta(obj, f, isPct ? cardModPct(raw, amt) - raw : amt, '');
    return;
  }
  const def = allEffectFieldDefs().find(d=>d.key===f);
  const min = def && def.min!==undefined ? def.min : 0;
  const base = obj[f]!==undefined ? (Number(obj[f])||0) : ((def && def.default) || 0);
  obj[f] = Math.max(min, isPct ? cardModPct(base, amt) : base + amt);
}
function applyCardModsTo(c, entity){
  if(!c || !entity) return {card:c, used:[]};
  const match = x=> x.eff.modField && cardMatchesTags(c, x.eff.modTag, x.eff.modTagMode);
  // 固定値の増減を先に、％の増減をあとに計算する
  const list = customEffectsOn(entity, 'cardMod').filter(match).concat(customEffectsOn(entity, 'cardModPct').filter(match));
  if(!list.length) return {card:c, used:[]};
  const out = {...c}, used = [];
  if(out.triggerSeparate && out.trig) out.trig = {...out.trig};
  list.forEach(x=>{
    const isPct = x.eff.kind==='cardModPct';
    const mag = customStatusMagnitude(x.eff, x.stacks);
    const amt = isPct ? Math.round(mag*100)/100 : Math.round(mag);
    if(!amt) return;
    const f = x.eff.modField;
    cardModApply(out, f, amt, isPct);
    if(out.triggerSeparate && out.trig && f!=='hits' && !cardModFlagKey(f)) cardModApply(out.trig, f, amt, isPct);   // トリガー側の効果にも同じ補正を上乗せする
    used.push(x);
  });
  return {card: used.length ? out : c, used};
}
function decayCardMods(entity, used, who){
  (used||[]).forEach(x=>{
    if(!x.eff.decayOnUse) return;
    const n = Math.max(1, x.eff.decayN||1);
    addCustomStatusStacks(entity, x.st.id, -n);
    pushLog(`${who}の${x.st.emoji||''}${x.st.name}が${n}減った（カードを使用）。`);
  });
}
function customEffectSum(entity, kind){
  return customEffectsOn(entity, kind).reduce((sum,x)=> sum + customStatusMagnitude(x.eff, x.stacks), 0);
}
// 属性補正: 攻撃が持つ属性(elems)に当たる効果だけを合計する。「全属性」は、属性を1つ以上持つ攻撃すべてに加算される
// （各属性の補正に足し合わせる。掛け算ではない）。属性のない攻撃には、属性の補正は働かない。
function elemEffectMatches(eff, elems){
  if(!elems || !elems.length) return false;
  if(eff.element==='all' || !eff.element) return true;
  return elems.some(id=>elementMatchesSelector(id, eff.element));
}
// 攻撃（カードc）が実際に持つ属性ID配列。カード自身の属性に、攻撃する側(entity)の状態による「付与」を足し、
// そのあと「取り除く」を適用する（付与→取り除くの順）。ダメージ計算・行動予告は必ずこれを使う。
function attackElements(entity, c){
  const out = cardElementIds(c);
  customEffectsOn(entity, 'elGrant').forEach(x=>{
    const id = x.eff.element;
    if(id && id!=='all' && elementById(id) && !out.includes(id)) out.push(id);
  });
  customEffectsOn(entity, 'elRemove').forEach(x=>{
    const id = x.eff.element;
    if(id==='all'){ out.length = 0; }
    else if(id && id.startsWith('tag:')){ for(let i=out.length-1;i>=0;i--) if(elementMatchesSelector(out[i], id)) out.splice(i,1); }
    else if(id){ const i = out.indexOf(id); if(i>=0) out.splice(i,1); }
  });
  return out;
}
function elementEffectsOn(entity, kind, elems){
  return customEffectsOn(entity, kind).filter(x=> elemEffectMatches(x.eff, elems));
}
function elementEffectSum(entity, kind, elems){
  return elementEffectsOn(entity, kind, elems).reduce((sum,x)=> sum + customStatusMagnitude(x.eff, x.stacks), 0);
}
function customDamageDealtBonus(entity, elems){
  return {flat: customEffectSum(entity,'damageDealtFlat') + elementEffectSum(entity,'elDealtFlat',elems),
          pct: customEffectSum(entity,'damageDealtPct') + elementEffectSum(entity,'elDealtPct',elems)};
}
function customDamageTakenPct(entity, elems){ return customEffectSum(entity,'damageTakenPct') + elementEffectSum(entity,'elTakenPct',elems); }
function customDamageTakenFlat(entity, elems){ return customEffectSum(entity,'damageTakenFlat') + elementEffectSum(entity,'elTakenFlat',elems); }
function customBlockGainBonus(entity){ return customEffectSum(entity,'blockGainFlat'); }
// 反射（reflectDamage）: 攻撃を受けた持ち主が反応する。効果は reactions[] のリストだけで表す（主な効果・追加の効果の区別はない）。
// 各効果: {id, field（何を与えるか）, target（相手／自分）, source（固定値／受けたダメージの％／ブロックで防いだ値の％）, amount, perStack}。
// 実行は fireHitReactions に一本化している（ダメージも状態もここで処理するので、組み込みの棘の反射合計には足さない）。
// ===== 攻撃を受けた時の反応 =====
// 「何を与えるか」に選べる欄。カスタム状態（cs_<ID>）も選べる。付与先は、反応ごとの「与える先」で決める。
function reactionFieldDefs(){
  const b = id=> bsName(id);
  return [
    {key:'damage', label:'ダメージ（ブロック無視）'},
    {key:'block', label:'ブロック'},
    {key:'heal', label:'HP回復'},
    {key:'strength', label:`${b('strength')}+（この戦闘中のみ）`},
    {key:'dexterity', label:`${b('dexterity')}+（この戦闘中のみ）`},
    {key:'metallicize', label:`${b('metallicize')}+（この戦闘中のみ）`},
    {key:'thorns', label:`${b('thorns')}+（この戦闘中のみ）`},
    {key:'weak', label:`${b('weak')}（ターン数）`},
    {key:'vulnerable', label:`${b('vulnerable')}（ターン数）`},
    {key:'poison', label:`${b('poison')}（ターン数）`},
    {key:'regen', label:`${b('regen')}（ターン数）`},
    {key:'stun', label:`${b('stun')}（ターン数）`},
    {key:'draw', label:'ドロー枚数（与える先がプレイヤーのときだけ）'},
    {key:'energy', label:'エネルギー（与える先がプレイヤーのときだけ）'},
  ].concat((S.customStatuses||[]).map(st=>({key:'cs_'+st.id, label:`${st.emoji?st.emoji+' ':''}${st.name}（カスタム状態。マイナスでスタックを減らす）`})));
}
function reactionFieldLabel(key){ const d = reactionFieldDefs().find(x=>x.key===key); return d ? d.label.replace(/（.*$/,'') : key; }
function reactionFieldOptionsHTML(cur){
  const defs = reactionFieldDefs();
  const missing = cur && !defs.some(d=>d.key===cur) ? `<option value="${escapeHtml(cur)}" selected>（削除された項目）</option>` : '';
  return defs.map(d=>`<option value="${escapeHtml(d.key)}" ${cur===d.key?'selected':''}>${escapeHtml(d.label)}</option>`).join('') + missing;
}
// 値の決め方: 固定値、または基準（受けたダメージ＝HPが減った分／ブロックで防いだ値）の％。端数は0に近いほうへ切り捨て。
function reactionValue(rx, taken, blocked, stacks){
  const mult = rx.perStack===false ? 1 : stacks;
  if(rx.source==='fixed') return Math.trunc(Math.round(rx.amount*mult*1e6)/1e6);
  const basis = rx.source==='blocked' ? blocked : taken;
  return Math.trunc(Math.round(basis*rx.amount*mult*100)/10000);
}
function applyReaction(r, owner, attacker, st, a){
  const ent = a.target==='self' ? owner : attacker;
  if(!ent || a.v===0) return;
  const isPlayer = ent===r.player, nm = isPlayer ? 'あなた' : ent.name, label = `${st.emoji||''}${st.name}`, v = a.v, f = a.field;
  if(f==='damage'){
    if(!(v>0) || ent.hp<=0) return;
    const b = ent.hp; ent.hp = Math.max(0, ent.hp - v); fxLose(ent, b-ent.hp);
    if(a.target==='self') pushLog(`${label}の効果で${nm}は${v}ダメージを受けた（HP ${b}→${ent.hp}）。`, isPlayer ? 'hit' : 'deal');
    else pushLog(isPlayer ? `反射ダメージを${v}受けた（HP ${b}→${ent.hp}）。` : `${ent.name}は反射ダメージを${v}受けた（敵HP ${b}→${ent.hp}）。`, isPlayer ? 'hit' : 'deal');
  } else if(f==='block'){
    if(!(v>0)) return; ent.block += v; fxBlock(ent, v); pushLog(`${label}の効果で${nm}はブロックを${v}得た。`);
  } else if(f==='heal'){
    if(!(v>0) || ent.hp<=0) return; const b = ent.hp; ent.hp = Math.min(ent.maxHp, ent.hp + v); fxHeal(ent, ent.hp-b); pushLog(`${label}の効果で${nm}はHPを${ent.hp-b}回復した。`);
  } else if(f==='draw'){
    if(!isPlayer || !(v>0)) return; drawCards(v); pushLog(`${label}の効果でカードを${v}枚引いた。`);
  } else if(f==='energy'){
    if(!isPlayer || !(v>0)) return; r.player.energy += v; pushLog(`${label}の効果でエネルギーを${v}得た。`);
  } else if(f.startsWith('cs_')){
    const cs = (S.customStatuses||[]).find(x=>x.id===f.slice(3)); if(!cs) return;
    if(grantCustomStatus(ent, cs.id, v)===0) return;
    pushLog(`${label}の効果で${nm}は${cs.emoji||''}${cs.name}${v>0?'+':''}${v}。`);
  } else if(BUILTIN_FIELD_ID[f]){
    if(!(v>0) || grantBuiltin(ent, f, v)===0) return;
    pushLog(`${label}の効果で${nm}は${bsName(BUILTIN_FIELD_ID[f])}+${v}。`);
  }
}
// 攻撃を受けた owner の「攻撃を受けた時に反応する」状態をすべて発動する。hit は、その攻撃の結果（hpLoss＝HPが減った分、blocked＝ブロックで防いだ分）。
function fireHitReactions(r, owner, attacker, hit){
  if(!owner || !attacker || owner.hp<=0 || attacker.hp<=0) return;
  const taken = Math.max(0, (hit && hit.hpLoss) || 0), blocked = Math.max(0, (hit && hit.blocked) || 0);
  // 同じ反応の機会に、何を与えるか・与える先が同じ効果は、個別に処理せず合計して1回で処理する（例：ダメージ4とダメージ6は、10ダメージを1回）。
  const groups = new Map();
  customEffectsOn(owner, 'reflectDamage').forEach(x=>{
    (x.eff.reactions||[]).forEach(rx=>{
      const key = rx.field + '|' + rx.target, v = reactionValue(rx, taken, blocked, x.stacks), g = groups.get(key);
      if(g) g.v += v; else groups.set(key, {field:rx.field, target:rx.target, v, st:x.st});
    });
  });
  groups.forEach(a=>{ if(owner.hp>0 && attacker.hp>0) applyReaction(r, owner, attacker, a.st, a); });
}
// 自分のターン開始時に持ち越すブロック量。「ブロックを持ち越す」効果を持つ状態のうち、残せる量が最も大きいものを使う（足し算はしない）。
function customKeepBlock(entity, block){
  if(!(block>0)) return 0;
  let best = 0;
  customEffectsOn(entity, 'keepBlock').forEach(x=>{
    const pct = Math.max(0, Math.min(100, customStatusMagnitude(x.eff, x.stacks)));
    let keep = Math.floor(block * pct / 100);
    const cap = x.eff.keepCap|0;
    if(cap>0) keep = Math.min(keep, cap);
    if(keep>best) best = keep;
  });
  return Math.min(best, block);
}

// HPが0になったとき、「復活」効果を持つ状態があれば、スタックを1消費してHPを回復する。
// 復活したらtrue。HPが0のままならfalse（＝本当に倒れた）。
function reviveIfAble(entity, name){
  if(entity.hp>0) return false;
  for(const st of (S.customStatuses||[])){
    const stacks = customStatusStacks(entity, st.id);
    if(stacks<=0) continue;
    const eff = (st.effects||[]).find(x=>x.kind==='revive');
    if(!eff) continue;
    const mag = customStatusMagnitude(eff, stacks);
    const hp = eff.reviveUnit==='percent' ? Math.ceil(entity.maxHp*mag/100) : mag;
    entity.hp = Math.max(1, Math.min(entity.maxHp, Math.round(hp)));
    // この下の「addCustomStatusStacks(entity, st.id, -1)」が必ず1つ消費するので、そこに合わせて増減する
    if(eff.reviveConsume==='all') addCustomStatusStacks(entity, st.id, -(stacks-1));   // 合計ですべて消費
    else if(eff.reviveConsume==='n') addCustomStatusStacks(entity, st.id, -(Math.min(stacks, Math.max(1, eff.reviveConsumeN|0))-1));   // 合計でN個（足りなければ、あるだけ）
    else if(eff.reviveConsume==='keep') addCustomStatusStacks(entity, st.id, 1);       // 合計で消費なし
    addCustomStatusStacks(entity, st.id, -1);
    pushLog(`${st.emoji||''}${st.name}の効果で${name||'倒れかけた者'}が復活した！（HP${entity.hp}）`);
    (eff.reviveGrants||[]).forEach(g=>{
      const gs = (S.customStatuses||[]).find(x=>x.id===g.statusId);
      if(!gs || !(g.stacks>0)) return;
      if(grantCustomStatus(entity, gs.id, g.stacks)===0) return;   // 排他で付与されなかった
      pushLog(`${name||'倒れかけた者'}は${gs.emoji||''}${gs.name}+${g.stacks}を得た。`);
    });
    if(S.run && S.run.enemy){
      if(entity===S.run.enemy) fireEnemyLines('selfRevived');
      else if(entity===S.run.player) fireEnemyLines('playerRevived');
    }
    return true;
  }
  return false;
}
function playerFallen(){ return S.run.player.hp<=0 && !reviveIfAble(S.run.player, 'あなた'); }
function enemyFallen(){ return S.run.enemy.hp<=0 && !reviveIfAble(S.run.enemy, S.run.enemy.name); }

// Runs at the start of `entity`'s own turn: autoBlock / turnStartDamage / turnStartHeal /
// skipTurn fire, then every custom status currently on the entity applies its perTurnDelta
// (grows or shrinks its own stack count — this is the "ターンごとに増減" option). Returns
// true if the entity's turn should be skipped entirely.
function tickCustomStatusesForTurn(entity){
  let skip = false;
  (S.customStatuses||[]).forEach(st=>{
    const stacks = customStatusStacks(entity, st.id);
    if(stacks<=0) return;
    const tag = `${st.emoji||''}${st.name}`;
    let skipped = false;
    (st.effects||[]).forEach(eff=>{
      const mag = customStatusMagnitude(eff, stacks);
      if(!effHpOk(entity, eff)) return;   // パッチC-1 を入れない場合は、この行を消す
      if(eff.kind==='turnStartEnergy'){
        // エネルギーはこの処理のあとに通常値へ戻されるので、増減量をためておき、startPlayerTurn で加減算する
        if(entity===S.run.player) entity._csEnergy = (entity._csEnergy||0) + Math.round(mag);
      } else if(eff.kind==='turnStartDamage'){
        const amt = Math.max(0, mag);
        if(amt>0){ const hb = entity.hp; entity.hp = Math.max(0, entity.hp - amt); fxLose(entity, hb-entity.hp, st.color ? '' : 'poison'); pushLog(`${tag}によって${amt}ダメージ。`); }
      } else if(eff.kind==='turnStartHeal'){
        const amt = Math.max(0, mag);
        if(amt>0){ const hb = entity.hp; entity.hp = Math.min(entity.maxHp, entity.hp + amt); fxHeal(entity, entity.hp-hb); pushLog(`${tag}によってHPを${amt}回復した。`); }
      } else if(eff.kind==='autoBlock'){
        const amt = Math.max(0, mag);
        if(amt>0){ entity.block += amt; fxBlock(entity, amt); }
      } else if(eff.kind==='skipTurn'){
        if(!skipped){
          skipped = true; skip = true;
          addCustomStatusStacks(entity, st.id, -1);
          pushLog(`${tag}によって行動できない。`);
        }
      } else if(eff.kind==='cardOp' && eff.op){
        // A card-operation acts on the PLAYER's deck, so it only fires while the player is
        // the one holding the status (whoever applied it — a card, a relic, or an enemy
        // move). It is queued and resolved after this turn's hand has been drawn (see
        // runTurnStartCardOps). How many times it fires uses this effect's magnitude.
        const times = Math.max(0, Math.round(mag));
        if(entity===S.run.player){
          for(let i=0;i<times;i++) queueTurnStartOp(S.run, {...eff.op, enabled:true}, `${tag}の効果`);
        } else {
          // 敵が持っている場合: 敵のターン開始時に予約し、プレイヤーの次のターン開始時（手札を引いた後）に
          // プレイヤーのデッキへ作用する（敵のカード操作技と同じ扱い）。
          const rr = S.run;
          for(let i=0;i<times;i++) enqueueEnemyOp(rr, {...eff.op, enabled:true, fromEnemy:true}, `${entity.name}の${tag}の効果`, '：');
        }
      }
    });
  });
  (S.customStatuses||[]).forEach(st=>{
    const stacks = customStatusStacks(entity, st.id);
    if(stacks>0 && st.perTurnDelta) addCustomStatusStacks(entity, st.id, st.perTurnDelta);
  });
  return skip;
}

// ---- Card operations that resolve at the start of the player's turn, after the draw ----
// Sources: statuses the player or the enemy holds, and enemy moves that carry a card-operation.
// An operation used by the ENEMY has its point of view flipped (see resolveEnemyCardOp):
// "add to the enemy's deck" goes into the PLAYER's draw pile, every other operation acts on
// the enemy's own deck.
function opChooseVerb(op){
  return ({moveToDiscard:'捨てる', moveToExhausted:'消滅させる', moveToDraw:'山札に戻す', moveToDrawTop:'山札の一番上に置く', moveToHand:'手札に移す',
    upgrade:'強化する', duplicate:'複製する', grantBuff:'効果を付与する', costChange:'コストを変える', generateToHand:'生成する', generateToDraw:'生成する'})[op.type] || '選ぶ';
}
// 敵が使うカード操作の説明（視点反転後の内容）。効果のない操作は空文字を返す。
function enemyOpText(op){
  const t = enemyOpTextBase(op);
  if(!t || (op.pickMode!=='random' && op.pickMode!=='choose') || op.countMode==='choose' || op.sequential) return t;
  const k = Math.max(1, op.pickCount|0 || 1);
  const byPlayer = op.pickMode==='choose' && ENEMY_ON_PLAYER_OPS.includes(op.type);   // プレイヤーの山に作用する3つの操作は、プレイヤーが選ぶ
  return t + `（そのうち${k}枚を${byPlayer ? 'あなたが選ぶ' : 'ランダムに選ぶ'}）`;
}
function enemyOpTextBase(op){
  if((op.fromPile==='self' || op.fromPile==='last') && !GENERATE_TYPES.includes(op.type)) return '';   // 「そのカード自身」「最後に使ったカード」は敵が使うときは効果なし
  const lo = Math.min(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
  const hi = Math.max(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
  const n = op.countMode==='all' ? 'すべて'
    : op.countMode==='random' ? `${lo}〜${hi}枚`
    : `${op.countFixed!==undefined?op.countFixed:1}枚`;
  const tag = tagCondText(op.filterTag, op.filterTagMode);
  switch(op.type){
    case 'generateToEnemyDeck': return `カード${n}をあなたの山札に加える${op.drawNext ? '（次のターンに必ず引く）' : '（山札に混ざる。次のターンに引くことがある）'}`;
    case 'moveToExhausted': return `自分のデッキから${tag}カード${n}を取り除く`;
    case 'moveToHand': case 'moveToDraw': case 'moveToDrawTop': case 'moveToDiscard': {
      // 敵が使うこの3つは、プレイヤーの山を対象にする
      const pile = (PILE_OPTIONS.find(x=>x.key===(op.fromPile||'hand'))||{}).label || '手札';
      const dest = {moveToHand:'手札に移す', moveToDraw:'山札に戻す（シャッフル）', moveToDrawTop:'山札の一番上に置く', moveToDiscard:'捨て札に送る'}[op.type];
      return `あなたの${pile}の${tag}カード${n}を${dest}${op.countMode==='choose' ? '（あなたが選ぶ）' : ''}`;
    }
    case 'costChange': {
      const pile = (PILE_OPTIONS.find(x=>x.key===(op.fromPile||'hand'))||{}).label || '手札';
      const d = op.costDelta|0;
      return `あなたの${pile}の${tag}カード${n}のコストを${d>=0?'+':''}${d}する${op.countMode==='choose' ? '（あなたが選ぶ）' : ''}`;
    }
    case 'upgrade': return `自分のデッキの${tag}カード${n}を強化する`;
    case 'duplicate': return `自分のデッキの${tag}カード${n}を複製する`;
    case 'play': return `自分のデッキの${tag}カード${n}を即座に使う`;
    case 'generateToHand': case 'generateToDraw': return `カード${n}を生成し、自分のデッキに加える`;
    case 'generatePlay': return `カード${n}を生成し、即座に使う`;
    case 'grantBuff': {
      const def = allEffectFieldDefs().find(d=>d.key===op.buffField);
      const name = def ? def.label.replace(/（.*$/,'') : (op.buffField||'');
      const amt = op.buffAmount||0;
      if(onlyAddTags(op)) return `自分のデッキの${tag}カード${n}に${extraGrantParts(op).join('し、')}する`;
      return `自分のデッキの${tag}カード${n}の${name}${amt>=0?'+':''}${amt}${buffTargetText(op)}${addTagsText(op)}`;
    }
    default: return '';
  }
}
// ---- カード選択画面のガイド: 実際に実行中の操作（op）から、選ぶ対象・絞り込み・選ぶ枚数・選んだあとの処理・続けて行う処理を組み立てる
function choiceAfterText(op){
  const gen = {generateToHand:'生成して、手札に加えます', generateToDraw:'生成して、山札に加えます（シャッフル）', generatePlay:'生成して、コストを消費せず使用します', generateToEnemyDeck:'生成して、敵のデッキに加えます'};
  if(gen[op.type]) return `選んだカードを${gen[op.type]}`;
  if(op.type==='captureEffect') return '選んだカードから効果を取得します（このカードの操作の中で、あとの「効果付与」に使えます）';
  if(op.type==='elementAdd' || op.type==='elementRemove' || CARDOP_TYPES.some(t=>t.key===op.type)){
    const t = thenOpText(op);
    return `選んだカードに「${t}」を行います`.replace('に「手札に移動」を行います','を手札に移動します').replace('に「捨て札に移動」を行います','を捨て札に移動します')
      .replace('に「山札に加える」を行います','を山札に加えます（シャッフル）').replace('に「山札の一番上に置く」を行います','を山札の一番上に置きます')
      .replace('に「コストなしで使用」を行います','をコストを消費せず使用します').replace('に「強化」を行います','を強化します').replace('に「複製」を行います','を複製します（捨て札に複製を追加）');
  }
  return '選んだカードに、この操作を行います';
}
function choiceGuide(op, stage, info){
  try{
    const out = [], isGen = GENERATE_TYPES.includes(op.type);
    const pileLbl = isGen ? genPoolLabel(op) : ((PILE_OPTIONS.find(p=>p.key===(op.fromPile||'hand'))||{}).label || '手札');
    const tag = isGen ? '' : tagCondText(op.filterTag, op.filterTagMode);
    const mine = (op.fromEnemy || op._fromEnemy) ? 'あなたの' : '';
    out.push({k:'選ぶ対象', v: isGen ? `${pileLbl}（候補${info.cand}枚）` : `${mine}${pileLbl}の${tag}カード（候補${info.cand}枚）${op.type==='upgrade' ? '。強化済みのカードは候補に出ません' : ''}`});
    if(stage==='pick') out.push({k:'選ぶ枚数', v:`この操作の対象になった${info.cand}枚のうち、${info.need}枚${op.pickOptional ? '（選ばなくてもよい）' : ''}。選ばなかったカードには、何も起きません`});
    else out.push({k:'選ぶ枚数', v:`${info.need}枚${op.sequential ? '（1枚ずつ選び直して、その都度処理します）' : ''}`});
    out.push({k:'選んだあと', v: choiceAfterText(op)});
    { const th = (op.then && op.then.length) ? op.then : (op._thenGuide || []); if(th.length) out.push({k:'続けて（同じカード）', v: th.map(thenOpText).join(' → ')}); }
    if(op._follow && op._follow.length) out.push({k:'このあと（次のカード操作）', v: op._follow.join(' → ')});
    return out;
  }catch(e){ console.error(e); return []; }
}
function queueTurnStartOp(r, op, label){
  if(!r.pendingTurnStartOps) r.pendingTurnStartOps = [];
  const o = {...op, prompt: `${label}：${opChooseVerb(op)}カードを選んでください`};
  r.pendingTurnStartOps.push({op:o, label});
}
function runTurnStartCardOps(r, done){
  const list = r.pendingTurnStartOps || [];
  r.pendingTurnStartOps = [];
  let i = 0;
  (function next(){
    if(i>=list.length || r.enemy.hp<=0 || r.player.hp<=0){ firePileTriggers(r, done); return; }
    const item = list[i++];
    pushLog(item.op.fromEnemy ? item.label : `${item.label}が発動。`);
    resolveCardOp(r, item.op, next);
  })();
}

// Bridges custom statuses into the same "effect field" vocabulary cards/relics already
// use (damage, block, strength...) by keying each one as "cs_<statusId>" on the card or
// relic-effect object. Because the key format matches EFFECT_FIELD_DEFS exactly, every
// generic loop that already walks EFFECT_FIELD_DEFS (the editor's field rows, the card
// description, upgradedCardView, relicFieldDefsFor) works for custom statuses for free
// once it walks allEffectFieldDefs() instead.
// 状態の付与先。カード側の設定（csT_<状態ID>）があればそれを優先し、なければ状態の「標準の付与先」を使う。
// 戻り値は 'self'（行動する本人）、'opponent'（相手）、'both'（両方。基本値＝自分への量、csX_<状態ID>＝相手への量）。
function csGrantSide(obj, st){
  const t = obj && obj['csT_'+st.id];
  if(t==='self' || t==='opponent' || t==='both') return t;
  return st.target==='opponent' ? 'opponent' : 'self';
}
function customStatusFieldDefs(){
  return (S.customStatuses||[]).map(st=>({
    key: 'cs_'+st.id,
    label: `${st.emoji?st.emoji+' ':''}${st.name} 付与`,
