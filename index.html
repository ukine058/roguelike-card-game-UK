  $('#bt-all').onclick = ()=>{ filtered().forEach(it=>sel.add(it.id)); renderList(); };
  $('#bt-none').onclick = ()=>{ filtered().forEach(it=>sel.delete(it.id)); renderList(); };
  $('#bt-clear').onclick = ()=>{ sel.clear(); renderList(); };
  $('#bt-close').onclick = ()=>{ overlay.remove(); if(changed){ if(isCard) renderEditor(); else renderStatusEditor(); } };
  $('#bt-apply').onclick = ()=>{
    const box = $('#bt-result');
    const tags = parseTags($('#bt-tag').value);
    if(!tags.length){ box.innerHTML = '<p class="hint">付与するタグを入力してください。</p>'; return; }
    if(!sel.size){ box.innerHTML = '<p class="hint">付与するものを1つ以上選んでください。</p>'; return; }
    const added = [], ignored = [];
    items().filter(it=>sel.has(it.id)).forEach(it=>{
      const add = tags.filter(t=>!hasTag(it,t));
      const skip = tags.filter(t=>hasTag(it,t));
      if(add.length){ it.tags = (Array.isArray(it.tags) ? it.tags : []).concat(add); added.push({name:nameOf(it), tags:add}); }
      if(skip.length) ignored.push({name:nameOf(it), tags:skip});
    });
    if(added.length){
      changed = true;
      if(isCard) saveCards(S.cards); else saveCustomStatuses(S.customStatuses);
    }
    const li = arr=> arr.map(x=>`<li>${escapeHtml(x.name)}　<span class="tip-dim">${x.tags.map(t=>escapeHtml(t)).join(', ')}</span></li>`).join('');
    box.innerHTML = `<div class="section-label">結果</div>
      <p><strong>付与しました：${added.length}件</strong></p>${added.length ? `<ul>${li(added)}</ul>` : ''}
      <p><strong>すでについていたため無視：${ignored.length}件</strong></p>${ignored.length ? `<ul>${li(ignored)}</ul>` : ''}`;
    renderList();
  };
  renderList();
}

/* ============================= カード編集の並べ替え（複数選択・別のレアリティへ移動） ============================= */
// 並べ替えモードのカード編集画面だけで使う。カードのクリックで選択／解除、何もない所のドラッグで囲んだカードをまとめて選択（Shift・Ctrl・⌘で追加）、
// 選んだカードをドラッグして、並びを変える／上の区分のタブへドロップして別のレアリティへ移す。選択はいま開いている区分の中だけ（区分を変えると解除）。
// 別のレアリティへ移すときは、カードの rarity を変えるだけ（編集画面の「レアリティ」の変更と同じ）。移した先の区分の最後に並ぶ。
const CARD_RARITY_GROUPS = [['basic','ベーシック'],['common','コモン'],['uncommon','アンコモン'],['rare','レア'],['generated','生成専用'],['enemy','敵専用']];
let cardReorderSel = new Set();
let cardReorderMsg = '';
// list の中の、ids のカードを取り出して rarity にし、anchorId の直前（after なら直後）へ入れる。anchorId が空なら、その区分の最後。
function moveCardsInList(list, ids, rarity, anchorId, after){
  const set = new Set(ids);
  const moving = list.filter(c=>set.has(c.id));
  if(!moving.length) return list;
  const rest = list.filter(c=>!set.has(c.id));
  moving.forEach(c=>{ c.rarity = rarity; });
  let at;
  if(anchorId){
    const ai = rest.findIndex(c=>c.id===anchorId);
    at = ai<0 ? rest.length : (after ? ai+1 : ai);
  } else {
    let last = -1; rest.forEach((c,i)=>{ if(c.rarity===rarity) last = i; });
    at = last>=0 ? last+1 : rest.length;
  }
  rest.splice(at, 0, ...moving);
  return rest;
}
function bindCardReorder(){
  const screen = qs('.screen'); if(!screen) return;
  const cur = S.cardEditorTab;
  const grid = qs('.editor-grid', screen);
  const wraps = ()=> Array.from(screen.querySelectorAll('.editor-grid .editor-card-wrap'));
  const labelOf = k=> (CARD_RARITY_GROUPS.find(g=>g[0]===k)||[])[1] || k;
  const refresh = ()=>{
    wraps().forEach(w=> w.classList.toggle('selected', cardReorderSel.has(w.dataset.id)));
    const n = qs('#rt-count', screen); if(n) n.textContent = `選択中 ${cardReorderSel.size}枚`;
  };
  const selectedIds = ()=> S.cards.filter(c=>cardReorderSel.has(c.id)).map(c=>c.id);   // 並びの順
  const commit = list=>{ S.cards = list; saveCards(list); renderEditor(); };
  const moveToGroup = rarity=>{
    const ids = selectedIds();
    if(!ids.length) return false;
    const list = moveCardsInList(S.cards, ids, rarity, null);
    cardReorderMsg = `${ids.length}枚を「${labelOf(rarity)}」へ移動しました。`;   // 再描画で表示する（先に設定しておく）
    cardReorderSel = new Set();
    commit(list);
    return true;
  };
  // ツール行（すべて選択／解除／移動先を選んで移動）。ドラッグしにくい環境向けにも使える
  if(!qs('.reorder-tools', screen)){
    const tools = el(`<div class="reorder-tools">
      <button type="button" class="ghost" id="rt-all">表示中をすべて選択</button>
      <button type="button" class="ghost" id="rt-none">選択を解除</button>
      <span id="rt-count" class="tip-dim"></span>
      <select id="rt-to" aria-label="移動先">${CARD_RARITY_GROUPS.filter(g=>g[0]!==cur).map(g=>`<option value="${g[0]}">${g[1]}</option>`).join('')}</select>
      <button type="button" class="ghost" id="rt-move">選んだカードを移動</button>
      <span id="rt-msg" style="color:var(--gold); font-size:12px;"></span></div>`);
    const hint = qs('.reorder-hint', screen);
    (hint || qs('.topbar', screen)).insertAdjacentElement('afterend', tools);
    qs('#rt-all', screen).onclick = ()=>{ cardReorderSel = new Set(wraps().map(w=>w.dataset.id)); refresh(); };
    qs('#rt-none', screen).onclick = ()=>{ cardReorderSel = new Set(); refresh(); };
    qs('#rt-move', screen).onclick = ()=>{
      if(!cardReorderSel.size){ qs('#rt-msg', screen).textContent = '移動するカードを選んでください。'; return; }
      moveToGroup(qs('#rt-to', screen).value);
    };
    if(cardReorderMsg){ qs('#rt-msg', screen).textContent = cardReorderMsg; cardReorderMsg = ''; }
  }
  refresh();

  // 何もない所のドラッグ: 囲んだカードを選択する（ページ座標で計算するので、ドラッグ中のスクロールにも追従する）
  screen.addEventListener('pointerdown', ev=>{
    if(ev.pointerType==='mouse' && ev.button!==0) return;
    if(ev.target.closest && ev.target.closest('.editor-card-wrap, button, select, input, a, .topbar, .tab-row, .reorder-tools, .reorder-hint')) return;
    const add = ev.shiftKey || ev.ctrlKey || ev.metaKey;
    const x0 = ev.pageX, y0 = ev.pageY;
    const base = add ? new Set(cardReorderSel) : new Set();
    let box = null, moved = false;
    const onMove = e=>{
      if(!moved && Math.abs(e.pageX-x0)<4 && Math.abs(e.pageY-y0)<4) return;
      moved = true;
      if(!box){ box = document.createElement('div'); box.className = 'marquee'; document.body.appendChild(box); }
      if(e.clientY<70) window.scrollBy(0,-16); else if(e.clientY>window.innerHeight-70) window.scrollBy(0,16);
      const L = Math.min(x0,e.pageX), T = Math.min(y0,e.pageY), R = Math.max(x0,e.pageX), B = Math.max(y0,e.pageY);
      Object.assign(box.style, {left:L+'px', top:T+'px', width:(R-L)+'px', height:(B-T)+'px'});
      const sel = new Set(base);
      wraps().forEach(w=>{
        const b = w.getBoundingClientRect(), sx = window.scrollX||0, sy = window.scrollY||0;
        if(b.left+sx<R && b.right+sx>L && b.top+sy<B && b.bottom+sy>T) sel.add(w.dataset.id);
      });
      cardReorderSel = sel; refresh();
    };
    const end = ()=>{
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', end);
      document.removeEventListener('pointercancel', end);
      if(box) box.remove();
      if(!moved && !add){ cardReorderSel = new Set(); refresh(); }   // 何もない所をクリックしただけなら、選択を解除
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);
  });

  // カード: クリックで選択／解除、ドラッグで選んだカードを移動
  wraps().forEach(w=>{
    w.addEventListener('pointerdown', ev=>{
      if(ev.pointerType==='mouse' && ev.button!==0) return;
      ev.preventDefault(); ev.stopPropagation();
      const id = w.dataset.id, x0 = ev.clientX, y0 = ev.clientY;
      try{ w.setPointerCapture(ev.pointerId); }catch(e){}
      let dragging = false, badge = null, drop = null;
      const clearMarks = ()=>{
        wraps().forEach(n=> n.classList.remove('drop-before','drop-after'));
        if(grid) grid.classList.remove('drop-end');
        qsa('.tab-btn', screen).forEach(b=> b.classList.remove('drop-target'));
      };
      const startDrag = ()=>{
        dragging = true;
        if(!cardReorderSel.has(id)){ cardReorderSel = new Set([id]); refresh(); }   // 選んでいないカードをドラッグしたら、そのカードだけを選ぶ
        wraps().forEach(n=>{ if(cardReorderSel.has(n.dataset.id)) n.classList.add('dragging'); });
        badge = document.createElement('div'); badge.className = 'drag-badge'; badge.textContent = `${cardReorderSel.size}枚`;
        document.body.appendChild(badge);
      };
      const onMove = e=>{
        if(!dragging){ if(Math.abs(e.clientX-x0)+Math.abs(e.clientY-y0)<6) return; startDrag(); }
        badge.style.left = (e.clientX+12)+'px'; badge.style.top = (e.clientY+12)+'px';
        if(e.clientY<70) window.scrollBy(0,-16); else if(e.clientY>window.innerHeight-70) window.scrollBy(0,16);
        clearMarks(); drop = null;
        const els = document.elementsFromPoint(e.clientX, e.clientY);
        const tab = els.find(n=> n.classList && n.classList.contains('tab-btn') && n.dataset.tab);
        if(tab){ if(tab.dataset.tab!==cur){ tab.classList.add('drop-target'); drop = {kind:'tab', rarity:tab.dataset.tab}; } return; }
        const hit = els.find(n=> n.classList && n.classList.contains('editor-card-wrap') && n.parentNode===grid);
        if(hit){
          if(cardReorderSel.has(hit.dataset.id)) return;   // 選んだカード自身の上では、何もしない
          const b = hit.getBoundingClientRect(), after = e.clientX > b.left + b.width/2;
          hit.classList.add(after ? 'drop-after' : 'drop-before');
          drop = {kind:'card', id:hit.dataset.id, after};
          return;
        }
        if(grid && els.includes(grid)){ grid.classList.add('drop-end'); drop = {kind:'end'}; }   // カードのない所＝この区分の最後
      };
      const cleanup = ()=>{
        w.removeEventListener('pointermove', onMove);
        w.removeEventListener('pointerup', end);
        w.removeEventListener('pointercancel', cancel);
        try{ w.releasePointerCapture(ev.pointerId); }catch(e){}
        clearMarks();
        wraps().forEach(n=> n.classList.remove('dragging'));
        if(badge) badge.remove();
      };
      const cancel = ()=>{ cleanup(); };
      const end = ()=>{
        cleanup();
        if(!dragging){   // ドラッグしていない＝クリック: 選択／解除
          if(cardReorderSel.has(id)) cardReorderSel.delete(id); else cardReorderSel.add(id);
          refresh(); return;
        }
        if(!drop) return;
        const ids = selectedIds(); if(!ids.length) return;
        if(drop.kind==='tab'){ moveToGroup(drop.rarity); return; }
        commit(moveCardsInList(S.cards, ids, cur, drop.kind==='card' ? drop.id : null, !!drop.after));
      };
      w.addEventListener('pointermove', onMove);
      w.addEventListener('pointerup', end);
      w.addEventListener('pointercancel', cancel);
    });
  });
}

function renderEditor(){
  if(!reorderMode) cardReorderSel = new Set();
  const groups = [['basic','ベーシック'],['common','コモン'],['uncommon','アンコモン'],['rare','レア'],['generated','生成専用'],['enemy','敵専用']];
  if(!groups.some(g=>g[0]===S.cardEditorTab)) S.cardEditorTab = 'common';
  let html = `
  <div class="screen">
    <div class="topbar">
      <div><p class="eyebrow">CARD EDITOR</p><h2>カードを編集する</h2></div>
      <div class="topbar-btns"><button class="ghost" id="btn-bulktag">タグをまとめて付与</button><button class="ghost" id="btn-reorder">並べ替え</button><button class="ghost" id="btn-back">← ホームへ</button></div>
    </div>`;
  html += `<div class="tab-row">${groups.map(([rar,label])=>`<button class="tab-btn ${S.cardEditorTab===rar?'active':''}" data-tab="${rar}">${label}（${S.cards.filter(c=>c.rarity===rar).length}）</button>`).join('')}</div>`;
  groups.filter(g=>g[0]===S.cardEditorTab).forEach(([rar,label])=>{

  html += `</div>`;
  app().innerHTML = html;
  bindEditorTools({getList:()=>S.cards, setList:v=>{ S.cards=v; saveCards(v); }, rerender:renderEditor, dup:c=>{ c.id=newId(); c.name+='（コピー）'; c.startingCount=0; return c; },

    reorderHint:'並べ替えモード：カードをクリックで選択／解除。何もない所をドラッグすると、囲んだカードをまとめて選べます（Shift・Ctrl・⌘を押しながらで追加）。選んだカードをドラッグして、並びを変えたり、上の区分のタブへドロップして別のレアリティへ移したりできます。'});

  qs('#btn-back').onclick = ()=>{ S.screen='home'; renderHome(); };
  qs('#btn-bulktag').onclick = ()=> openBulkTagModal('card');
  qsa('.tab-btn').forEach(b=> b.onclick = ()=>{ S.cardEditorTab = b.dataset.tab; cardReorderSel = new Set(); renderEditor(); });
  if(reorderMode) bindCardReorder();
  qsa('.edit-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.closest('.editor-card-wrap').dataset.id;
      openCardModal(cardById(id), false);
    };
  });
  qsa('.del-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.closest('.editor-card-wrap').dataset.id;
      uiConfirm('このカードを削除しますか？', ()=>{
        S.cards = S.cards.filter(c=>c.id!==id);
        saveCards(S.cards);
        renderEditor();
      });
    };
  });
  qsa('.add-card-tile').forEach(tile=>{
    tile.onclick = ()=>{
      openCardModal({
        id:newId(), name:'新しいカード', type:'attack', cost:1, rarity: tile.dataset.rarity, startingCount:0,
        damage:0, block:0, draw:0, energy:0, strength:0, permStrength:0, weak:0, vulnerable:0, poison:0, heal:0, metallicize:0, permMetallicize:0, loseHp:0, exhaust:false,
        tags:[], hits:1, scales:{}
      }, true);
    };
  });
}

  const dropRelicPool = S.relics.slice().sort((a,b)=> a.name.localeCompare(b.name,'ja'));

      <div class="section-label">所持デッキ</div>

      <div id="em-forced-list"></div>
      <button type="button" id="em-forced-add">＋ 条件付きの確定行動を追加</button>
      <div class="section-label">連続行動</div>
      <p class="hint">「この行動が選ばれたら、次は必ずこの行動を使う」を設定します。抽選で選ばれた場合も、条件付きの確定行動で選ばれた場合も同じです。選ばれた行動が実行されたあとの次の予告で、設定した行動が決まります。連続行動で選ばれた行動にさらに連続行動を設定すると、3連続以上もつなげられます。同じ行動を複数設定した場合は、上のものが使われます。</p>
      <div id="em-chain-list"></div>
      <button type="button" id="em-chain-add">＋ 連続行動を追加</button>
      <div class="section-label">属性相性（弱点・耐性）</div>

  function forcedRowHTML(rule, i){

      <div class="ev-eff-grid">
        <div><label>比較</label><select data-f="cmp">${subj.cmps.map(k=>`<option value="${k}" ${rule.cmp===k?'selected':''}>${cmpLabels[k]}</option>`).join('')}</select></div>
        <div><label>${subj.unit}</label><input type="number" data-f="value" data-num="1" value="${rule.value|0}" min="0" max="9999"></div>
      </div>
      <div class="field" style="margin-top:8px;"><label>確定させる行動（カード）</label><select data-f="cardId">
        ${movePool.map(c=>`<option value="${c.id}" ${c.id===rule.cardId?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="checkbox-field"><input type="checkbox" id="em-forced-once-${i}" data-f="once" ${rule.once?'checked':''}><label for="em-forced-once-${i}">この戦闘で一度だけ</label></div>
      <div class="field" style="margin-top:8px;"><label>連続行動と同じ予告で重なったとき</label><select data-f="conflict">
        ${Object.keys(CONFLICT_LABELS).map(k=>`<option value="${k}" ${(rule.conflict||'priority')===k?'selected':''}>${CONFLICT_LABELS[k]}</option>`).join('')}</select></div>

  function renderForcedList(){

  }
  renderForcedList();
  (function(){

      const row = t.closest && t.closest('[data-idx]');
      const f = t.dataset && t.dataset.f;
      if(!row || !f) return false;
      const rule = en.forcedMoves[parseInt(row.dataset.idx,10)];
      if(!rule) return false;
      if(f==='tagsText'){ rule.tag = 'tags:' + t.value; return true; }
      if(t.type==='checkbox') rule[f] = t.checked;
      else if(t.dataset.num){ const v = parseInt(t.value,10); rule[f] = isNaN(v) ? 0 : v; }
      else rule[f] = t.value;

    box.addEventListener('input', e=>{ sync(e.target); });

      if(e.target.dataset.f==='tag'){ renderForcedList(); return; }
      if(e.target.dataset.f==='subject'){
        const rule = en.forcedMoves[parseInt(e.target.closest('[data-idx]').dataset.idx,10)];

  function lineRowHTML(l, i){

      <div class="ev-eff-head"><span>セリフ ${i+1}</span><button type="button" class="ghost em-line-del">削除</button></div>

  }

  (function(){

    box.addEventListener('input', e=>{
      const l = lineOf(e.target), f = e.target.dataset && e.target.dataset.f;

      const l = lineOf(e.target), f = e.target.dataset && e.target.dataset.f;

      renderLineList();

      <div class="ev-eff-head"><span>属性相性 ${i+1}</span><button type="button" class="ghost em-mod-del">削除</button></div>
      <div class="ev-eff-grid"><div><label>属性</label><select data-f="element">${(S.elements||[]).map(x=>`<option value="${escapeHtml(x.id)}" ${x.id===m.element?'selected':''}>${escapeHtml((x.emoji||'')+' '+x.name)}</option>`).join('')}${elementTagList().map(t=>`<option value="tag:${escapeHtml(t)}" ${m.element==='tag:'+t?'selected':''}>タグ「${escapeHtml(t)}」の属性すべて</option>`).join('')}</select></div>
        <div><label>被ダメージの増減（％）</label><input type="number" data-f="pct" value="${m.pct}" min="-100" max="500"></div></div>

  renderModList();
  (function(){

      elementMods: cleanElementMods(en.elementMods),

      image: en.image||'',
      category: qs('#em-category',overlay).value,
      baseHp: clampInt(qs('#em-hp',overlay).value,1,999,30),
      weight: clampInt(qs('#em-weight',overlay).value,1,20,1),
      minFloor: clampInt(qs('#em-minfloor',overlay).value,1,99,1),
      minRound: clampInt(qs('#em-minround',overlay).value,1,99,1),
      noRepeat: qs('#em-norepeat',overlay).checked,
      deck: en.deck.slice(),
      startEffect: {},
    };
    enemyStartFieldDefs().forEach(def=>{
      updated.startEffect[def.key] = clampInt(qs(`#em-eff-${def.key}`,overlay).value,0,def.max||99,0);

    else{ S.enemies = S.enemies.map(x=> x.id===updated.id? updated : x); }
    saveEnemies(S.enemies);
    overlay.remove();
    renderEnemyEditor();
  };

function customStatusUsage(statusId){
  const key = 'cs_'+statusId;
  const inSet = c=>
    (c[key]) || (c['csX_'+statusId]) || (c.scales && c.scales[key]) || (c.upgrades && (c.upgrades[key] || (c.upgrades.scalePP && c.upgrades.scalePP[key])))
    || cardOpsOf(c).some(o=>o.type==='grantBuff' && o.buffField===key)
    || Object.values(c.scales||{}).some(sc=> sc && (sc.source==='csSelf:'+statusId || sc.source==='csEnemy:'+statusId));
  const cardIds = S.cards.filter(c=>
    (c['dw_'+key]) || (c['dw_csX_'+statusId]) || (c['ex_'+key]) || (c['ex_csX_'+statusId]) || (c['ho_'+key]) || (c['ho_csX_'+statusId]) || inSet(c) || (c.trig && inSet(c.trig))
  ).map(c=>c.id);
  const relicIds = S.relics.filter(rel=> rel.effect && rel.effect[key]).map(rel=>rel.id);
  return {cardIds, relicIds};
}
function stripCustomStatusRefs(statusId){
  const key = 'cs_'+statusId;
  S.cards.forEach(c0=>{
    delete c0['dw_'+key]; delete c0['dw_csT_'+statusId]; delete c0['dw_csX_'+statusId];
    delete c0['ex_'+key]; delete c0['ex_csT_'+statusId]; delete c0['ex_csX_'+statusId];
    delete c0['ho_'+key]; delete c0['ho_csT_'+statusId]; delete c0['ho_csX_'+statusId];
    [c0].concat(c0.trig ? [c0.trig] : []).forEach(c=>{
    delete c[key]; delete c['csT_'+statusId]; delete c['csX_'+statusId];
    if(c.scales){
      delete c.scales[key];
      Object.keys(c.scales).forEach(f=>{ const sc = c.scales[f]; if(sc && (sc.source==='csSelf:'+statusId || sc.source==='csEnemy:'+statusId)) delete c.scales[f]; });
    }
    if(c.upgrades){ delete c.upgrades[key]; if(c.upgrades.scalePP) delete c.upgrades.scalePP[key]; }
    if(Array.isArray(c.cardOps)) c.cardOps = c.cardOps.filter(o=>!(o && o.buffField===key && o.type==='grantBuff'));
    if(c.cardOp && c.cardOp.buffField===key){ c.cardOp.enabled = false; }
    });
  });
  saveCards(S.cards);
  S.relics.forEach(rel=>{ if(rel.effect) delete rel.effect[key]; });
  saveRelics(S.relics);
}

    <div class="section-label">メインキャラクター（1人。選ぶと、戦闘画面のプレイヤーの名前とアイコンが、そのキャラクターになります）</div>

    <div class="checkbox-field"><input type="checkbox" id="fm-skip" ${f.skipMain?'checked':''} ${f.main?'':'disabled'}><label for="fm-skip">メインキャラクターのレリックを獲得しない（タグの解放だけ行う）</label></div>
    <div class="section-label">サブ（開始時に解放する、ほかのキャラクタータグ。メインは、いつも解放されます）</div>
    ${f.subs.map((x,i)=>`<div class="ev-add" style="margin-bottom:4px;"><span>サブ${i+1}</span><select data-sub="${i}">${optsHTML(x, false)}</select><button type="button" class="ghost" data-delsub="${i}">削除</button></div>`).join('') || '<p class="hint">サブの枠がありません。</p>'}
    <div style="display:flex; gap:6px; margin:6px 0; flex-wrap:wrap;"><button class="ghost" id="fm-addsub" ${canAdd?'':'disabled'}>＋ サブ枠を追加</button><button class="ghost" id="fm-all">サブをすべて解放（メイン以外の全員）</button><button class="ghost" id="fm-none">サブをすべて外す</button></div>
    <p class="hint">同じキャラクターは、メイン・サブで重複させられません。枠の数は、キャラクターの人数（${tags.length}人）までです${canAdd ? '' : '（上限に達しているため、追加できません）'}。「完全ランダム」「選択肢ランダム」は、冒険を始めるたびに抽選します（選択肢の数は${formationPickN()}人、複数枠の提示は「${S.settings.formationPickMode==='batch' ? '一度にすべて（共通の候補から、枠の数だけ選ぶ）' : '一つずつ'}」。ルール設定で変更できます）。メインや他の枠で選んだキャラクターは候補から外れ、候補が足りないときは、いる人数から選びます（1人なら、そのまま決まります）。</p>
    ${sh.excess>0 ? `<p class="hint" style="color:#ff8f86;">抽選できるキャラクターが足りません（ランダムの枠 ${needSp}、抽選できるキャラクター ${avail}人）。このままでは、冒険を始められません。 <button class="ghost" id="fm-trim">足りない枠を削除する（${sh.excess}枠）</button></p>` : ''}
    <p class="hint">${formSummary(f)} ・ カード出現プール（ランダム枠は含みません）: キャラクター限定のカード ${open.length} / ${restricted.length}枚が出現（タグのないカード ${pool.length-restricted.length}枚は、常に出現）</p>
    <div class="section-label">この編成をプリセットに保存</div>
    <div style="display:flex; gap:8px; align-items:center;"><input type="text" id="fm-presetname" maxlength="30" placeholder="プリセット名" style="flex:1;"><button class="primary" id="fm-save">プリセットに保存</button></div>
    ` : `<p class="hint">キャラクタータグがまだありません。「キャラクタータグを編集する」で作成してください。</p>`}`;
  } else {
    html += `<p class="hint">保存した編成です。「この編成を使う」を押すと、編成タブにコピーされます。</p>`;
    if(!S.formationPresets.length) html += `<p class="hint">プリセットがまだありません。編成タブで保存できます。</p>`;
    S.formationPresets.forEach(p=>{
      html += `<div class="bs-card" data-pid="${p.id}" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:6px 0;">
        <div style="flex:1; min-width:160px;"><b>${escapeHtml(p.name)}</b><div class="hint" style="margin:2px 0 0;">${formSummary(p)}</div></div>
        <button class="primary fm-use">この編成を使う</button><button class="ghost fm-rename">名前変更</button><button class="ghost fm-del">削除</button>
      </div>`;

  html += `</div>`;
  app().innerHTML = html;
  qs('#btn-back').onclick = ()=>{ __formMsg=''; S.screen='home'; renderHome(); };
  qs('#fm-tab-current').onclick = ()=>{ __formTab='current'; __formMsg=''; renderFormation(); };
  qs('#fm-tab-presets').onclick = ()=>{ __formTab='presets'; __formMsg=''; renderFormation(); };
  if(!tabB){
    const commit = ()=>{ S.formation = cleanFormation(f); saveFormation(); __formMsg=''; renderFormation(); };
    if(qs('#fm-main')) qs('#fm-main').onchange = e=>{ f.main = e.target.value; commit(); };
    qsa('select[data-sub]').forEach(s=>{ s.onchange = ()=>{ f.subs[+s.dataset.sub] = s.value; commit(); }; });
    qsa('[data-delsub]').forEach(b=>{ b.onclick = ()=>{ f.subs.splice(+b.dataset.delsub, 1); commit(); }; });
    if(qs('#fm-addsub')) qs('#fm-addsub').onclick = ()=>{
      const usedNow = new Set([f.main, ...f.subs]), free = tags.find(t=>!usedNow.has(t.id));
      f.subs.push(free ? free.id : (full ? '@random' : '@pick')); commit(); };
    if(qs('#fm-trim')) qs('#fm-trim').onclick = ()=>{ f.main = trimFormationToPool(f).main; f.subs = trimFormationToPool(f).subs; commit(); };
    if(qs('#fm-skip')) qs('#fm-skip').onchange = e=>{ f.skipMain = e.target.checked; saveFormation(); };
    if(qs('#fm-all')) qs('#fm-all').onclick = ()=>{ f.subs = tags.map(t=>t.id).filter(id=>id!==f.main); commit(); };
    if(qs('#fm-none')) qs('#fm-none').onclick = ()=>{ f.subs = []; commit(); };
    if(qs('#fm-save')) qs('#fm-save').onclick = ()=>{
      if(S.formationPresets.length>=50){ __formMsg = 'プリセットは50件までです。'; renderFormation(); return; }
      const name = (qs('#fm-presetname').value||'').trim() || `編成${S.formationPresets.length+1}`;
      S.formationPresets.push({id:newId(), name:name.slice(0,30), ...cleanFormation(JSON.parse(JSON.stringify(f)))});
      saveFormation(); __formMsg = `「${name.slice(0,30)}」をプリセットに保存しました。`; renderFormation();
    };
  } else {
    const pOf = b=> S.formationPresets.find(p=>p.id===b.closest('[data-pid]').dataset.pid);
    qsa('.fm-use').forEach(b=>{ b.onclick = ()=>{ const p = pOf(b); if(!p) return; S.formation = cleanFormation(JSON.parse(JSON.stringify(p))); saveFormation(); __formTab='current'; __formMsg = `「${p.name}」を編成に読み込みました。`; renderFormation(); }; });
    qsa('.fm-rename').forEach(b=>{ b.onclick = ()=>{ const p = pOf(b); if(!p) return; uiPrompt('プリセット名', p.name, n=>{ p.name = (n||'').trim().slice(0,30) || p.name; saveFormation(); renderFormation(); }, {max:30}); }; });
    qsa('.fm-del').forEach(b=>{ b.onclick = ()=>{ const p = pOf(b); if(!p) return; uiConfirm(`「${p.name}」を削除しますか？`, ()=>{ S.formationPresets = S.formationPresets.filter(x=>x.id!==p.id); saveFormation(); renderFormation(); }); }; });
  }
}

/* ============================= 属性エディタ ============================= */
function elementUsage(id){
  return {cardIds: S.cards.filter(c=>Array.isArray(c.elements) && c.elements.includes(id)).map(c=>c.id),
          statusIds: (S.customStatuses||[]).filter(st=>(st.effects||[]).some(x=>ELEMENT_REF_KINDS.includes(x.kind) && x.element===id)).map(st=>st.id),
          enemyIds: (S.enemies||[]).filter(en=>(en.elementMods||[]).some(m=>m.element===id)).map(en=>en.id)};
}
function renderElementEditor(){
  const list = S.elements||[];
  app().innerHTML = `
  <div class="screen">
    <div class="topbar">
      <div><p class="eyebrow">ELEMENT EDITOR</p><h2>属性を編集する</h2></div>
      <div class="topbar-btns"><button class="ghost" id="btn-back">← ホームへ</button></div>
    </div>
    <p class="hint">攻撃ダメージに付ける「属性」を作ります（カード編集の「攻撃の属性」で選びます）。属性ごとに、エフェクトの色・絵文字と、特殊効果（吸血・貫通・ブロック破壊・ヒット時ブロック獲得・ヒット時の状態付与）を設定できます。敵ごとの弱点・耐性は、敵の編集画面で設定します。</p>
    <div class="section-label">属性一覧（${list.length}種）</div>
    <div id="el-rows">${list.length ? list.map(el=>`<div class="ev-add" data-id="${escapeHtml(el.id)}" style="margin-bottom:6px;"><span style="flex:1; font-size:15px;">${el.color?`<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${el.color}; margin-right:6px;"></span>`:''}${escapeHtml(el.emoji||'')} ${escapeHtml(el.name)}${(el.tags&&el.tags.length)?` <span class="hint" style="font-size:12px;">[${el.tags.map(escapeHtml).join(', ')}]</span>`:''}${ELEMENT_PROP_DEFS.filter(d=> d.has ? d.has((el.props||{})[d.key]) : (el.props||{})[d.key]>0).map(d=>` <span class="hint" style="font-size:12px;">${escapeHtml(d.short((el.props||{})[d.key]))}</span>`).join('')}</span>
      <button type="button" class="el-edit">編集</button><button type="button" class="el-dup">複製</button><button type="button" class="el-del">削除</button></div>`).join('') : '<p class="hint">属性がありません。</p>'}</div>
    <div style="margin-top:12px;"><button type="button" class="primary" id="el-new">＋ 属性を追加</button></div>
  </div>`;
  qs('#btn-back').onclick = ()=>{ S.screen='home'; renderHome(); };
  qsa('.el-edit').forEach(b=> b.onclick = ()=> openElementModal(elementById(b.closest('[data-id]').dataset.id), false));
  qsa('.el-dup').forEach(b=> b.onclick = ()=>{
    const src = elementById(b.closest('[data-id]').dataset.id); if(!src) return;
    S.elements.push({...JSON.parse(JSON.stringify(src)), id:newId(), name:src.name+'（コピー）'});
    saveElements(S.elements); renderElementEditor();
  });
  qsa('.el-del').forEach(b=> b.onclick = ()=>{
    const id = b.closest('[data-id]').dataset.id, el = elementById(id); if(!el) return;
    const use = elementUsage(id), n = use.cardIds.length, ns = use.statusIds.length, ne = use.enemyIds.length;
    uiConfirm((n||ns||ne) ? `「${el.name}」は ${n}枚のカード・${ns}個の状態・${ne}体の敵で使われています。\nカードから外し、状態のこの属性の効果と、敵の属性相性も削除して、削除しますか？` : `「${el.name}」を削除しますか？`, ()=>{
    S.cards.forEach(c=>{ if(Array.isArray(c.elements)) c.elements = c.elements.filter(x=>x!==id); });
    if(n) saveCards(S.cards);
    if(ns){
      S.customStatuses.forEach(st=>{ st.effects = (st.effects||[]).filter(x=> !(ELEMENT_REF_KINDS.includes(x.kind) && x.element===id)); });
      saveCustomStatuses(S.customStatuses);
    }
    if(ne){ S.enemies.forEach(en=>{ en.elementMods = (en.elementMods||[]).filter(m=>m.element!==id); }); saveEnemies(S.enemies); }
    S.elements = S.elements.filter(x=>x.id!==id); saveElements(S.elements); renderElementEditor();
    });
  });
  qs('#el-new').onclick = ()=> openElementModal({id:newId(), name:'新しい属性', props:{}}, true);
}
function openElementModal(el, isNew){
  const e = {...el};
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box">
    <h3>${isNew ? '属性を新規作成' : '属性を編集'}</h3>
    <div class="field"><label>属性の名前</label><input type="text" id="elm-name" value="${escapeHtml(e.name)}" maxlength="20"></div>
    <div class="field"><label>エフェクトの絵文字（この属性の攻撃を受けたときに光の中に出る。空欄ならなし）</label><input type="text" id="elm-emoji" value="${escapeHtml(e.emoji||'')}" maxlength="4"></div>
    <div class="checkbox-field"><input type="checkbox" id="elm-usecolor" ${e.color?'checked':''}><label for="elm-usecolor">エフェクトの色を指定する（オフなら、通常ダメージの色）</label></div>
    <div class="field"><input type="color" id="elm-color" value="${e.color||'#E04848'}" style="width:100%; height:38px; padding:2px;"></div>
    <div class="field"><label>タグ（カンマ区切り。状態の「属性を強化／耐性」の対象を、タグでまとめて指定できます）</label><input type="text" id="elm-tags" value="${escapeHtml((e.tags||[]).join(', '))}" placeholder="例: 火属性"></div>
    <div class="section-label">特殊効果</div>
    ${ELEMENT_PROP_DEFS.map(def=> def.type==='list'
      ? `<div class="field"><label>${escapeHtml(def.label)}</label><div id="elm-list-${def.key}"></div><button type="button" class="ghost" id="elm-listadd-${def.key}">＋ 追加</button><p class="hint">${escapeHtml(def.hint)}</p></div>`
      : `<div class="field"><label>${escapeHtml(def.label)}</label><input type="number" id="elm-prop-${def.key}" value="${(e.props||{})[def.key]||0}" min="${def.min}" max="${def.max}" step="1"><p class="hint">${escapeHtml(def.hint)}</p></div>`).join('')}
    <div class="modal-actions"><button class="ghost" id="elm-cancel">キャンセル</button><button class="primary" id="elm-save">保存する</button></div>
  </div>`;
  document.body.appendChild(overlay);
  // 行を並べて編集する特殊効果（type:'list'）
  const rowLists = {};
  ELEMENT_PROP_DEFS.filter(d=>d.type==='list').forEach(def=>{
    rowLists[def.key] = (Array.isArray((e.props||{})[def.key]) ? e.props[def.key] : []).map(x=>({...x}));
    const box = qs('#elm-list-'+def.key, overlay);
    const render = ()=>{ box.innerHTML = rowLists[def.key].length ? rowLists[def.key].map((row,i)=>def.rowHTML(row,i)).join('') : '<p class="hint">なし</p>'; };
    render();
    const rowOf = t=>{ const r = t.closest && t.closest('[data-idx]'); return r ? rowLists[def.key][parseInt(r.dataset.idx,10)] : null; };
    box.addEventListener('input', ev=>{ const row = rowOf(ev.target), f = ev.target.dataset && ev.target.dataset.f; if(row && f && ev.target.tagName!=='SELECT') row[f] = ev.target.value; });
    box.addEventListener('change', ev=>{ const row = rowOf(ev.target), f = ev.target.dataset && ev.target.dataset.f; if(row && f) row[f] = ev.target.value; });
    box.addEventListener('click', ev=>{ const b = ev.target.closest('.elm-row-del'); if(!b) return; rowLists[def.key].splice(parseInt(b.closest('[data-idx]').dataset.idx,10),1); render(); });
    qs('#elm-listadd-'+def.key, overlay).onclick = ()=>{ if(rowLists[def.key].length>=6) return; rowLists[def.key].push(def.newRow()); render(); };
  });
  qs('#elm-cancel',overlay).onclick = ()=> overlay.remove();
  qs('#elm-save',overlay).onclick = ()=>{
    const name = qs('#elm-name',overlay).value.trim();
    if(!name){ uiAlert('名前を入力してください。'); return; }
    const props = {...(e.props||{})};
    ELEMENT_PROP_DEFS.forEach(def=>{
      if(def.type==='list'){ const v = def.clean(rowLists[def.key]); if(v.length) props[def.key] = v; else delete props[def.key]; return; }
      const v = clampInt(qs('#elm-prop-'+def.key,overlay).value, def.min, def.max, 0);
      if(v>0) props[def.key] = v; else delete props[def.key];
    });
    const updated = {...e, name, props, tags: parseTags(qs('#elm-tags',overlay).value), color: qs('#elm-usecolor',overlay).checked ? qs('#elm-color',overlay).value : '', emoji: (qs('#elm-emoji',overlay).value||'').trim().slice(0,4)};
    if(isNew) S.elements.push(updated); else S.elements = S.elements.map(x=> x.id===updated.id ? updated : x);
    saveElements(S.elements); overlay.remove(); renderElementEditor();
  };
}

// A status's card-operation is restricted to configurations that resolve at the start of
// the player's turn (no "play for free" types, which could chain into further plays).
const STATUS_CARDOP_TYPES = CARDOP_TYPES;   // カード効果のカード操作と同じ種類・同じ設定項目

function newStatusEffect(kind){
  const e = {kind, magnitudeMode:'fixed', magnitudeValue:1};
  if(kind==='cardOp') e.op = defaultStatusOp();
  if(ELEMENT_KINDS.includes(kind)) e.element = 'all';
  if(ELEMENT_ATTACH_KINDS.includes(kind)) e.element = ((S.elements||[])[0]||{}).id || '';
  if(kind==='revive'){ e.reviveUnit = 'percent'; e.magnitudeValue = 30; }
  if(kind==='keepBlock'){ e.magnitudeValue = 100; e.keepCap = 0; }
  if(kind==='reflectDamage'){ e.rxVer = 2; e.reactions = [{id:newCapsuleId(), field:'damage', target:'opponent', source:'fixed', amount:1, perStack:true}]; }
  if(kind==='cardMod' || kind==='cardModPct'){ e.modField = 'damage'; e.modTag = ''; e.modTagMode = 'any'; e.decayOnUse = false; e.decayN = 1; }
  return e;
}
function cardModFieldOptionsHTML(cur){
  const opt = (key, label)=>`<option value="${escapeHtml(key)}" ${cur===key?'selected':''}>${escapeHtml(label)}</option>`;
  const flags = `<optgroup label="特性（プラスの効果量で付け、マイナスで外す）">${CARDMOD_FLAG_KEYS.map(k=>opt('flag:'+k, '特性：'+GRANT_FLAG_DEFS.find(d=>d.key===k).label)).join('')}</optgroup>`;
  return allEffectFieldDefs().map(def=>{
    if(!def._statusId) return opt(def.key, def.label);
    const nm = def.label.replace(/ 付与$/, '');
    return opt(def.key, `${nm} 付与（カードの付与先のまま）`) + ['self','opponent','both'].map(sc=>opt(`${def.key}@${sc}`, `${nm} 付与（${CARDMOD_SCOPE_LABEL[sc]}）`)).join('');
  }).join('') + flags;
}
function statusEffectLabel(kind){
  if(kind==='cardOp') return 'カード操作（プレイヤーのデッキを操作する）';
  return (CUSTOM_STATUS_KINDS.find(k=>k.key===kind)||{}).label || kind;
}
function statusEffectShort(eff){
  if(eff.kind==='cardOp'){
    const t = (STATUS_CARDOP_TYPES.find(x=>x.key===(eff.op||{}).type)||{}).label || '';
    return `カード操作（${t}）`;
  }
  return statusEffectLabel(eff.kind).replace(/（.*$/,'');
}
function statusEffectFormHTML(eff, i){

    ${DECIMAL_MAG_KINDS.includes(eff.kind) ? `<p class="hint">スタック数×係数のときは、係数に小数（例: 0.5）も使えます。計算結果は小数部分が切り捨てになります（例: 0.5×3スタック＝1、−0.5×3スタック＝−1）。</p>` : ''}

  } else if(eff.kind==='revive'){
    body = `${magHTML('復活時に回復するHP（固定値、または1スタックあたりの係数）')}
      <div class="field"><label>回復量の単位</label><select ${at} data-f="reviveUnit">
        <option value="fixed" ${eff.reviveUnit!=='percent'?'selected':''}>HPの固定値</option>
        <option value="percent" ${eff.reviveUnit==='percent'?'selected':''}>最大HPの％</option></select></div>
      <div class="field"><label>復活したときのスタックの消費</label><select ${at} data-f="reviveConsume" data-rerender="1">
        <option value="one" ${(eff.reviveConsume||'one')==='one'?'selected':''}>1つ消費する（スタック2なら2回復活できる）</option>
        <option value="n" ${eff.reviveConsume==='n'?'selected':''}>指定した数を消費する</option>
        <option value="all" ${eff.reviveConsume==='all'?'selected':''}>すべて消費する</option>
        <option value="keep" ${eff.reviveConsume==='keep'?'selected':''}>消費しない（ターンごとの減少などで消えるまで、何度でも復活）</option></select></div>
      ${eff.reviveConsume==='n' ? `<div class="field"><label>消費するスタック数（足りないときは、あるだけ消費）</label><input type="number" ${at} data-f="reviveConsumeN" data-num="1" value="${eff.reviveConsumeN||1}" min="1" max="99"></div>` : ''}
      <p class="hint">プレイヤーでも敵でも、この状態を持っている者のHPが0になると発動します。「効果量」はスタックを消費する前の値で計算します。</p>
      <div class="field"><label>復活時に付与する状態（復活した本人に付与）</label>
        ${(eff.reviveGrants||[]).map((g,j)=>{ const gs=(S.customStatuses||[]).find(x=>x.id===g.statusId);
          return `<div class="ev-add" style="margin-bottom:4px;"><span style="flex:1;">${gs ? escapeHtml((gs.emoji?gs.emoji+' ':'')+gs.name) : '（削除された状態）'}</span>
            <input type="number" data-gf="stacks" data-i="${i}" data-j="${j}" value="${g.stacks}" min="1" max="99" style="width:70px;">
            <button type="button" class="ghost" data-delgrant="${i}:${j}">削除</button></div>`; }).join('')}
        <div class="ev-add"><select data-grantpick="${i}">${(S.customStatuses||[]).map(x=>`<option value="${escapeHtml(x.id)}">${escapeHtml((x.emoji?x.emoji+' ':'')+x.name)}</option>`).join('')}</select>
          <button type="button" data-addgrant="${i}">＋ 追加</button></div>
      </div>`;
  } else if(ELEMENT_ATTACH_KINDS.includes(eff.kind)){
    const isGrant = eff.kind==='elGrant';
    body = `<div class="field"><label>${isGrant ? '付与する属性' : '取り除く属性'}</label><select ${at} data-f="element">
      ${isGrant ? '' : `<option value="all" ${eff.element==='all'?'selected':''}>すべての属性</option>`}
      <option value="" ${!eff.element?'selected':''} ${isGrant?'':'hidden'}>（選んでください）</option>
      ${isGrant ? (S.elements||[]).map(x=>`<option value="${escapeHtml(x.id)}" ${eff.element===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('') : elementSelectorOptionsHTML(eff.element, false, '')}</select></div>
      <p class="hint">${isGrant
        ? 'この状態を持っている間（スタック1以上）、持ち主が使う攻撃カードに、この属性が加わります。プレイヤーが持てば自分の攻撃、敵が持てば敵の攻撃が対象です。ダメージ計算・行動予告・ログに反映されます。'
        : 'この状態を持っている間（スタック1以上）、持ち主が使う攻撃から、この属性が外れます。「付与」のあとに処理するので、付与した属性も消せます。属性がなくなった攻撃には、属性補正が働きません。'}

  } else if(ELEMENT_KINDS.includes(eff.kind)){

    body = `<div class="field"><label>対象の属性</label><select ${at} data-f="element">
      ${elementSelectorOptionsHTML(eff.element, true, '全属性（属性を持つ攻撃すべてに加算）')}</select></div>
      ${magHTML(isPct ? '変化率（％。マイナスで軽減、プラスで増加。固定値、または1スタックあたりの係数）' : '加算するダメージ（マイナスで軽減。固定値、または1スタックあたりの係数）')}
      <p class="hint">「全属性」の効果は、攻撃が持つ属性ごとの補正に加算されます（掛け算ではありません）。属性を持たない攻撃には働きません。計算の位置は、与ダメージは強化・弱体と同じ段階、被ダメージは脆弱と同じ段階です。</p>`;
  } else if(eff.kind==='cardMod' || eff.kind==='cardModPct'){
    const isPct = eff.kind==='cardModPct';
    body = `${magHTML(isPct ? '増減させる％（マイナスで減少。例：50で1.5倍。固定値、または1スタックあたりの係数）' : '増減させる量（マイナスで減少。固定値、または1スタックあたりの係数）')}
      <div class="field"><label>増減させる効果</label><select ${at} data-f="modField">${cardModFieldOptionsHTML(eff.modField)}</select></div>
      ${tagPairHTML('field', '<label>この効果を出すカードのタグ（指定したタグのカードを使うときだけ働く。複数指定可・, 、 区切り。空欄なら、すべてのカード）</label>', at+' data-f="modTag"', eff.modTag, at+' data-f="modTagMode"', eff.modTagMode)}
      <label style="display:block; margin:6px 0;"><input type="checkbox" ${at} data-f="decayOnUse" ${eff.decayOnUse?'checked':''}> カードを使うたびにスタックを減らす（効果が出た使用だけ。タグを指定した場合は、そのタグのカードを使ったときだけ）</label>
      <div class="ev-eff-grid"><div><label>1回の使用で減らすスタック数</label><input type="number" ${at} data-f="decayN" data-num="1" value="${eff.decayN||1}" min="1" max="99"></div></div>
      <p class="ev-hint">${isPct ? '選んだ効果の値を、割合で増減します（端数は0に近いほうへ切り捨て）。固定値の増減を先に、％の増減をあとに計算します。' : ''}カスタム状態の付与を選ぶときは、「自分に与える分」「相手に与える分」「両方に与える分」を選べます。カードがその側に付与していない場合、固定値の増減ではその側への付与が新しく加わります（％の増減では、0のままです）。「付与（カードの付与先のまま）」は、カードに設定された付与量そのもの（両方に付与するカードでは、自分への量）を増減します。<br>状態を持っている本人（プレイヤーでも敵でも）が使うカードの、選んだ効果の値に上乗せします（元のカードは変わりません）。手札で表示されるカードの数字には反映されず、使ったときに働きます。使ったカードが予約（仕込み）なら、仕込んだ時点の値が発動のたびに使われます。複数の状態から同時に上乗せされる場合は、それぞれ別々に判定して減らします。「使うたびに減らす」は、タグが合わず効果が出なかった使用では減りません。</p>`;
  } else if(eff.kind==='reflectDamage'){
    const rxs = eff.reactions || [];

    const rxRows = rxs.map((g,j)=>`<div style="border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-bottom:6px;">
        <div class="ev-add" style="gap:6px; flex-wrap:wrap;"><select data-rx="field" data-i="${i}" data-j="${j}">${reactionFieldOptionsHTML(g.field)}</select>

          <input type="number" step="any" data-rx="amount" data-i="${i}" data-j="${j}" value="${g.amount}" style="width:90px;"><span>${g.source==='fixed' ? '' : '％'}</span>
          <label><input type="checkbox" data-rx="perStack" data-i="${i}" data-j="${j}" ${g.perStack!==false?'checked':''}> スタック数をかける</label>
          ${rxs.length>1 ? `<button type="button" class="ghost" data-delrx="${i}:${j}">削除</button>` : ''}</div></div>`).join('');
    body = `<div class="field"><label>反応の効果（攻撃を受けるたびに起こす効果。同じ種類の効果も、好きなだけ追加できます）</label>
        ${rxRows}<button type="button" data-addrx="${i}">＋ 効果を追加</button></div>
      <p class="ev-hint">敵の攻撃を受けたとき（プレイヤーが持つ場合）、またはプレイヤーの攻撃を受けたとき（敵が持つ場合）に、攻撃1回（多段攻撃なら1ヒット）ごとに発動します。毒や棘など、攻撃以外のダメージでは働きません。
      各効果で、何を与えるか（ダメージ・ブロック・回復・各種の状態・カスタム状態・ドロー・エネルギー）、与える先、値を決めます。「ダメージ」は、与える先のHPを直接減らします（ブロック無視）。状態は、排他の設定（カスタム状態）も働きます。
      「受けたダメージ」は、ブロックで防いだあとにHPが減った分、「ブロックで防いだ値」は、ブロックが受け止めた分です。％の計算は端数を切り捨てます。「スタック数をかける」をオフにすると、スタックが何個あっても1回分の値になります。
      何を与えるか・与える先が同じ効果が複数あるときは、攻撃を受けるたびに合計して1回で処理します（例：ダメージ4とダメージ6は、10ダメージを1回）。「ドロー」「エネルギー」は、与える先がプレイヤーのときだけ働きます。</p>`;
  } else if(eff.kind==='keepBlock'){
    body = `${magHTML('持ち越す割合（％。100ですべて、50で半分。固定値、または1スタックあたりの係数）')}
      <div class="ev-eff-grid"><div><label>持ち越す最大値（0で上限なし）</label><input type="number" ${at} data-f="keepCap" data-num="1" value="${eff.keepCap||0}" min="0" max="9999"></div></div>
      <p class="ev-hint">プレイヤーが持っているとき、自分のターン開始時に、前のターンの終わりに残っていたブロックのうち、割合ぶん（端数は切り捨て。最大値があれば、それまで）を残します。残りは消えます。そのあとに、自動ブロックなどで獲得するブロックが加わります。複数の状態を持っているときは、残せる量が最も大きいものを使います（足し算はしません）。敵のブロックは、もともと毎ターン持ち越されるので、敵が持っていても効果はありません。</p>`;
  } else if(eff.kind!=='cardOp'){
    body = magHTML('効果量（固定値、または1スタックあたりの係数）');
  } else {
    const op = eff.op || defaultStatusOp();
    const isGen = GENERATE_TYPES.includes(op.type);
    const sel = (f, list, cur)=>`<select ${opAt} data-f="${f}" ${f==='type'?'data-rerender="1"':''}>${list.map(o=>`<option value="${o.key}" ${o.key===cur?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select>`;
    const num = (f,label,val)=>`<div><label>${label}</label><input type="number" ${opAt} data-f="${f}" data-num="1" value="${val}" min="0" max="20"></div>`;
    body = `
      ${magHTML('操作を行う回数（固定値、または1スタックあたりの係数）')}
      <p class="ev-hint">プレイヤーがこの状態を持っている間（スタック1以上）、自分のターン開始時（手札を引いた後）に発動します。敵が持っている間は視点が反転し、敵のターン開始時に、敵自身のデッキに作用します（「手札に移動／山札に加える／捨て札に移動」はプレイヤーの山が対象で、プレイヤーの次のターン開始時（手札を引いた後）に処理されます。「敵のデッキに加える」は、プレイヤーの山札に今すぐ加わります）。設定項目はカード効果のカード操作と同じです。</p>
      <div class="field"><label>操作内容</label>${sel('type', STATUS_CARDOP_TYPES.filter(x=>x.key!=='captureEffect'||op.type==='captureEffect'), op.type)}</div>
      ${isGen
        ? `<div class="field"><label>生成元プール</label>${sel('genPool', genPoolOptionsFor(op.type), op.genPool)}</div>
           ${op.type==='generateToEnemyDeck' ? `<div class="ev-eff-grid"><div><label>敵のデッキでの重み（大きいほど選ばれやすい）</label><input type="number" ${opAt} data-f="deckWeight" data-num="1" value="${op.deckWeight||1}" min="1" max="99"></div></div>
           <label style="display:block; margin:6px 0;"><input type="checkbox" ${opAt} data-f="drawNext" ${op.drawNext?'checked':''}> 敵が持っているとき: 加えたカードを次のターンに必ず引く（山札の一番上に置く）</label>
           <p class="ev-hint">プレイヤーが持っているときは、敵のデッキ一覧に、この戦闘の間だけ追加されます。今の予告は変わらず、次の次の行動から反映されます。敵が持っているときは逆にプレイヤーの山札に加わり、次のターンの最初のドローより前に処理されます（チェックなしなら山札に混ざり、引くことがあります）。</p>` : ''}`
        : `<div class="field"><label>対象の山</label>${sel('fromPile', PILE_OPTIONS.filter(p=>p.key!=='self'), op.fromPile)}</div>`}
      <div class="field"><label>枚数の決め方</label><select ${opAt} data-f="countMode" data-rerender="1">
        <option value="fixed" ${op.countMode==='fixed'?'selected':''}>固定数</option>
        <option value="random" ${op.countMode==='random'?'selected':''}>ランダムな範囲</option>
        <option value="all" ${op.countMode==='all'?'selected':''}>対象すべて</option>
        <option value="choose" ${op.countMode==='choose'?'selected':''}>プレイヤーが任意に選ぶ（固定数ぶん、操作のたびに選択画面が出ます）</option></select></div>
      <div class="ev-eff-grid">${num('countFixed','固定数',op.countFixed)}${num('countMin','ランダム最小',op.countMin)}${num('countMax','ランダム最大',op.countMax)}</div>
      ${tagPairHTML('field', '<label>'+(isGen ? '生成の候補を、タグで絞り込む' : '対象タグ絞り込み')+'（複数指定可・, 、 区切り。空欄で絞り込みなし）</label>', opAt+' data-f="filterTag"', op.filterTag, opAt+' data-f="filterTagMode"', op.filterTagMode)}
      <label style="display:block; margin:6px 0;"><input type="checkbox" ${opAt} data-f="sequential" data-rerender="1" ${op.sequential?'checked':''}> 1枚ずつ選び直す（1枚処理するごとに、そのあとの山の状態から次を選ぶ）</label>
      ${(op.countMode==='choose' || op.sequential) ? '' : `<div class="field"><label>さらに選ぶ（対象になったカードから、さらに絞る。選ばれなかったカードには、この操作は何も起きません）</label><select ${opAt} data-f="pickMode" data-rerender="1">
        <option value="none" ${(op.pickMode!=='random' && op.pickMode!=='choose')?'selected':''}>さらに選ばない</option>
        <option value="random" ${op.pickMode==='random'?'selected':''}>ランダムに選ぶ</option>
        <option value="choose" ${op.pickMode==='choose'?'selected':''}>プレイヤーが選ぶ（選択画面が出ます）</option></select></div>
      ${(op.pickMode==='random' || op.pickMode==='choose') ? `<div class="ev-eff-grid"><div><label>選ぶ枚数</label><input type="number" ${opAt} data-f="pickCount" data-num="1" value="${op.pickCount||1}" min="1" max="20"></div></div>
      ${op.pickMode==='choose' ? `<label style="display:block; margin:6px 0;"><input type="checkbox" ${opAt} data-f="pickOptional" ${op.pickOptional?'checked':''}> 選ばなくてもよい（選ばないと、この操作は何も起きません）</label>` : ''}` : ''}`}
      ${CARDOP_REVERTIBLE_TYPES.includes(op.type) && op.type!=='moveToExhausted' ? `<label style="display:block; margin:6px 0;"><input type="checkbox" ${opAt} data-f="permanent" ${op.permanent?'checked':''}> 永続（戦闘が終わっても元に戻さない。チェックなしはこの戦闘中のみ）</label>` : ''}
      ${op.type==='moveToExhausted' ? `<div class="field"><label>消滅の期間</label><select ${opAt} data-f="exhaustMode">${EXHAUST_MODES.map(m=>`<option value="${m.key}" ${(op.exhaustMode||'combat')===m.key?'selected':''}>${escapeHtml(m.label)}</option>`).join('')}</select></div>` : ''}
      ${(op.type==='elementAdd'||op.type==='elementRemove') ? (()=>{
        const isAdd = op.type==='elementAdd';
        const opts = (isAdd ? [] : [['all','すべての属性']]).concat((S.elements||[]).map(x=>[x.id,x.name])).concat(isAdd ? [] : elementTagList().map(t=>['tag:'+t,'タグ「'+t+'」の属性すべて']));
        const cur = op.elementId || (opts[0]||[''])[0];
        if(!op.elementId) op.elementId = cur;
        return `<div class="field"><label>${isAdd?'付与する属性':'取り除く属性'}</label><select ${opAt} data-f="elementId">${opts.map(([k,l])=>`<option value="${escapeHtml(k)}" ${cur===k?'selected':''}>${escapeHtml(l)}</option>`).join('')}</select></div>
        <p class="hint">選ばれたカードの攻撃の属性が変わります（実効の属性。元のカード定義は変わりません）。「永続」で、戦闘後も残すか決めます。敵が持っている状態では、この操作は効果がありません。</p>`; })() : ''}
      ${op.type==='grantBuff' ? `<div class="field"><label>付与の方法</label><select ${opAt} data-f="buffMode"><option value="add" ${op.buffMode!=='set'?'selected':''}>加算（いまの値に足す）</option><option value="set" ${op.buffMode==='set'?'selected':''}>上書き（その値にする）</option></select></div>` : ''}
      ${(op.type==='grantBuff'||op.type==='costChange') ? `<label style="display:block; margin:6px 0;"><input type="checkbox" ${opAt} data-f="valueMode" data-valuemode="1" ${op.valueMode==='targetCount'?'checked':''}> 値を「設定値 × 対象の枚数」にする（絞り込みと選択が終わったあとの実際の枚数）</label>` : ''}
      ${op.type==='costChange' ? `<div class="field"><label>コストの増減量（マイナスで軽減。0未満にはならない）</label><input type="number" ${opAt} data-f="costDelta" data-num="1" value="${op.costDelta|0}" min="-9" max="9"></div>` : ''}
      ${op.type==='grantBuff' ? `
        <div class="field"><label>付与する効果</label><select ${opAt} data-f="buffField" data-rerender="1">
          ${allEffectFieldDefs().map(def=>`<option value="${escapeHtml(def.key)}" ${op.buffField===def.key?'selected':''}>${escapeHtml(def.label)}</option>`).join('')}</select></div>
        <div class="field"><label>付与量（マイナスで減少も可）</label><input type="number" ${opAt} data-f="buffAmount" data-num="1" value="${op.buffAmount||0}" min="-99" max="99"></div>
        ${String(op.buffField||'').startsWith('cs_') ? `<div class="field"><label>付与先（付与したカードを使ったとき、この状態をどちらに付与するか）</label><select ${opAt} data-f="buffTarget">${[['default','カード側の設定／状態の標準のまま'],['self','自分に付与'],['opponent','相手に付与']].map(([v,t])=>`<option value="${v}" ${(op.buffTarget||'default')===v?'selected':''}>${t}</option>`).join('')}</select></div>` : ''}
        <div class="field"><label>追加するタグ（複数指定可・, 、 区切り。空欄なら追加しない。付与量が0でもタグだけ追加できます）</label><input type="text" ${opAt} data-f="addTags" value="${escapeHtml(op.addTags||'')}" placeholder="例: 血,炎"></div>${grantFlagsHTML(op, p=>`${opAt} data-f="${p}"`, tx=>`<label>${tx}</label>`)}` : ''}`;
  }
  return `<div class="ev-eff">
    <div class="ev-eff-head"><span>${escapeHtml(statusEffectLabel(eff.kind))}</span><button type="button" class="ghost" data-del="${i}">削除</button></div>
    ${body}
    ${eff.kind==='revive' ? '' : `<div class="ev-eff-grid" style="margin-top:6px;">
      <div><label>HP条件（この効果が働くとき）</label><select ${at} data-f="hpCondOp">
        <option value="" ${!eff.hpCondOp?'selected':''}>常に働く</option>
        <option value="le" ${eff.hpCondOp==='le'?'selected':''}>持ち主のHPが○％以下のとき</option>
        <option value="ge" ${eff.hpCondOp==='ge'?'selected':''}>持ち主のHPが○％以上のとき</option></select></div>
      <div><label>基準のHP（％）</label><input type="number" ${at} data-f="hpCondPct" data-num="1" value="${eff.hpCondPct===undefined?50:eff.hpCondPct}" min="0" max="100"></div></div>`}
  </div>`;
}

function openBuiltinStatusModal(id){
  const d = bsDef(id); if(!d) return;
  const overlay = el(`<div class="modal-overlay">
    <div class="modal-box">
      <h3 data-noblock>組み込みの状態を編集（${escapeHtml(d.name)}）</h3>
      <div class="field"><label>名前（12文字まで。空欄でもとの名前）</label><input type="text" data-noblock id="bm-name" value="${escapeHtml(bsRenamed(id) ? bsName(id) : '')}" placeholder="${escapeHtml(d.name)}" maxlength="12"></div>
      <div class="field"><label>絵文字（3文字まで。空欄でもとの絵文字）</label><input type="text" id="bm-emoji" value="${escapeHtml(bsCfg(id).emoji||'')}" placeholder="${escapeHtml(d.emoji)}" maxlength="6"></div>
      <div class="field"><label>タグ（カンマ・読点区切りで複数入力可。空欄で、タグなし）</label><input type="text" id="bm-tags" value="${escapeHtml(bsTags(id).join(', '))}">
        <p class="hint">初期値は、もとの名前のタグ「${escapeHtml(d.name)}」1個です。名前を変えても、タグは変わりません。タグを変えると、そのタグを指定しているカード・状態・敵の条件（状態の操作、参照増減、使用条件など）の対象も変わります。「初期値に戻す」で、名前・絵文字・タグ・効果の数値をすべてもとに戻せます。</p></div>
      ${Object.keys(BS_PARAM_DEFS[id]||{}).length ? `<div class="section-label">効果の数値</div>
      ${Object.entries(BS_PARAM_DEFS[id]).map(([k,pd])=>`<div class="field"><label>${pd.label}（初期値 ${pd.def}）</label><input type="number" id="bm-p-${k}" value="${bsParam(id,k)}" min="${pd.min}" max="${pd.max}" step="${pd.step}"></div>`).join('')}
      <p class="hint">数値を初期値に戻すと、もとの挙動になります。小数のダメージ・回復・ブロックは、切り捨てて計算します。</p>` : `<p class="hint">この状態の効果の数値は、いまのところ編集できません。</p>`}
      <div class="modal-actions">
        <button id="bm-reset">初期値に戻す</button>
        <button id="bm-cancel">キャンセル</button>
        <button class="primary" id="bm-save">保存する</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const commit = (cfg)=>{
    const cur = {...(S.builtinStatuses||{})};
    if(cfg) cur[id] = cfg; else delete cur[id];
    S.builtinStatuses = cleanBuiltinStatuses(cur); saveBuiltinStatuses(S.builtinStatuses);
    overlay.remove(); renderStatusEditor();
  };
  qs('#bm-cancel',overlay).onclick = ()=> overlay.remove();
  qs('#bm-reset',overlay).onclick = ()=> commit(null);
  qs('#bm-save',overlay).onclick = ()=>{
    const tagsText = qs('#bm-tags',overlay).value;
    const params = {}; Object.keys(BS_PARAM_DEFS[id]||{}).forEach(k=>{ const inp = qs('#bm-p-'+k,overlay); if(inp) params[k] = inp.value; });
    commit({name: qs('#bm-name',overlay).value, emoji: qs('#bm-emoji',overlay).value, tags: tagListOf(tagsText), params});
  };
}
function openStatusModal(status, isNew){
  const st = JSON.parse(JSON.stringify(status));
  if(!Array.isArray(st.effects)) st.effects = [];
  const addOptions = CUSTOM_STATUS_KINDS.map(k=>({key:k.key, label:k.label}));
  const overlay = el(`<div class="modal-overlay">
    <div class="modal-box">
      <h3>${isNew? '状態を新規作成' : '状態を編集'}</h3>
      <div class="field"><label>名前</label><input type="text" id="sm-name" value="${escapeHtml(st.name)}"></div>
      <div class="field"><label>絵文字</label><input type="text" id="sm-emoji" value="${escapeHtml(st.emoji||'')}" maxlength="4"></div>
      <div class="checkbox-field"><input type="checkbox" id="sm-usecolor" ${st.color?'checked':''}><label for="sm-usecolor">付与されたときのエフェクトの色を指定する（オフなら、対象が自分の状態は「良い状態」、敵の状態は「悪い状態」の色）</label></div>
      <div class="field"><input type="color" id="sm-color" value="${st.color||'#D4A73E'}" style="width:100%; height:38px; padding:2px;"></div>
      <div class="field"><label>タグ（カンマ区切りで複数入力可）</label><input type="text" id="sm-tags" value="${escapeHtml((st.tags||[]).join(', '))}" placeholder="例: 強化">
        <p class="hint">タグ「強化」を付けると、強化と同類として扱われ、カードの「敵の強化を減少させる」の影響を受けます。カードの「参照増減」では、参照元に「自分／敵の指定タグの状態スタック数（合計）」を選び、参照タグに同じタグを入れると、同じタグを持つ複数の状態の合計に反応させられます（組み込みの強化・器用・弱体・脆弱・毒・再生・麻痺・自動ブロック・棘も、それぞれのタグを持つものとして数えます。タグの初期値は、もとの名前です。「状態の編集」画面の「組み込みの状態」で変えられます）。</p></div>
      <div class="field"><label>標準の付与先（カードでは、カードごとに「自分に／相手に」を変更できます。レリック・イベント・敵の戦闘開始時効果は、この設定に従います）</label>
        <select id="sm-target">
          <option value="self" ${st.target==='self'?'selected':''}>自分</option>
          <option value="opponent" ${st.target==='opponent'?'selected':''}>相手</option>
        </select>
        <p class="hint">敵の技が付与する場合は立場が逆になります。「相手」＝プレイヤーが受け取る、「自分」＝敵自身が受け取る。敵からプレイヤーに付与したい状態は「相手」にしてください。</p>
      </div>
      <div class="field"><label>ターンごとの増減（自分のターン開始時。マイナスで減少、プラスで増加、0で変化なし）</label><input type="number" id="sm-perturndelta" value="${st.perTurnDelta||0}" min="-99" max="99"></div>
      <p class="hint">対象が「自分」の毒・脆弱のような減衰は、ここを-1にすると再現できます。強化・自動ブロックのように戦闘中ずっと残したいなら0のままにします。</p>
      <div class="checkbox-field"><input type="checkbox" id="sm-persistent" ${st.persistent?'checked':''}><label for="sm-persistent">戦闘が終わっても残す（永続。チェックなしなら、戦闘ごとに消えます）</label></div>
      <div class="section-label">効果（複数追加できます。すべて同時に働きます）</div>
      <div id="sm-effects"></div>
      <div class="ev-add"><select id="sm-addkind">${addOptions.map(o=>`<option value="${o.key}">${escapeHtml(o.label)}</option>`).join('')}</select><button type="button" id="sm-addbtn">＋ 効果を追加</button></div>
      <div class="ev-add" style="margin-top:6px;"><button type="button" id="sm-addop" style="flex:1;">＋ カード操作を追加（手札を捨てさせる・カードを生成する など）</button></div>
      <div class="section-label">排他（付与のときの、他の状態との共存ルール）</div>
      <div class="field"><label>① 付与する前に、これらのタグの状態をすべて取り除く（カンマ区切り）</label><input type="text" id="sm-excl-overwrite" value="${escapeHtml((st.exclOverwrite||[]).join(', '))}" placeholder="例: 属性, 脆弱"></div>
      <div class="field"><label>② これらのタグの状態が付与されている間は、自分を付与しない（カンマ区切り）</label><input type="text" id="sm-excl-yield" value="${escapeHtml((st.exclYield||[]).join(', '))}" placeholder="例: 強化">
        <p class="hint">組み込みの強化・器用・弱体・脆弱・毒・再生・麻痺・自動ブロック・棘も、同名のタグとして指定できます（永続の強化・器用などは①の取り除きの対象外）。自分自身のタグは数えないので、全部の状態に同じタグを付けて、自分にも同じタグを指定しても、同じ状態は重ね掛けできます。判定は付与のときだけで、ターンごとの増減では働きません。②は①より先に判定します。</p></div>
      <div class="field"><label>③ これらのタグの状態が後から付与されたら、自分が消える（カンマ区切り）</label><input type="text" id="sm-excl-replaced" value="${escapeHtml((st.exclReplaced||[]).join(', '))}" placeholder="例: 属性"></div>
      <div class="field"><label>④ 自分がいる間、これらのタグの状態の付与を無効にする（カンマ区切り）</label><input type="text" id="sm-excl-guard" value="${escapeHtml((st.exclGuard||[]).join(', '))}" placeholder="例: 脆弱">
        <p class="hint">③④は、組み込みの状態（強化・弱体・脆弱など）が付与されるときにも働きます。例: ④に「脆弱」を入れると、この状態がある間は脆弱を受けません。複数が重なるときの判定の順は、④（守る）→②（先着に負ける）→①（上書きする）→付与→③（後から上書きされる）です。</p></div>
      <p class="hint">カード操作は、この状態を持っている側のデッキへ、ターン開始時（手札を引いた後）に行われます。敵が持つ場合は視点が反転し、敵自身のデッキへ作用します（「敵のデッキに加える」だけはプレイヤーの山札）。いくつでも追加できます。</p>
      <div class="modal-actions">
        <button class="ghost" id="sm-cancel">キャンセル</button>
        <button class="primary" id="sm-save">保存する</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const box = qs('#sm-effects', overlay);
  function renderEffects(){
    box.innerHTML = st.effects.length
      ? st.effects.map(statusEffectFormHTML).join('')
      : `<p class="ev-hint">効果がありません（下のメニューから追加してください）。</p>`;
  }
  function sync(t){
    const f = t.dataset && t.dataset.f;
    if(!f) return;
    const eff = st.effects[parseInt(t.dataset.i,10)];
    if(!eff) return;
    const obj = t.dataset.op ? eff.op : eff;
    if(t.dataset.num){ const v = t.dataset.num==='float' ? parseFloat(t.value) : parseInt(t.value,10); obj[f] = isNaN(v) ? 0 : v; }
    else if(t.dataset.valuemode) obj[f] = t.checked ? 'targetCount' : 'fixed';
    else if(t.type==='checkbox') obj[f] = t.checked;
    else obj[f] = t.value;
  }
  function rxSync(t){
    const eff = st.effects[+t.dataset.i]; const g = eff && eff.reactions && eff.reactions[+t.dataset.j]; if(!g) return false;
    const k = t.dataset.rx;
    if(k==='perStack') g[k] = t.checked;
    else if(k==='amount'){ const v = parseFloat(t.value); g[k] = isNaN(v) ? 0 : v; }
    else g[k] = t.value;
    return true;
  }
  box.addEventListener('input', e=>{
    if(e.target.dataset && e.target.dataset.rx!==undefined){ rxSync(e.target); return; }
    if(e.target.dataset && e.target.dataset.gf){ const g = (st.effects[+e.target.dataset.i]||{}).reviveGrants||[]; if(g[+e.target.dataset.j]) g[+e.target.dataset.j].stacks = Math.max(1, Math.min(99, parseInt(e.target.value,10)||1)); return; }
    sync(e.target);
  });
  box.addEventListener('change', e=>{
    if(e.target.dataset && e.target.dataset.rx!==undefined){ if(rxSync(e.target) && e.target.dataset.rx==='source') renderEffects(); return; }
    sync(e.target);
    if(e.target.dataset && e.target.dataset.rerender) renderEffects();
  });
  box.addEventListener('click', e=>{
    const ag = e.target.closest('[data-addgrant]');
    if(ag){
      const i = +ag.dataset.addgrant, eff = st.effects[i];
      const sel = box.querySelector(`select[data-grantpick="${i}"]`);
      if(eff && sel && sel.value){ (eff.reviveGrants = eff.reviveGrants||[]).push({statusId:sel.value, stacks:1}); renderEffects(); }
      return;
    }
    const arx = e.target.closest('[data-addrx]');
    if(arx){
      const eff = st.effects[+arx.dataset.addrx];
      if(eff){ (eff.reactions = eff.reactions||[]).push({id:newCapsuleId(), field:'damage', target:'opponent', source:'fixed', amount:1, perStack:true}); renderEffects(); }
      return;
    }
    const drx = e.target.closest('[data-delrx]');
    if(drx){
      const [i,j] = drx.dataset.delrx.split(':').map(Number);
      const eff = st.effects[i]; if(eff && eff.reactions && eff.reactions.length>1){ eff.reactions.splice(j,1); renderEffects(); }
      return;
    }
    const dg = e.target.closest('[data-delgrant]');
    if(dg){
      const [i,j] = dg.dataset.delgrant.split(':').map(Number);
      const eff = st.effects[i]; if(eff && eff.reviveGrants){ eff.reviveGrants.splice(j,1); renderEffects(); }
      return;
    }
    const b = e.target.closest('[data-del]');
    if(!b) return;
    st.effects.splice(parseInt(b.dataset.del,10),1);
    renderEffects();
  });
  qs('#sm-addbtn',overlay).onclick = ()=>{
    st.effects.push(newStatusEffect(qs('#sm-addkind',overlay).value));
    renderEffects();
  };
  qs('#sm-addop',overlay).onclick = ()=>{
    st.effects.push(newStatusEffect('cardOp'));
    renderEffects();
  };
  renderEffects();
  qs('#sm-cancel',overlay).onclick = ()=> overlay.remove();
  bindTagPairs(overlay);
  qs('#sm-save',overlay).onclick = ()=>{
    const updated = normalizeCustomStatus({
      id: st.id,
      tags: parseTags(qs('#sm-tags',overlay).value),
      name: qs('#sm-name',overlay).value.trim() || '無名の状態',
      emoji: (qs('#sm-emoji',overlay).value||'').trim(),
      color: qs('#sm-usecolor',overlay).checked ? qs('#sm-color',overlay).value : '',
      target: qs('#sm-target',overlay).value,
      perTurnDelta: clampInt(qs('#sm-perturndelta',overlay).value,-99,99,0),
      persistent: qs('#sm-persistent',overlay).checked,
      exclOverwrite: parseTags(qs('#sm-excl-overwrite',overlay).value),
      exclYield: parseTags(qs('#sm-excl-yield',overlay).value),
      exclReplaced: parseTags(qs('#sm-excl-replaced',overlay).value),
      exclGuard: parseTags(qs('#sm-excl-guard',overlay).value),
      effects: st.effects,
    });
    if(isNew){ S.customStatuses.push(updated); }
    else{ S.customStatuses = S.customStatuses.map(x=> x.id===updated.id? updated : x); }
    saveCustomStatuses(S.customStatuses);
    overlay.remove();
    renderStatusEditor();
  };
}

  const renderUseCards = ()=>{
    qs('#rm-usecards-list',overlay).innerHTML = useCardIds.length
      ? useCardIds.map((id,i)=>{ const cc = cardById(id); return `<div class="ev-add" style="margin-bottom:4px;"><span style="flex:1;">${i+1}. ${escapeHtml(cc?cc.name:id)}</span><button type="button" class="ghost" data-delusecard="${i}">削除</button></div>`; }).join('')
      : '<p class="hint">カードが設定されていません。</p>';
  };
  qs('#rm-usecards-add',overlay).onclick = ()=>{ const v = qs('#rm-usecards-pick',overlay).value; if(v){ useCardIds.push(v); renderUseCards(); } };
  qs('#rm-usecards-list',overlay).addEventListener('click', e=>{ const b = e.target.closest('[data-delusecard]'); if(b){ useCardIds.splice(+b.dataset.delusecard,1); renderUseCards(); } });
  renderUseCards();
  let gainCards = (Array.isArray(rel.gainCards) ? rel.gainCards : []).map(g=>({...g}));
  const renderGain = ()=>{
    qs('#rm-gain-list',overlay).innerHTML = gainCards.length
      ? gainCards.map((g,i)=>{ const cc = cardById(g.cardId); return `<div class="ev-add" style="margin-bottom:4px;"><span style="flex:1;${cc?'':' color:#ff8f86;'}">${i+1}. ${escapeHtml(cc?cc.name:'（削除されたカード）')}</span><button type="button" class="ghost" data-gainup="${i}" ${i===0?'disabled':''}>↑</button><button type="button" class="ghost" data-gaindown="${i}" ${i===gainCards.length-1?'disabled':''}>↓</button><button type="button" class="ghost" data-delgain="${i}">削除</button></div>`; }).join('')
      : '<p class="hint">カードが設定されていません。</p>';
    const warn = [];
    if(qs('#rm-replacestart',overlay).checked && !gainCards.some(g=>cardById(g.cardId))) warn.push('開始デッキの置き換えが有効ですが、有効なカードが設定されていません。ゲーム開始時、このレリックの開始デッキは空になります。');
    if(gainCards.some(g=>!cardById(g.cardId))) warn.push('削除されたカードの指定があります。ゲーム中は無視されます。');
    const wEl = qs('#rm-gain-warn',overlay); wEl.textContent = warn.join(' '); wEl.style.display = warn.length ? '' : 'none';
  };
  qs('#rm-gain-add',overlay).onclick = ()=>{ const v = qs('#rm-gain-pick',overlay).value; if(v && gainCards.length<60){ gainCards.push({id:newCapsuleId(), cardId:v}); renderGain(); } };
  qs('#rm-replacestart',overlay).onchange = renderGain;
  qs('#rm-gain-list',overlay).addEventListener('click', e=>{
    const d = e.target.closest('[data-delgain]'), u = e.target.closest('[data-gainup]'), dn = e.target.closest('[data-gaindown]');
    if(d){ gainCards.splice(+d.dataset.delgain,1); renderGain(); }
    else if(u && +u.dataset.gainup>0){ const i = +u.dataset.gainup; [gainCards[i-1],gainCards[i]] = [gainCards[i],gainCards[i-1]]; renderGain(); }
    else if(dn && +dn.dataset.gaindown<gainCards.length-1){ const i = +dn.dataset.gaindown; [gainCards[i+1],gainCards[i]] = [gainCards[i],gainCards[i+1]]; renderGain(); }
  });
  renderGain();
  qs('#rm-timing',overlay).onchange = ()=>{
    const t = qs('#rm-timing',overlay).value;
    qs('#rm-usecards',overlay).style.display = (t==='combatStart'||t==='turnStart') ? 'block' : 'none';
    qs('#rm-usecards-label',overlay).textContent = t==='turnStart' ? 'ターン開始時に使用するカード' : '戦闘開始時に使用するカード';
    qs('#rm-turn-field',overlay).style.display = t==='turnStart' ? 'block' : 'none';
    qs('#rm-tag-field',overlay).style.display = t==='onTagCardUsed' ? 'block' : 'none';
    qs('#rm-effect-label',overlay).textContent = t==='onPickup' ? '効果（入手時に一度だけ適用）' : '効果（このタイミングになるたび発動）';
    qs('#rm-effect-fields',overlay).innerHTML = relicEffectFieldsHTML(t, rel.effect);
    const hint = qs('#rm-hint',overlay);
    hint.textContent = relicTimingHint(t);
    hint.style.display = relicTimingHint(t) ? '' : 'none';
  };
  bindTagPairs(overlay);
  qs('#rm-save',overlay).onclick = ()=>{
    const t = qs('#rm-timing',overlay).value;
    const updated = {
      id: rel.id,
      name: qs('#rm-name',overlay).value.trim() || '無名のレリック',
      rarity: qs('#rm-rarity',overlay).value,
      timing: t,
      triggerTag: cleanTagList(qs('#rm-triggertag',overlay).value),
      triggerTagMode: cleanTagMode(qs('#rm-triggertagmode',overlay).value),
      favorTag: cleanTagList(qs('#rm-favortag',overlay).value),
      favorTagMode: cleanTagMode(qs('#rm-favortagmode',overlay).value),
      favorPct: clampInt(qs('#rm-favorpct',overlay).value,0,1000,0),
      startingCount: clampInt(qs('#rm-startcount',overlay).value,0,9,0),
      useLimit: qs('#rm-limited',overlay).checked ? clampInt(qs('#rm-uselimit',overlay).value,1,99,1) : 0,
      useScope: qs('#rm-usescope',overlay).value,
      shopPrice: clampInt(qs('#rm-shopprice',overlay).value,0,9999,0),
      useCardIds: (t==='combatStart'||t==='turnStart') ? useCardIds.slice() : [],
      turnCond: t==='turnStart' ? qs('#rm-turncond',overlay).value : 'always',
      turnN: clampInt(qs('#rm-turnn',overlay).value,1,99,1),
      gainMode: qs('#rm-gainmode',overlay).value,
      gainCards: gainCards.map(g=>({...g})),
      replaceStart: qs('#rm-replacestart',overlay).checked,
      effect: {},
    };
    relicFieldDefsFor(t).forEach(def=>{
      const input = qs(`#rm-eff-${def.key}`,overlay);
      if(input) updated.effect[def.key] = clampInt(input.value,0,def.max||99,0);
    });
    RELIC_PASSIVE_FIELDS.forEach(f=>{ const input = qs(`#rm-eff-${f.key}`,overlay); if(input) updated.effect[f.key] = clampInt(input.value,0,f.max,0); });
    if(isNew){ S.relics.push(updated); }
    else{ S.relics = S.relics.map(x=> x.id===updated.id? updated : x); }
    { const chk = new Set(checkedCharTagIds(overlay, 'relic'));
      (S.charTags||[]).forEach(t=>{
        const has = (t.unlockRelicIds||[]).includes(updated.id);
        if(chk.has(t.id) && !has) t.unlockRelicIds = [...(t.unlockRelicIds||[]), updated.id];
        else if(!chk.has(t.id) && has) t.unlockRelicIds = t.unlockRelicIds.filter(x=>x!==updated.id);
      });
      saveCharTags(S.charTags); }
    saveRelics(S.relics);
    overlay.remove();
    renderRelicEditor();
  };
}

// 山札から引いたとき（dw）／消滅したとき（ex）の効果の編集欄。本体の効果とは別の、同じ種類の数値効果の組
const PILE_EFFECT_KINDS = {
  dw:{title:'ドロー時効果（本体の効果とは別に、山札から引いた瞬間に発動）', name:'ドロー時効果', hint:'使わなくても、手札に引いた時点で発動します。カスタム状態の付与も選べます（付与先も指定可）。参照増減・カード操作・発動回数は使えません。', defs:()=>drawEffectFieldDefs()},
  ho:{title:'所持効果（本体の効果とは別に、このカードが指定の山にあるとき、毎ターンの開始時に発動）', name:'所持効果', hint:'指定した山（手札・山札・捨て札・消滅済み・どこでも）にこのカードがあるとき、自分のターン開始時（ドロー・仕込みのあと、レリックの前）に、1枚ごとに発動します。同じカードが複数あれば、それぞれ発動します。使わなくても発動します。カスタム状態の付与も選べます（付与先も指定可）。参照増減・カード操作・発動回数は使えません。敵が持つカードには働きません。', defs:()=>holdEffectFieldDefs()},
  ex:{title:'消滅時効果（本体の効果とは別に、このカードが消滅した瞬間に発動）', name:'消滅時効果', hint:'このカードが消滅した時点で発動します（使用後の消滅・カード操作による消滅のどちらでも。「デッキから完全に取り除く」場合も発動します）。カスタム状態の付与も選べます（付与先も指定可）。参照増減・カード操作・発動回数は使えません。', defs:()=>exhaustEffectFieldDefs()},
};
function pileEffectSectionHTML(c, kind){
  const P = PILE_EFFECT_KINDS[kind], pre = kind+'_';
  const holdSel = kind==='ho' ? `<div class="field"><label>発動する山（このカードがどこにあるとき、ターン開始時に発動するか）</label><select id="m-holdpile">${HOLD_PILE_OPTIONS.map(o=>`<option value="${o.key}" ${holdPileOf(c)===o.key?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select></div>` : '';
  return `<div class="section-label">${P.title}</div>
      <p class="hint">${P.hint}</p>
      ${holdSel}
      ${fxPickerHTML(kind,P.name)}
      ${P.defs().map(def=>{
        const id = def._statusId;
        const dwT = id && ['self','opponent','both'].includes(c[pre+'csT_'+id]) ? c[pre+'csT_'+id] : 'default';
        const dwX = id ? ((c[pre+'csX_'+id])|0) : 0;
        const on = (c[def.key]||0)!==0 || (id && (dwT!=='default' || dwX!==0));
        const st = id ? (S.customStatuses||[]).find(x=>x.id===id) : null;
        const std = st && st.target==='opponent' ? '相手' : '自分';
        const csExtra = id ? `
        <div style="margin-bottom:4px;"><span style="font-size:10px; color:var(--parchment-dim);">付与先：</span>
          <select id="m-${kind}cst-${id}" style="width:auto; display:inline-block;">
            <option value="default" ${dwT==='default'?'selected':''}>状態の標準（${std}）</option>
            <option value="self" ${dwT==='self'?'selected':''}>自分に付与</option>
            <option value="opponent" ${dwT==='opponent'?'selected':''}>相手に付与</option>
            <option value="both" ${dwT==='both'?'selected':''}>自分と相手の両方に付与（量を別々に設定）</option>
          </select>
          <span class="dw-both-note" style="font-size:10px; color:var(--parchment-dim); ${dwT==='both'?'':'display:none;'}">下の値＝自分への量</span></div>
        <div class="dw-both-box" style="margin-bottom:6px; ${dwT==='both'?'':'display:none;'}">
          <div style="font-size:10px; color:var(--parchment-dim); margin-bottom:2px;">相手への量</div>
          <input type="number" id="m-${kind}csx-${id}" value="${dwX}" min="-99" max="99">
        </div>` : '';
        return `
      <div class="field fx-row" data-group="${kind}" data-fx="${escapeHtml(def.key)}" data-label="${escapeHtml(def.label)}" style="${on?'':'display:none;'}">
        <div style="display:flex; justify-content:space-between; align-items:center;"><label>${escapeHtml(def.label)}</label><button type="button" class="ghost fx-del">削除</button></div>${csExtra}
        <input type="number" id="m-${def.key}" value="${c[def.key]||0}" min="${def.min!==undefined?def.min:0}" max="${def.max}">
      </div>`;}).join('')}`;
}

// ゲーム開始時のレリックによる開始デッキの置き換え対象: メインキャラクターが開始時に獲得するレリックのうち、置き換えを有効にしたもの。
// （メインのレリックを飛ばす設定のときは、獲得しないので対象外。一般の開始時所持レリックや、探索中に入手したレリックは対象外）
function startReplaceRelics(){
  const f = curFormation(), mt = f.mainId ? charTagById(f.mainId) : null;
  if(!mt || f.skipMain) return [];
  return (mt.mainRelicIds||[]).map(id=>S.relics.find(x=>x.id===id)).filter(rel=>rel && rel.replaceStart);
}
// 開始デッキの組み立て。置き換え指定が1つでもあれば、カード編集の開始枚数（startingCount）は使わず、各レリックの指定カードを設定順にすべて入れる。
// 置き換えのリストが空でも、標準の開始デッキや予備のカードへは戻さない（notices で、設定の不備を案内する）。
function startingDeckPlan(){
  const reps = startReplaceRelics();
  if(reps.length){
    const ids = [], notices = [];
    reps.forEach(rel=>{
      const rows = rel.gainCards || [], ok = rows.filter(g=>cardById(g.cardId));
      ok.forEach(g=>ids.push(g.cardId));
      if(!rows.length) notices.push(`レリック「${rel.name}」は開始デッキの置き換えが有効ですが、入手するカードが設定されていません。このレリックからは、開始デッキにカードが入りません。`);
      else if(ok.length<rows.length) notices.push(`レリック「${rel.name}」に、削除されたカードの指定が${rows.length-ok.length}件あります。そのカードは開始デッキに入りません。`);
    });
    if(!ids.length) notices.push('開始デッキが空です。レリックの「開始デッキの置き換え」の設定を確認してください。');
    return {ids, replaced:true, notices};
  }
  const deck = [];
  S.cards.forEach(c=>{
    if(isNonRewardCard(c)) return;
    for(let i=0;i<(c.startingCount||0);i++) deck.push(c.id);
  });
  if(deck.length===0){ // fallback safety
    deck.push('strike','strike','strike','defend','defend');
  }
  return {ids:deck, replaced:false, notices:[]};
}
function buildStartingDeck(){ return startingDeckPlan().ids; }
// ---- レリック獲得時のカード入手
// 強制: 設定の全行を、1行1枚として加える（同じカードの複数行は複数枚）。任意: 候補から好きなだけ（0枚でも）選ぶ。選択は processRelicCardQueue で、1つずつ順番に行う。
function addRelicCards(r, ids){
  ids.forEach(id=>{ if(r.startPhase) r.draw.push(id); else r.discard.push(id); noteCardAcquired(r, id); });
  if(r.startPhase) r.draw = shuffle(r.draw);
}
function relicGainCards(r, relic, opts){
  if(opts && opts.replacedStart) return;   // 開始デッキの置き換えで、すでに開始デッキへ入れている
  if(relic.gainMode!=='optional' && relic.gainMode!=='forced') return;
  const ids = (relic.gainCards||[]).map(g=>g.cardId).filter(id=>cardById(id));
  if(!ids.length) return;
  if(relic.gainMode==='forced'){
    addRelicCards(r, ids);
    pushLog(`${relic.name}：カードを${ids.length}枚入手した（${ids.map(id=>cardById(id).name).join('、')}）。`);
  } else {
    (r.relicCardQueue = r.relicCardQueue || []).push({relicId:relic.id, name:relic.name, ids});
  }
}
function processRelicCardQueue(next){
  const r = S.run, q = r && r.relicCardQueue;
  if(!q || !q.length){ if(next) next(); return; }
  const entry = q.shift();
  renderRelicCardPick(entry, ()=> processRelicCardQueue(next));
}
function renderRelicCardPick(entry, done){

      <div class="reward-row" id="rcp-row">

      </div>
